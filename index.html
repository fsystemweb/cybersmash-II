      rig.add('torso', box(0.02, 0.09, 0.02), 0x3a6ad8, { p: [0.15, 0.35, 0.15] });                  // pen
      // lab-coat skirt rides on each thigh so kicks lift it naturally
      rig.add('hipL', box(0.21, 0.38, 0.28), COAT, { p: [0, -0.14, 0] });
      rig.add('hipR', box(0.21, 0.38, 0.28), COAT, { p: [0, -0.14, 0] });
      hairCap(rig, 'head', 0x2a221c);
      face(rig, { brow: 0x2a221c, browTilt: 0.02, mouthW: 0.12 });
      return { eyeOpen: 0.75, mouthCurve: true, update() {} };
    },
    hwatt(rig) {
      const SK = 0xe8c09a, LEATHER = 0x18181e, TEE = 0x26262c, JEANS = 0x1c1c24;
      baseBody(rig, { skin: SK, shirt: LEATHER, shirtKind: 'gloss', pants: JEANS, shoes: 0x101010 });
      rig.add('torso', box(0.13, 0.2, 0.02), TEE, { p: [0, 0.33, 0.142] });
      rig.add('torso', box(0.13, 0.26, 0.05), LEATHER, { p: [0.1, 0.33, 0.15], r: [0, 0, -0.35] }, 'gloss'); // collar
      rig.add('torso', box(0.13, 0.26, 0.05), LEATHER, { p: [-0.1, 0.33, 0.15], r: [0, 0, 0.35] }, 'gloss');
      rig.add('torso', box(0.015, 0.34, 0.01), 0xc8c8d0, { p: [0.12, 0.18, 0.146] });                     // zipper
      hairCap(rig, 'head', 0x5e5e66, { z: -0.06 });
      rig.add('head', box(0.42, 0.09, 0.3), 0x8a8a92, { p: [0, 0.74, 0.02], r: [-0.25, 0, 0] });              // swept-back silver
      face(rig, { brow: 0x3a3a40, browTilt: 0.05, mouthW: 0.17, mouthH: 0.05, teeth: true });
      for (const sx of [1, -1]) {                                                                           // rectangular glasses
        rig.add('head', box(0.14, 0.02, 0.02), 0x1a1a1a, { p: [sx * 0.12, 0.42, 0.34] });
        rig.add('head', box(0.14, 0.02, 0.02), 0x1a1a1a, { p: [sx * 0.12, 0.33, 0.345] });
        rig.add('head', box(0.02, 0.1, 0.02), 0x1a1a1a, { p: [sx * 0.19, 0.375, 0.335] });
      }
      rig.add('head', box(0.06, 0.02, 0.02), 0x1a1a1a, { p: [0, 0.4, 0.36] });
      // the trophy chip, only shown in the victory pose
      rig.pivot('chip', 'handR', [0, -0.05, 0.12]);
      rig.add('chip', box(0.36, 0.04, 0.26), 0x2f8a3a, {});
      rig.add('chip', box(0.16, 0.05, 0.12), 0x1a1a1a, { p: [0, 0.03, 0] });
      rig.add('chip', box(0.08, 0.055, 0.06), 0x8ad03a, { p: [0, 0.035, 0] });
      return { eyeOpen: 0.85, update(dt, f) { f.rig.j.chip.visible = f.mode === 'victory'; } };
    },
    oldman(rig) {
      const SK = 0xf0c8a8, SWEATER = 0x6f8676, JEANS = 0x3a4a6a;
      baseBody(rig, { skin: SK, shirt: SWEATER, pants: JEANS, shoes: 0xf0f0f0 });
      rig.add('torso', cyl(0.13, 0.13, 0.05, 8), 0x5f7466, { p: [0, 0.44, 0] });                         // crew neck
      rig.add('torso', box(0.46, 0.05, 0.3), 0x5f7466, { p: [0, 0.02, 0] });                             // ribbed hem
      hairCap(rig, 'head', 0x7a5a3a);
      for (let i = 0; i < 7; i++) rig.add('head', sph(0.1, 6, 5), 0x7a5a3a, { p: [-0.2 + i * 0.065, 0.66 - Math.abs(i - 3) * 0.015, 0.2 + (i % 2) * 0.04] }); // wavy fringe
      face(rig, { brow: 0x5a4028, browTilt: -0.05, mouthW: 0.1, eyeScale: 1.25 });
      return { eyeOpen: 1, update() {} };
    },
  };

  /** Build a complete (posable) model for a fighter id. */
  function build(id) {
    const rig = createRig();
    const extras = BUILDERS[id](rig);
    rig.finish(mats);
    return { rig, extras };
  }

  /* ---------- procedural poses (write into rig.target; the rig eases toward them) ---------- */
  const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
  const ease = (x) => x * x * (3 - 2 * x);
  const blend = (rig, joint, x, y, z, k) => { const t = rig.target[joint]; t[0] = lerp(t[0], x, k); t[1] = lerp(t[1], y, k); t[2] = lerp(t[2], z, k); };

  /** Bouncy fighting stance (orthodox: left side forward, fists up). */
  function guard(rig, t) {
    const b = Math.sin(t * 5.5);
    rig.bodyPos[1] = -0.05 + b * 0.018;
    rig.set('torso', 0.05, -0.25, 0);
    rig.set('head', 0, 0.22, 0);
    rig.set('hipL', -0.35, 0, 0.05); rig.set('kneeL', 0.45 + b * 0.04);
    rig.set('hipR', 0.25, 0, -0.05); rig.set('kneeR', 0.4 + b * 0.04);
    rig.set('shL', -0.95, 0, -0.15); rig.set('elL', -1.85);
    rig.set('shR', -0.7, 0, 0.2); rig.set('elR', -2.05);
  }
  /** Relaxed standing pose (select screen, intro). */
  function stand(rig, t) {
    const b = Math.sin(t * 2);
    rig.bodyPos[1] = b * 0.01;
    rig.set('shL', 0.05, 0, 0.12 + b * 0.02); rig.set('elL', -0.2);
    rig.set('shR', 0.05, 0, -0.12 - b * 0.02); rig.set('elR', -0.2);
    rig.set('head', b * 0.03, 0, 0);
    rig.set('kneeL', 0.05); rig.set('kneeR', 0.05);
  }
  /** Leg cycle layered over the current pose. amt 0..1. */
  function walk(rig, ph, amt) {
    const s = Math.sin(ph), c = Math.cos(ph);
    blend(rig, 'hipL', s * 0.6 - 0.1, 0, 0.03, amt); blend(rig, 'kneeL', Math.max(0, -s) * 0.9 + 0.15, 0, 0, amt);
    blend(rig, 'hipR', -s * 0.6 - 0.1, 0, -0.03, amt); blend(rig, 'kneeR', Math.max(0, s) * 0.9 + 0.15, 0, 0, amt);
    rig.bodyPos[1] += Math.abs(c) * 0.05 * amt;
    rig.target.torso[2] += s * 0.05 * amt;
  }
  /** Straight punch. p = progress 0..1, side 'R' (near arm, cross) or 'L' (lead jab). */
  function punch(rig, p, side) {
    const ext = ease(seg(p, 0.1, 0.3)) * (1 - ease(seg(p, 0.55, 1)));
    const wind = seg(p, 0, 0.1) * (1 - seg(p, 0.1, 0.3));
    if (side === 'R') {
      blend(rig, 'shR', -1.62, 0, -0.12, ext); blend(rig, 'elR', -0.05, 0, 0, ext);
      rig.target.shR[0] += wind * 0.4;
      rig.target.torso[1] = lerp(-0.25, 0.45, ext);
    } else {
      blend(rig, 'shL', -1.62, 0, 0.12, ext); blend(rig, 'elL', -0.05, 0, 0, ext);
      rig.target.shL[0] += wind * 0.4;
      rig.target.torso[1] = lerp(-0.25, -0.7, ext);
    }
    rig.target.body[0] = 0.12 * ext;
    rig.bodyPos[2] = 0.14 * ext;
  }
  /** Chambered front kick with the near (right) leg. */
  function kick(rig, p) {
    const ch = ease(seg(p, 0, 0.28)) * (1 - ease(seg(p, 0.7, 1)));
    const ext = ease(seg(p, 0.26, 0.42)) * (1 - ease(seg(p, 0.6, 0.85)));
    blend(rig, 'hipR', -1.2, 0, 0, ch); blend(rig, 'kneeR', 1.8, 0, 0, ch);
    blend(rig, 'hipR', -1.65, 0, 0, ext); blend(rig, 'kneeR', 0.05, 0, 0, ext);
    blend(rig, 'hipL', 0.1, 0, 0.05, ch); blend(rig, 'kneeL', 0.3, 0, 0, ch);
    blend(rig, 'torso', -0.25, -0.55, 0, ch);
    blend(rig, 'shL', -0.6, 0, 0.9, ch); blend(rig, 'shR', -0.4, 0, -0.9, ch);
    rig.bodyPos[1] += 0.06 * ch;
    rig.bodyPos[2] = 0.1 * ext;
  }
  /** Per-character victory poses. */
  function victory(rig, t, id) {
    const b = Math.sin(t * 4);
    switch (id) {
      case 'tromp': // double thumbs-up, smug sway
        rig.set('shL', -1.35, 0, 0.35); rig.set('elL', -0.7); rig.set('shR', -1.35, 0, -0.35); rig.set('elR', -0.7);
        rig.set('body', 0, 0, Math.sin(t * 2) * 0.06); rig.set('head', -0.15, 0, Math.sin(t * 2) * 0.1);
        break;
      case 'muskrat': // awkward little dance
        rig.bodyPos[1] = Math.abs(b) * 0.08;
        rig.set('shL', -0.4, 0, 0.6 + b * 0.5); rig.set('elL', -1.4); rig.set('shR', -0.4, 0, -0.6 + b * 0.5); rig.set('elR', -1.4);
        rig.set('hips', 0, b * 0.3, 0); rig.set('head', 0, -b * 0.25, b * 0.1);
        rig.set('kneeL', 0.3 + Math.max(0, b) * 0.4); rig.set('kneeR', 0.3 + Math.max(0, -b) * 0.4);
        break;
      case 'zuck': { // stiff robotic wave
        const w = Math.round(Math.sin(t * 6)) * 0.4;
        rig.set('shR', 0, 0, -2.6); rig.set('elR', 0, 0, w); rig.set('shL', 0, 0, 0.1);
        rig.set('head', 0, Math.round(Math.sin(t * 1.5)) * 0.2, 0);
        break;
      }
      case 'hassabyte': // calm "eureka" finger
        rig.set('shR', -2.4, 0, 0.1); rig.set('elR', -0.6); rig.set('shL', -0.5, 0, -0.5); rig.set('elL', -1.7);
        rig.set('head', -0.1, 0, 0.1 + b * 0.03);
        break;
      case 'hwatt': // holds the chip over his head
        rig.bodyPos[1] = Math.abs(b) * 0.05;
        rig.set('shR', -2.9, 0, 0.15); rig.set('elR', -0.3); rig.set('shL', -2.9, 0, -0.15); rig.set('elL', -0.3);
        rig.set('head', -0.3, 0, 0);
        break;
      default: // oldman: small humble wave
        rig.set('shR', -0.3, 0, -2.3); rig.set('elR', 0, 0, b * 0.5); rig.set('shL', -0.8, 0, -0.4); rig.set('elL', -1.2);
        rig.set('head', 0, 0, b * 0.05);
    }
  }
  /** Per-character defeat poses. */
  function defeat(rig, t, id) {
    const b = Math.sin(t * 3);
    switch (id) {
      case 'tromp': // arms crossed, pouting, head turned away
        rig.set('shL', -0.55, 0, -0.55); rig.set('elL', -2.0); rig.set('shR', -0.6, 0, 0.55); rig.set('elR', -2.0);
        rig.set('head', -0.15, 0.6, 0); rig.set('body', -0.05, 0, 0);
        break;
      case 'muskrat': // facepalm
        rig.set('shR', -2.0, 0, 0.55); rig.set('elR', -2.3); rig.set('head', 0.35, 0, 0);
        rig.set('shL', 0.1, 0, 0.2); rig.set('body', 0.1, 0, 0);
        break;
      case 'zuck': // buffering: sits down, stiff
        rig.bodyPos[1] = -0.36; rig.set('hipL', -1.5); rig.set('kneeL', 1.5); rig.set('hipR', -1.5); rig.set('kneeR', 1.5);
        rig.set('shL', -1.5); rig.set('shR', -1.5); rig.set('head', Math.round(b) * 0.15, 0, 0);
        break;
      case 'hassabyte': // chin-stroking contemplation
        rig.set('shR', -1.1, 0, 0.45); rig.set('elR', -2.4); rig.set('shL', -0.7, 0, -0.5); rig.set('elL', -1.6);
        rig.set('head', 0.1, 0, 0.15 + b * 0.05);
        break;
      case 'hwatt': // shrug
        rig.set('shL', -0.3, 0, 0.9); rig.set('elL', -1.6); rig.set('shR', -0.3, 0, -0.9); rig.set('elR', -1.6);
        rig.set('head', 0, 0, 0.2); rig.bodyPos[1] = Math.abs(b) * 0.02;
        break;
      default: // oldman: hands on head
        rig.set('shL', -0.8, 0, 2.0); rig.set('elL', -2.2); rig.set('shR', -0.8, 0, -2.0); rig.set('elR', -2.2);
        rig.set('head', 0.2, 0, b * 0.05);
    }
  }

  /**
   * Animate a model for a non-gameplay mode ('stand' | 'victory' | 'defeat' | 'guard').
   * Shared by the select screen, VS, intro and results.
   */
  function animate(model, mode, t, dt, f = { t, vx: 0, mode, rig: model.rig }) {
    const rig = model.rig;
    rig.reset();
    if (mode === 'victory') victory(rig, t, model.id);
    else if (mode === 'defeat') defeat(rig, t, model.id);
    else if (mode === 'guard') guard(rig, t);
    else stand(rig, t);
    finishPose(model, t, dt, f);
  }
  /** Apply the pose plus face (blink, expression) and secondary motion. */
  function finishPose(model, t, dt, f) {
    const { rig, extras } = model;
    rig.apply(dt, 16);
    model.blinkT = (model.blinkT ?? rand(1, 3)) - dt;
    if (model.blinkT < -0.1) model.blinkT = rand(1.5, 4);
    f.blinkOverride = null;
    extras.update?.(dt, f);
    let eye = model.blinkT < 0 ? 0.1 : extras.eyeOpen ?? 1;
    if (f.blinkOverride != null) eye = f.blinkOverride;
    if (f.mode === 'defeat') eye = Math.min(eye, 0.45);
    rig.j.eyes.scale.y = eye;
    const happy = f.mode === 'victory';
    rig.j.mouth.scale.set(happy ? 1.4 : f.mode === 'defeat' ? 0.8 : 1, happy ? 1.8 : f.mode === 'defeat' ? 1.4 : 1, 1);
    rig.j.mouth.rotation.z = extras.mouthTilt ?? 0;
    rig.j.brows.position.y = 0.48 + (f.mode === 'defeat' ? 0.03 : f.attacking ? -0.025 : 0);
  }

  return { build, animate, finishPose, guard, walk, punch, kick, victory, defeat, stand, mats };
})();

/**
 * The player-controlled fighter: movement on the X plane, attack timelines with a single
 * active frame that asks Combat to resolve the hit, input buffering, and pose selection.
 */
class Fighter {
  constructor(index) {
    this.def = FIGHTERS[index];
    this.model = FighterKit.build(this.def.id);
    this.model.id = this.def.id;
    this.rig = this.model.rig;
    this.root = this.rig.root;
    this.root.rotation.y = 1.1;                 // face the truck, turned 3/4 toward the camera
    scene.add(this.root);
    this.shadow = Shadows.track(this.rig.j.hips, 0.95, 0.7);
    this.reset(CONFIG.FIGHTER_START_X);
  }
  reset(x) {
    this.x = x; this.vx = 0; this.t = 0;
    this.mode = 'idle'; this.modeT = 0; this.hitDone = false; this.queued = null; this.queuedT = 0;
    this.side = 'L'; this.walkPh = 0; this.walkAmt = 0; this.specialCD = 0;
    this.root.position.set(x, 0, 0);
  }
  get attacking() { return this.mode === 'punch' || this.mode === 'kick' || this.mode === 'special'; }
  setMode(mode) { this.mode = mode; this.modeT = 0; }
  startAttack(kind) {
    this.mode = kind; this.modeT = 0; this.hitDone = false;
    if (kind === 'punch') this.side = this.side === 'L' ? 'R' : 'L';
    this.model.extras.onAttack?.();
  }
  /** World position of the striking limb (for particles). */
  strikePoint(out) {
    const j = this.rig.j;
    return (this.mode === 'kick' ? j.kneeR : this.side === 'R' ? j.handR : j.handL).getWorldPosition(out);
  }
  /** One sim tick. `control` = player input is live. */
  update(dt, control) {
    this.t += dt;
    this.modeT += dt;
    this.specialCD = Math.max(0, this.specialCD - dt);
    const wantPunch = control && Input.wasPressed('punch');
    const wantKick = control && Input.wasPressed('kick');
    if (wantPunch || wantKick) { this.queued = wantKick ? 'kick' : 'punch'; this.queuedT = 0.2; }
    this.queuedT -= dt;
    if (this.queuedT <= 0) this.queued = null;

    let move = 0;
    if (this.attacking) {
      const A = this.mode === 'kick' ? CONFIG.KICK : CONFIG.PUNCH;
      if (!this.hitDone && this.modeT >= A.dur * A.hitAt) {
        this.hitDone = true;
        Combat.strike(this, this.mode, A);
      }
      if (this.modeT >= A.dur) this.mode = 'idle';
    } else if (this.mode === 'idle' && control) {
      if (this.queued) { this.startAttack(this.queued); this.queued = null; }
      else move = (Input.isDown('right') ? 1 : 0) - (Input.isDown('left') ? 1 : 0);
    }
    // movement on the fight plane; the truck's nose is a wall
    const target = move * CONFIG.WALK_SPEED;
    this.vx = damp(this.vx, target, 18, dt);
    this.x += this.vx * dt;
    const wall = Truck.destroyed ? Truck.backX() + 2 : Truck.frontX() - CONFIG.BODY_R;
    this.x = clamp(this.x, CONFIG.ARENA_MIN_X, wall);
    this.root.position.x = this.x;
    this.walkPh += this.vx * dt * 4.2;
    this.walkAmt = damp(this.walkAmt, Math.min(1, Math.abs(this.vx) / CONFIG.WALK_SPEED * 1.5), 12, dt);
    this.animate(dt);
  }
  animate(dt) {
    const rig = this.rig, K = FighterKit;
    rig.reset();
    const f = { t: this.t, vx: this.vx, mode: this.mode, rig, attacking: this.attacking };
    if (this.mode === 'victory') K.victory(rig, this.modeT, this.def.id);
    else if (this.mode === 'defeat') K.defeat(rig, this.modeT, this.def.id);
    else if (this.mode === 'stand') K.stand(rig, this.t);
    else {
      K.guard(rig, this.t);
      if (this.walkAmt > 0.01) K.walk(rig, this.walkPh, this.walkAmt);
      if (this.mode === 'punch') K.punch(rig, this.modeT / CONFIG.PUNCH.dur, this.side);
      if (this.mode === 'kick') K.kick(rig, this.modeT / CONFIG.KICK.dur);
    }
    K.finishPose(this.model, this.t, dt, f);
  }
  dispose() {
    Shadows.untrack(this.shadow);
    this.rig.dispose();
  }
}

/* =====================================================================================
 * 7. COMBAT — 1D hitbox/hurtbox ranges on the fight plane, damage, knockback, reactions,
 *    scoring, and the H debug overlay that draws the ranges.
 * ===================================================================================== */
const Combat = (() => {
  const stats = { hits: 0, score: 0, damage: 0, combo: 0, lastHitT: -9 };
  // Debug overlay: translucent strips on the fight plane (hidden unless H is pressed).
  const dbgMat = (c) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.35, depthTest: false, fog: false });
  const strip = (c) => { const m = new THREE.Mesh(box(1, 1, 0.06), dbgMat(c)); m.renderOrder = 50; m.visible = false; scene.add(m); return m; };
  const dbg = { on: false, hurt: strip(0x3a8aff), hit: strip(0xff3a3a), truck: strip(0x3aff6a) };
  const place = (m, x0, x1, y0, y1) => { m.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0.9); m.scale.set(Math.max(0.02, x1 - x0), y1 - y0, 1); };

  return {
    stats,
    reset() { stats.hits = stats.score = stats.damage = stats.combo = 0; stats.lastHitT = -9; },
    /** Is the truck's nose within `reach` of the fighter? (hitbox [x, x+reach] vs hurtbox [front, back]) */
    inRange(f, reach) { return !Truck.destroyed && f.x + reach >= Truck.frontX() - 0.05 && f.x <= Truck.backX(); },
    /** Resolve an attack's active frame. A = { dmg, power, reach, y }. Returns damage dealt. */
    strike(f, kind, A) {
      const p = f.strikePoint(_v2);
      if (!this.inRange(f, A.reach)) {
        FX.burst('puff', p, 2, { scale: 0.6 });         // whiff
        return 0;
      }
      const dealt = Truck.hit({ dmg: A.dmg, power: A.power, y: A.y ?? p.y });
      if (!dealt) return 0;
      stats.hits++;
      stats.damage += dealt;
      stats.score += Math.round(dealt * 10);
      stats.combo = Stage.time - stats.lastHitT < 0.9 ? stats.combo + 1 : 1;   // chain hits for the combo counter
      stats.lastHitT = Stage.time;
      // impact feedback
      _v3.set(Truck.frontX() + 0.05, clamp(p.y, 0.7, 1.6), 0.35);
      FX.burst('chip', _v3, 2 + Math.round(A.power * 2), { dir: _v1.set(-1.5, 1, 0.5) });
      FX.burst('spark', _v3, 4 + Math.round(A.power * 3));
      f.vx -= 1.2 * A.power;                              // recoil
      // the audience
      if (A.power >= 1.5 && Math.random() < 0.5) Salesman.react('cover', 1.1);
      else Salesman.react('wince', 0.55);
      Stage.Crowd.excite(0.1 * A.power);
      return dealt;
    },
    toggleDebug() { dbg.on = !dbg.on; for (const k of ['hurt', 'hit', 'truck']) dbg[k].visible = dbg.on; },
    /** Update the hitbox overlay for the current fighter. */
    updateDebug(f) {
      if (!dbg.on || !f) return;
      place(dbg.hurt, f.x - CONFIG.BODY_R, f.x + CONFIG.BODY_R, 0, 1.7);
      const A = f.mode === 'kick' ? CONFIG.KICK : CONFIG.PUNCH;
      place(dbg.hit, f.x, f.x + A.reach, f.mode === 'kick' ? 0.3 : 0.8, f.mode === 'kick' ? 1.0 : 1.3);
      dbg.hit.material.opacity = f.attacking ? 0.6 : 0.18;
      if (Truck.destroyed) dbg.truck.visible = false;
      else { dbg.truck.visible = true; place(dbg.truck, Truck.frontX(), Truck.backX(), 0, 2.1); }
    },
    hideDebug() { for (const k of ['hurt', 'hit', 'truck']) dbg[k].visible = false; },
  };
})();

/* =====================================================================================
 * 8. FX / JUICE — instanced particle pools (debris, glow, smoke).
 *    Three InstancedMeshes cover every particle in the game: 3 draw calls total.
 * ===================================================================================== */
const FX = (() => {
  /** A fixed-size pool of particles rendered by one InstancedMesh. */
  class Pool {
    constructor(geo, mat, max) {
      this.max = max;
      this.mesh = new THREE.InstancedMesh(geo, mat, max);
      this.mesh.frustumCulled = false;
      this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      this.mesh.setColorAt(0, _col.setHex(0xffffff));
      scene.add(this.mesh);
      const f = (n = 1) => new Float32Array(max * n);
      this.p = f(3); this.v = f(3); this.r = f(3); this.w = f(3);
      this.life = f(); this.maxLife = f(); this.s0 = f(); this.s1 = f(); this.grav = f(); this.drag = f(); this.bounce = f();
      this.next = 0;
      for (let i = 0; i < max; i++) this.hide(i);
    }
    hide(i) { _dummy.position.set(0, -50, 0); _dummy.scale.setScalar(0); _dummy.updateMatrix(); this.mesh.setMatrixAt(i, _dummy.matrix); }
    /** Spawn one particle (round-robin; the oldest gets recycled when full). */
    spawn(px, py, pz, vx, vy, vz, o) {
      const i = this.next; this.next = (this.next + 1) % this.max;
      const i3 = i * 3;
      this.p[i3] = px; this.p[i3 + 1] = py; this.p[i3 + 2] = pz;
      this.v[i3] = vx; this.v[i3 + 1] = vy; this.v[i3 + 2] = vz;
      this.r[i3] = rand(0, 6); this.r[i3 + 1] = rand(0, 6); this.r[i3 + 2] = rand(0, 6);
      const sp = o.spin ?? 10;
      this.w[i3] = rand(-sp, sp); this.w[i3 + 1] = rand(-sp, sp); this.w[i3 + 2] = rand(-sp, sp);
      this.life[i] = this.maxLife[i] = o.life;
      this.s0[i] = o.s0; this.s1[i] = o.s1 ?? o.s0;
      this.grav[i] = o.grav ?? 18; this.drag[i] = o.drag ?? 0.5; this.bounce[i] = o.bounce ?? 0.3;
      this.mesh.setColorAt(i, _col.setHex(o.color));
      this.mesh.instanceColor.needsUpdate = true;
    }
    update(dt) {
      const { p, v, r, w } = this;
      for (let i = 0; i < this.max; i++) {
        if (this.life[i] <= 0) continue;
        this.life[i] -= dt;
        if (this.life[i] <= 0) { this.hide(i); continue; }
        const i3 = i * 3;
        const dragK = Math.exp(-this.drag[i] * dt);
        v[i3] *= dragK; v[i3 + 2] *= dragK;
        v[i3 + 1] = v[i3 + 1] * dragK - this.grav[i] * dt;
        p[i3] += v[i3] * dt; p[i3 + 1] += v[i3 + 1] * dt; p[i3 + 2] += v[i3 + 2] * dt;
        const t = 1 - this.life[i] / this.maxLife[i];
        let s = lerp(this.s0[i], this.s1[i], t);
        if (this.life[i] < 0.25) s *= this.life[i] / 0.25;   // shrink out
        // bounce on the dock and slide to rest
        if (this.bounce[i] > 0 && p[i3 + 1] < s * 0.5) {
          p[i3 + 1] = s * 0.5;
          if (v[i3 + 1] < 0) v[i3 + 1] = -v[i3 + 1] * this.bounce[i];
          v[i3] *= 0.7; v[i3 + 2] *= 0.7; w[i3] *= 0.6; w[i3 + 1] *= 0.6; w[i3 + 2] *= 0.6;
        }
        r[i3] += w[i3] * dt; r[i3 + 1] += w[i3 + 1] * dt; r[i3 + 2] += w[i3 + 2] * dt;
        _dummy.position.set(p[i3], p[i3 + 1], p[i3 + 2]);
        _dummy.rotation.set(r[i3], r[i3 + 1], r[i3 + 2]);
        _dummy.scale.setScalar(Math.max(0.0001, s));
        _dummy.updateMatrix();
        this.mesh.setMatrixAt(i, _dummy.matrix);
      }
      this.mesh.instanceMatrix.needsUpdate = true;
    }
    clear() { for (let i = 0; i < this.max; i++) { this.life[i] = 0; this.hide(i); } this.mesh.instanceMatrix.needsUpdate = true; }
  }

  const debris = new Pool(box(1, 1, 1), Mat.toon(0xffffff, { rim: 0.5 }), 260);
  const glow = new Pool(new THREE.OctahedronGeometry(0.7, 0), Mat.basic(0xffffff, { fog: false }), 220);
  const smoke = new Pool(new THREE.IcosahedronGeometry(0.5, 0), Mat.toon(0xffffff, { rim: 0.15 }), 110);

  /** Named particle recipes. burst(kind, position, count, {scale, dir}). */
  const RECIPES = {
    bolt: (o) => [debris, { life: rand(1.2, 2.2), s0: rand(0.05, 0.1) * o.scale, color: pick([0x8d939e, 0x5d636e, 0xc8ced8, 0x2a2a30]), grav: 18, bounce: 0.4 }, 4, 5],
    chip: (o) => [debris, { life: rand(1.5, 2.6), s0: rand(0.1, 0.22) * o.scale, color: pick([0xc8ced8, 0xb0b6c0, 0xe0e4ea]), grav: 18, bounce: 0.3 }, 3.5, 4],
    glass: (o) => [debris, { life: rand(1.2, 2.0), s0: rand(0.05, 0.12) * o.scale, color: pick([0xbfe6ff, 0x8fc8ee, 0xffffff, 0x6aa0c8]), grav: 16, bounce: 0.35, spin: 16 }, 3, 4],
    spark: (o) => [glow, { life: rand(0.25, 0.6), s0: rand(0.06, 0.12) * o.scale, s1: 0.01, color: pick([0xfff27a, 0xffc040, 0xffffff]), grav: 9, drag: 1, bounce: 0.5, spin: 0 }, 6, 6],
    smoke: (o) => [smoke, { life: rand(1.4, 2.2), s0: rand(0.2, 0.32) * o.scale, s1: rand(0.75, 1.1) * o.scale, color: pick([0x5a5462, 0x6c6674, 0x7e7886]), grav: -1.8, drag: 1.2, bounce: 0, spin: 1.5 }, 0.5, 0.6],
    puff: (o) => [smoke, { life: rand(0.4, 0.7), s0: rand(0.2, 0.35) * o.scale, s1: rand(0.6, 0.9) * o.scale, color: pick([0xe8dcd0, 0xd8ccc0]), grav: -1, drag: 4, bounce: 0, spin: 2 }, 3, 2],
    flame: (o) => [glow, { life: rand(0.3, 0.55), s0: rand(0.18, 0.3) * o.scale, s1: rand(0.45, 0.7) * o.scale, color: pick([0xffe24a, 0xff9a2a, 0xff5a1a, 0xfff6b0]), grav: -3, drag: 2, bounce: 0, spin: 4 }, 1.5, 1.5],
  };

  return {
    debris, glow, smoke,
    /**
     * Spawn `count` particles of a recipe at `pos`. opts.dir biases the velocity
     * (e.g. away from a punch), opts.scale scales the size.
     */
    burst(kind, pos, count = 1, opts = {}) {
      const o = { scale: opts.scale ?? 1 };
      for (let i = 0; i < count; i++) {
        const [pool, cfg, spread, up] = RECIPES[kind](o);
        const d = opts.dir;
        pool.spawn(
          pos.x + rand(-0.15, 0.15), pos.y + rand(-0.15, 0.15), pos.z + rand(-0.15, 0.15),
          rand(-spread, spread) * 0.6 + (d ? d.x : 0), rand(0.3, 1) * up + (d ? d.y : 0), rand(-spread, spread) * 0.6 + (d ? d.z : 0),
          cfg,
        );
      }
    },
    update(dt) { debris.update(dt); glow.update(dt); smoke.update(dt); },
    clear() { debris.clear(); glow.clear(); smoke.clear(); },
  };
})();

/* =====================================================================================
 * 9. HUD — everything drawn on the 480x270 overlay canvas: bouncy numbers, plates,
 *    announcement banners and speech bubbles anchored to 3D positions.
 * ===================================================================================== */
const HUD = (() => {
  const W = CONFIG.LOW_W, H = CONFIG.LOW_H;
  const pops = new Map();     // key -> { v, t } for the bounce-on-change effect
  const banners = [];
  const bubbles = new Map();
  const _p = new THREE.Vector3();

  /** Word-wrap a string to lines of at most `max` characters. */
  function wrap(text, max) {
    const lines = [];
    let line = '';
    for (const word of text.split(' ')) {
      if ((line + ' ' + word).trim().length > max) { if (line) lines.push(line); line = word; }
      else line = (line + ' ' + word).trim();
    }
    if (line) lines.push(line);
    return lines;
  }

  return {
    wrap,
    /** Returns a scale factor that pops whenever `value` changes for this key. */
    pop(key, value) {
      let b = pops.get(key);
      if (!b) { b = { v: value, t: 9 }; pops.set(key, b); }
      if (b.v !== value) { b.v = value; b.t = 0; }
      return 1 + 0.55 * Math.max(0, 1 - b.t / 0.22) ** 2;
    },
    /** Dark translucent plate with a hard black border. */
    plate(ctx, x, y, w, h, fill = 'rgba(18,8,36,0.78)', edge = '#000') {
      ctx.fillStyle = edge; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
      ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
    },
    update(dt) {
      for (const b of pops.values()) b.t += dt;
      for (let i = banners.length - 1; i >= 0; i--) { banners[i].t += dt; if (banners[i].t > banners[i].dur) banners.splice(i, 1); }
      for (const [k, b] of bubbles) { b.t += dt; if (b.t > b.dur) bubbles.delete(k); }
    },
    clear() { banners.length = 0; bubbles.clear(); },
    /** Big centred announcement that slams in, wobbles, and fades. */
    banner(text, o = {}) {
      banners.push({ text, t: 0, dur: o.dur ?? 1.5, scale: o.scale ?? 6, color: o.color ?? ['#fffbe0', '#fff36b', '#ff9a3c', '#ff3c6e'], y: o.y ?? 100, sub: o.sub, subColor: o.subColor });
    },
    /** Speech bubble for `id` that follows anchor() (a world-space point), typed out letter by letter. */
    say(id, text, anchor, o = {}) { bubbles.set(id, { text, anchor, t: 0, dur: o.dur ?? 2.5, cps: o.cps ?? 28, lines: wrap(text, o.width ?? 22) }); },
    hush(id) { bubbles.delete(id); },
    drawBanners(ctx) {
      for (const b of banners) {
        const inK = Math.min(1, b.t / 0.16);
        const pop = b.t < 0.16 ? lerp(2.4, 1, inK) : 1 + Math.sin((b.t - 0.16) * 18) * Math.max(0, 0.1 - (b.t - 0.16) * 0.2);
        ctx.globalAlpha = clamp((b.dur - b.t) / 0.2, 0, 1);
        PixelFont.draw(ctx, b.text, W / 2, b.y, { scale: b.scale, align: 'center', color: b.color, outline: 2, pop });
        if (b.sub) PixelFont.draw(ctx, b.sub, W / 2, b.y + 7 * b.scale + 8, { scale: 2, align: 'center', color: b.subColor ?? '#fff' });
        ctx.globalAlpha = 1;
      }
    },
    drawBubbles(ctx) {
      for (const bb of bubbles.values()) {
        _p.copy(bb.anchor()).project(camera);
        if (_p.z > 1) continue;
        const ax = (_p.x * 0.5 + 0.5) * W, ay = (0.5 - _p.y * 0.5) * H;
        const w = Math.max(...bb.lines.map((l) => l.length)) * 6 + 9, h = bb.lines.length * 9 + 6;
        const x = Math.round(clamp(ax - w / 2, 3, W - w - 3)), y = Math.round(clamp(ay - h - 9, 3, H - h - 12));
        const tx = Math.round(clamp(ax, x + 5, x + w - 8));
        const fade = clamp((bb.dur - bb.t) / 0.15, 0, 1);
        ctx.globalAlpha = fade;
        // tail, then body (black border, white fill)
        ctx.fillStyle = '#000';
        for (let i = 0; i < 8; i++) ctx.fillRect(tx - 1 + Math.round(i * 0.4), y + h + i, Math.max(1, 6 - i) + 2, 1);
        ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
        ctx.fillStyle = '#fff';
        ctx.fillRect(x, y, w, h);
        for (let i = 0; i < 7; i++) ctx.fillRect(tx + Math.round(i * 0.4), y + h + i - 1, Math.max(0, 5 - i), 1);
        let left = Math.floor(bb.t * bb.cps);
        bb.lines.forEach((line, i) => {
          const part = line.slice(0, Math.max(0, left));
          left -= line.length + 1;
          if (part) PixelFont.draw(ctx, part, x + 5, y + 4 + i * 9, { color: '#1a1030', outline: 0 });
        });
        ctx.globalAlpha = 1;
      }
    },
  };
})();

/* =====================================================================================
 * 11. STATES — title → select → vs → fight → results, plus the fixed-timestep main loop.
 * ===================================================================================== */
const Game = {
  state: null,
  stateName: '',
  stateTime: 0,          // sim seconds spent in the current state
  timeScale: 1,          // slow-mo multiplier for the simulation
  fighterIndex: 0,
  fighter: null,         // the gameplay Fighter during a round
  lastResult: null,
  best: 0,               // best total score this session
  view: 'harbor',        // which scene is rendered: 'harbor' | 'showroom'
  bot: false,            // debug autoplay (smoke test)
};

const ease = (x) => x * x * (3 - 2 * x);
const headAnchor = (rig, up = 0.95) => () => rig.j.head.getWorldPosition(_v3).add(_v1.set(0, up, 0));
const SALES_PITCH = ["SHE'S BULLETPROOF! ...MOSTLY.", 'ARMORED GLASS! UNBREAKABLE!*', 'ZERO TO SIXTY IN... EVENTUALLY.', 'STEP RIGHT UP! THE CYBERCHUNK!', 'ONLY DRIVEN ONCE! INTO A WALL!'];
const CONDITION = ['SHOWROOM NEW', 'CRACKED GLASS', 'DENTED', 'FALLING APART', 'SCRAP METAL'];
const CONDITION_COL = ['#7dff9a', '#c8f060', '#ffd23a', '#ff8a3a', '#ff3a4a'];

/**
 * Each state: enter(prev), exit(next), update(dt) at a fixed rate, frame(realDt) once per
 * rendered frame (camera, cosmetic animation), hud(ctx) to draw the overlay.
 */
const States = {
  title: {
    enter() { Game.view = 'harbor'; Truck.reset(); Salesman.reset(); },
    update() { if (Input.wasPressed('confirm')) setState('select'); },
    frame() {
      // slow cinematic sweep across the harbor
      const a = Math.sin(Stage.time * 0.12) * 0.75;
      CamRig.to(2 + Math.sin(a) * 19, 4.2 + Math.sin(Stage.time * 0.2) * 0.8, Math.cos(a) * 19, 2, 2.2, -2, true);
    },
    hud(ctx) {
      const t = Game.stateTime;
      const drop = Math.max(0, 1 - t * 2.5);
      PixelFont.draw(ctx, 'CYBER', 240, 34 - drop * 80, { scale: 8, align: 'center', color: ['#ffffff', '#c8d4ff', '#8a9ad8', '#5a6ab0'], outline: 3 });
      PixelFont.draw(ctx, 'SMASH', 240, 94 + drop * 80, { scale: 8, align: 'center', color: ['#fffbe0', '#fff36b', '#ff9a3c', '#ff3c6e'], outline: 3, pop: 1 + Math.sin(t * 3) * 0.02 });
      PixelFont.draw(ctx, 'THE BONUS STAGE OF THE CENTURY', 240, 160, { align: 'center', color: '#ffd8f0' });
      if (Math.floor(t * 2.5) % 2 === 0) PixelFont.draw(ctx, 'PRESS ENTER', 240, 186, { scale: 2, align: 'center' });
      PixelFont.draw(ctx, 'ARROWS/AD MOVE  J PUNCH  K KICK  L SPECIAL  M MUTE', 240, 236, { align: 'center', color: '#c8b8ff' });
      PixelFont.draw(ctx, '(C) 199X NOT-A-REAL-CORP. NO CYBERCHUNKS WERE HARMED... MUCH.', 240, 254, { align: 'center', color: '#8a7ab8', outline: 0 });
    },
  },

  select: {
    enter() { Game.view = 'harbor'; Game.fighter?.dispose(); Game.fighter = null; },
    update() {
      if (Input.wasPressed('left')) Game.fighterIndex = (Game.fighterIndex + FIGHTERS.length - 1) % FIGHTERS.length;
      if (Input.wasPressed('right')) Game.fighterIndex = (Game.fighterIndex + 1) % FIGHTERS.length;
      if (Input.wasPressed('confirm')) setState('vs');
      if (Input.wasPressed('back')) setState('title');
    },
    frame() { CamRig.to(4.5, 2.4, 9, 6.5, 1.3, -1, true); },
    hud(ctx) {
      PixelFont.draw(ctx, 'SELECT YOUR FIGHTER', 240, 20, { scale: 2, align: 'center', color: '#fff36b' });
      FIGHTERS.forEach((f, i) => {
        PixelFont.draw(ctx, f.name, 240, 70 + i * 22, { scale: 2, align: 'center', color: i === Game.fighterIndex ? '#ff3c6e' : '#fff' });
      });
    },
  },

  vs: {
    enter() { Game.view = 'harbor'; },
    update() { if (Game.stateTime > 2.5 || Input.wasPressed('confirm')) setState('fight'); },
    frame() {
      const a = -0.6 + Game.stateTime * 0.25;
      CamRig.to(2 + Math.sin(a) * 11, 2.2, Math.cos(a) * 11, 2, 1.2, 0, true);
    },
    hud(ctx) {
      PixelFont.draw(ctx, FIGHTERS[Game.fighterIndex].name, 240, 60, { scale: 3, align: 'center' });
      PixelFont.draw(ctx, 'VS', 240, 115, { scale: 6, align: 'center', color: ['#fff36b', '#ff3c6e'] });
      PixelFont.draw(ctx, 'THE CYBERCHUNK', 240, 190, { scale: 3, align: 'center' });
    },
  },

  /* ---------- The round: intro → announce → play → end ---------- */
  fight: {
    INTRO: 4.8,
    enter(prev) {
      Game.view = 'harbor';
      this.timer = CONFIG.FIGHT_TIME; this.win = false; this.bonus = 0; this.events = new Set();
      Truck.reset(); FX.clear(); Combat.reset(); Salesman.reset(); Stage.Crowd.calm(); HUD.clear();
      Game.fighter?.dispose();
      Game.fighter = new Fighter(Game.fighterIndex);
      CamRig.speed = 3;
      // retrying skips the cinematic intro
      if (prev === 'results') this.setPhase('announce');
      else {
        this.setPhase('intro');
        Game.fighter.setMode('stand');
        Salesman.react('pitch', 99);
        const pool = [...SALES_PITCH].sort(() => Math.random() - 0.5);
        this.pitch = [pool[0], pool[1], "CAN'T SELL IT... WRECK IT IN 40 SECONDS AND I'LL PAY YOU!"];
        // camera path: close on the salesman, dolly, swoop over the truck, settle on the side view
        this.path = new THREE.CatmullRomCurve3([
          new THREE.Vector3(9.8, 2.3, 5.2), new THREE.Vector3(8.6, 2.0, 7.4), new THREE.Vector3(3.5, 4.6, 11.5), new THREE.Vector3(-1.2, 2.3, 14.5),
        ]);
      }
    },
    exit() { Combat.hideDebug(); Game.timeScale = 1; HUD.clear(); },
    setPhase(p) { this.phase = p; this.phaseT = 0; this.events = new Set(); },
    /** Fire `fn` once when the phase clock passes `t`. */
    at(t, key, fn) { if (this.phaseT >= t && !this.events.has(key)) { this.events.add(key); fn(); } },
    update(dt) {
      const f = Game.fighter;
      this.phaseT += dt;
      if (Input.wasPressed('debug')) Combat.toggleDebug();
      if (this.phase === 'intro') {
        f.update(dt, false);
        const sAnchor = headAnchor(Salesman.rig, 1.0);
        this.pitch.forEach((line, i) => this.at(0.2 + i * 1.55, 'pitch' + i, () => HUD.say('salesman', line, sAnchor, { dur: i === 2 ? 2.0 : 1.45, cps: 40 })));
        if (this.phaseT > this.INTRO || Input.wasPressed('confirm')) this.setPhase('announce');
      } else if (this.phase === 'announce') {
        this.at(0, 'start', () => {
          HUD.hush('salesman');
          Salesman.react('idle', 0);
          f.setMode('idle');
          HUD.banner('SALE 1...', { dur: 1.15, scale: 6, y: 92 });
        });
        this.at(1.25, 'haggle', () => HUD.banner('HAGGLE!', { dur: 0.9, scale: 8, y: 86, color: ['#ffffff', '#ffd23a', '#ff6a2a', '#ff2a4a'] }));
        f.update(dt, false);
        if (this.phaseT > 2.05) this.setPhase('play');
      } else if (this.phase === 'play') {
        if (Game.bot) this.botInput(f);
        this.timer = Math.max(0, this.timer - dt);
        f.update(dt, true);
        if (Truck.destroyed) this.end(true);
        else if (this.timer <= 0) this.end(false);
      } else if (this.phase === 'end') {
        f.update(dt, false);
        this.endSequence();
      }
      Combat.updateDebug(f);
    },
    /** The round is decided: truck wrecked (win) or time up (lose). */
    end(win) {
      this.win = win;
      this.setPhase('end');
      Game.fighter.setMode(win ? 'victory' : 'defeat');
      Salesman.react(win ? 'faint' : 'celebrate');
      Stage.Crowd.excite(win ? 1 : 0.35);
      if (win) {
        this.bonus = Math.ceil(this.timer) * 1000;
        HUD.banner('PERFECT!', { dur: 3.2, scale: 8, y: 56 });
      } else {
        HUD.banner('TIME UP!', { dur: 1.0, scale: 6, y: 80 });
      }
    },
    endSequence() {
      const def = FIGHTERS[Game.fighterIndex];
      const fAnchor = headAnchor(Game.fighter.rig, 0.95);
      if (this.win) {
        this.at(1.3, 'line', () => HUD.say('fighter', def.win, fAnchor, { dur: 3.4 }));
      } else {
        this.at(1.0, 'cancel', () => {
          HUD.banner('SALE CANCELLED', { dur: 3.8, scale: 5, y: 196, color: ['#ffd0e0', '#ff6a8a', '#c02a5a', '#7a1a4a'] });
          HUD.say('salesman', 'HA! STILL FOR SALE! ANY TAKERS?', headAnchor(Salesman.rig, 1.0), { dur: 2.2 });
        });
        this.at(2.4, 'line', () => HUD.say('fighter', def.lose, fAnchor, { dur: 2.8 }));
      }
      if (this.phaseT > 5.4 || (this.phaseT > 1.5 && Input.wasPressed('confirm'))) this.finish();
    },
    finish() {
      const score = Combat.stats.score;
      Game.lastResult = { win: this.win, timeLeft: this.timer, hits: Combat.stats.hits, score, bonus: this.bonus, total: score + this.bonus };
      setState('results');
    },
    /** Debug autoplay: walk into range, alternate punches and kicks. */
    botInput(f) {
      const inRange = Combat.inRange(f, CONFIG.PUNCH.reach - 0.15);
      if (inRange) Input.virtual.delete('right'); else Input.virtual.add('right');
      if (inRange && f.mode === 'idle') Input.press(Math.random() < 0.5 ? 'punch' : 'kick');
    },
    frame() {
      const f = Game.fighter;
      const fx = f ? f.x : 0;
      const tx = Truck.destroyed ? Truck.root.position.x : Truck.frontX();
      const cx = clamp((fx + tx) / 2 + 0.4, -4.5, 3);
      if (this.phase === 'intro') {
        // cinematic swoop along the spline, look-at blending from the salesman to the fight
        const u = ease(clamp(this.phaseT / this.INTRO, 0, 1));
        const p = this.path.getPoint(u);
        const lk = _v2.set(7.2, 1.5, -1.1).lerp(_v3.set(cx, 1.6, 0), ease(clamp((u - 0.35) / 0.65, 0, 1)));
        CamRig.to(p.x, p.y, p.z, lk.x, lk.y, lk.z, true);
      } else if (this.phase === 'end') {
        // win: push in on the fighter by the wreck; lose: frame the fighter AND the gloating salesman
        const k = ease(clamp(this.phaseT / 1.2, 0, 1));
        const ex = this.win ? fx + 2.4 : (fx + Salesman.rig.root.position.x) / 2;
        CamRig.to(lerp(cx, ex, k), lerp(2.3, 2.0, k), lerp(14.5, this.win ? 9.5 : 15.5, k), lerp(cx, ex, k), lerp(1.6, 1.25, k), 0);
      } else {
        CamRig.to(cx, 2.3, 14.5, cx, 1.6, 0);
      }
    },
    hud(ctx) {
      const def = FIGHTERS[Game.fighterIndex];
      if (this.phase !== 'intro') {
        // --- left: player name + score ---
        HUD.plate(ctx, 5, 4, 132, 32);
        PixelFont.draw(ctx, '1P', 9, 8, { color: '#ffd23a' });
        PixelFont.draw(ctx, def.name, 25, 8, { color: def.color });
        const sc = Combat.stats.score + (this.phase === 'end' && this.win ? Math.round(this.bonus * clamp((this.phaseT - 0.8) / 1.2, 0, 1)) : 0);
        PixelFont.draw(ctx, String(sc).padStart(7, '0'), 9, 19, { scale: 2, pop: HUD.pop('score', Combat.stats.score) });
        // --- centre: the big countdown ---
        const secs = Math.ceil(this.timer);
        const low = secs <= 10 && this.phase === 'play';
        HUD.plate(ctx, 214, 3, 52, 38);
        const shake = secs <= 5 && this.phase === 'play' ? Math.round(Math.sin(Stage.time * 50)) : 0;
        PixelFont.draw(ctx, String(secs).padStart(2, '0'), 240 + shake, 9, {
          scale: 4, align: 'center', outline: 2, pop: HUD.pop('timer', secs),
          color: low ? ['#ffffff', '#ff8a8a', '#ff2a3a'] : ['#ffffff', '#fff6c0', '#ffd23a'],
        });
        PixelFont.draw(ctx, 'TIME', 240, 44, { align: 'center', color: '#c8b8ff' });
        // --- right: the truck's health ---
        HUD.plate(ctx, 266, 4, 210, 40);
        PixelFont.draw(ctx, 'CYBERCHUNK', 470, 8, { align: 'right', color: '#fff36b' });
        drawBar(ctx, 271, 18, 199, 11, Truck.hp / Truck.maxHP, Truck.hpLag / Truck.maxHP, true);
        PixelFont.draw(ctx, CONDITION[Truck.stage], 470, 33, { align: 'right', color: CONDITION_COL[Truck.stage], outline: 1, pop: HUD.pop('cond', Truck.stage) });
        // --- combo counter ---
        const sinceHit = Stage.time - Combat.stats.lastHitT;
        if (Combat.stats.combo >= 2 && sinceHit < 1.1) {
          ctx.globalAlpha = clamp((1.1 - sinceHit) / 0.3, 0, 1);
          PixelFont.draw(ctx, `${Combat.stats.combo} HITS!`, 10, 52, { scale: 2, color: ['#ffffff', '#ffd23a', '#ff6a2a'], pop: HUD.pop('combo', Combat.stats.combo) });
          ctx.globalAlpha = 1;
        }
        // --- bottom ---
        PixelFont.draw(ctx, `BEST ${String(Game.best).padStart(7, '0')}`, 474, 260, { align: 'right', color: '#c8b8ff' });
        if (this.phase === 'play' && this.phaseT < 6) PixelFont.draw(ctx, 'J PUNCH   K KICK   L SPECIAL', 240, 258, { align: 'center', color: '#ffffff' });
        // --- time bonus tally ---
        if (this.phase === 'end' && this.win && this.phaseT > 0.6) {
          const k = clamp((this.phaseT - 0.8) / 1.2, 0, 1);
          PixelFont.draw(ctx, `TIME BONUS  ${Math.ceil(this.timer)} X 1000`, 240, 124, { scale: 2, align: 'center', color: '#ffffff' });
          PixelFont.draw(ctx, String(Math.round(this.bonus * k)), 240, 144, { scale: 3, align: 'center', color: ['#ffffff', '#ffd23a'], pop: HUD.pop('bonus', Math.round(k * 10)) });
        }
      } else {
        PixelFont.draw(ctx, 'ENTER TO SKIP', 474, 260, { align: 'right', color: '#c8b8ff' });
      }
      HUD.drawBubbles(ctx);
      HUD.drawBanners(ctx);
    },
  },

  /* ---------- Results: fighter on a rotating pedestal, stats, best score, retry ---------- */
  results: {
    enter() {
      Game.view = 'showroom';
      const r = Game.lastResult || { win: false, score: 0, hits: 0, timeLeft: 0, bonus: 0, total: 0 };
      this.r = r;
      this.newBest = r.total > Game.best;
      Game.best = Math.max(Game.best, r.total);
      this.choice = 0;
      const def = FIGHTERS[Game.fighterIndex];
      this.ped = Showroom.pedestal(1.35, 0, def.color);
      this.model = FighterKit.build(def.id);
      this.model.id = def.id;
      this.model.rig.root.position.set(1.35, Showroom.TOP, 0);
      Showroom.scene.add(this.model.rig.root);
      HUD.clear();
      HUD.say('line', r.win ? def.win : def.lose, () => _v3.set(2.6, 2.05, 0), { dur: 1e9, width: 18 });
    },
    exit() {
      this.model.rig.dispose();
      this.ped.removeFromParent();
      HUD.clear();
    },
    update(dt) {
      // the pedestal turns slowly, showing off the pose
      this.ped.rotation.y = this.model.rig.root.rotation.y = Game.stateTime * 0.6 - 0.4;
      FighterKit.animate(this.model, this.r.win ? 'victory' : 'defeat', Game.stateTime, dt);
      if (Input.wasPressed('up') || Input.wasPressed('down')) this.choice ^= 1;
      if (Game.stateTime > 0.6 && Input.wasPressed('confirm')) setState(this.choice === 0 ? 'fight' : 'select');
      if (Input.wasPressed('back')) setState('select');
    },
    frame() { CamRig.to(0.3, 1.75, 7.6, 0.75, 1.15, 0, true); },
    hud(ctx) {
      const r = this.r, t = Game.stateTime;
      const def = FIGHTERS[Game.fighterIndex];
      PixelFont.draw(ctx, r.win ? 'PERFECT!' : 'SALE CANCELLED', 240, 10, {
        scale: r.win ? 6 : 4, align: 'center', outline: 2,
        color: r.win ? ['#fffbe0', '#fff36b', '#ff9a3c', '#ff3c6e'] : ['#ffd0e0', '#ff6a8a', '#c02a5a', '#7a1a4a'],
      });
      HUD.plate(ctx, 10, 58, 222, 168);
      PixelFont.draw(ctx, def.name, 121, 64, { align: 'center', color: def.color });
      const k = (d) => clamp((t - d) / 0.8, 0, 1);
      const row = (label, value, y, d, big) => {
        PixelFont.draw(ctx, label, 18, y, { color: '#c8b8ff' });
        PixelFont.draw(ctx, value(k(d)), 224, y - (big ? 4 : 0), { align: 'right', scale: big ? 2 : 1, color: big ? ['#ffffff', '#ffd23a'] : '#ffffff' });
      };
      row('SCORE', (q) => String(Math.round(r.score * q)), 84, 0.2);
      row('TIME REMAINING', (q) => `${(r.timeLeft * q).toFixed(1)}S`, 98, 0.4);
      row('HITS LANDED', (q) => String(Math.round(r.hits * q)), 112, 0.6);
      row('TIME BONUS', (q) => (r.win ? String(Math.round(r.bonus * q)) : 'NONE'), 126, 0.8);
      ctx.fillStyle = '#5a4a8a'; ctx.fillRect(18, 140, 206, 1);
      row('TOTAL', (q) => String(Math.round(r.total * q)), 150, 1.0, true);
      PixelFont.draw(ctx, 'SESSION BEST', 18, 170, { color: '#c8b8ff' });
      PixelFont.draw(ctx, String(Game.best), 224, 170, { align: 'right', color: '#ffffff' });
      if (this.newBest && t > 1.8 && Math.floor(t * 3) % 2 === 0) PixelFont.draw(ctx, 'NEW RECORD!', 121, 182, { align: 'center', color: ['#ffffff', '#7dff9a'] });
      const opt = (label, i, y) => {
        const on = this.choice === i;
        PixelFont.draw(ctx, (on ? '> ' : '  ') + label, 30, y, { scale: 2, color: on ? ['#ffffff', '#ffd23a'] : '#8a7ab8', pop: on ? 1 + Math.sin(t * 8) * 0.03 : 1 });
      };
      opt('RETRY', 0, 196);
      opt('CHANGE FIGHTER', 1, 211);
      HUD.drawBubbles(ctx);
    },
  },
};

function setState(name) {
  const prev = Game.stateName;
  Game.state?.exit?.(name);
  Game.state = States[name];
  Game.stateName = name;
  Game.stateTime = 0;
  Game.state.enter?.(prev);
}

/* ---------- Fixed-timestep loop: simulate at 60 Hz, render once per animation frame ---------- */
const SIM_DT = 1 / CONFIG.SIM_HZ;
let accumulator = 0;
let lastTime = performance.now();
const perf = { fps: 60, frames: 0, acc: 0 };

function simulate(dt) {
  Game.stateTime += dt;
  Stage.update(dt);
  Showroom.update(dt);
  for (const m of Game.lineup || []) FighterKit.animate(m, Game.lineupMode, Stage.time, dt);
  Truck.update(dt);
  FX.update(dt);
  Game.state.update?.(dt);
  Input.endTick(); // edge presses are consumed by exactly one sim tick
}

function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min(CONFIG.MAX_FRAME_DT, (now - lastTime) / 1000);
  lastTime = now;
  accumulator += realDt;
  while (accumulator >= SIM_DT) {
    simulate(SIM_DT * Game.timeScale);
    accumulator -= SIM_DT;
  }
  HUD.update(realDt);
  Game.state.frame?.(realDt);
  if (Game.camOverride) CamRig.to(...Game.camOverride, true);
  CamRig.update(realDt);
  Stage.frame();
  Shadows.update();

  renderer.info.reset();
  renderPipeline(Game.view === 'showroom' ? Showroom.scene : scene, camera);

  hud.clearRect(0, 0, CONFIG.LOW_W, CONFIG.LOW_H);
  Game.state.hud?.(hud);

  perf.frames++; perf.acc += realDt;
  if (perf.acc >= 0.5) { perf.fps = perf.frames / perf.acc; perf.frames = 0; perf.acc = 0; }
}

/* ---------- Test / debug hook (read-only peeks plus a few levers for the smoke test) ---------- */
window.CS = {
  ready: false,
  get state() { return Game.stateName; },
  info: () => ({
    state: Game.stateName, fps: Math.round(perf.fps), calls: renderer.info.render.calls, tris: renderer.info.render.triangles,
    truckHP: Math.round(Truck.hp), truckStage: Truck.stage,
    fighterX: Game.fighter ? +Game.fighter.x.toFixed(2) : null, fighterMode: Game.fighter?.mode, phase: States.fight.phase,
    timer: +(States.fight.timer ?? 0).toFixed(2), hits: Combat.stats.hits, score: Combat.stats.score, best: Game.best,
    result: Game.lastResult,
  }),
  debug: {
    endFight: () => Game.stateName === 'fight' && States.fight.finish(),
    hitTruck: (dmg = 30, power = 1) => Truck.hit({ dmg, power, y: 1.1 }),
    /** Let the in-page bot play (walks in, alternates punches and kicks). */
    bot: (on = true) => { Game.bot = on; if (!on) Input.virtual.clear(); },
    /** Set the clock (e.g. to test the time-out path quickly). */
    setTimer: (t) => { States.fight.timer = t; },
    /** Show every fighter side by side in a pose (for eyeballing the models). */
    lineup(mode = 'stand') {
      for (const m of Game.lineup || []) m.rig.dispose();
      Game.lineup = FIGHTERS.map((d, i) => {
        const m = FighterKit.build(d.id); m.id = d.id;
        m.rig.root.position.set(-5 + i * 1.5, 0, 3); scene.add(m.rig.root);
        return m;
      });
      Game.lineupMode = mode;
    },
    /** Pin the camera: cam(px, py, pz, lx, ly, lz) — call with no args to release. */
    cam: (...a) => { Game.camOverride = a.length ? a : null; },
  },
};

setState('title');
requestAnimationFrame(frame);
window.CS.ready = true;
</script>

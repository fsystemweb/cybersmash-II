          FighterKit.punch(rig, 0.1 + clamp((t - 0.42) / 0.3, 0, 1) * 0.35, 'R');
        }
      },
      end() { Game.timeScale = 1; },
      /** Holographic overlay: trajectory lines and a rising probability. */
      hud(ctx, f, t) {
        if (t > 0.5) return;
        const W = CONFIG.LOW_W, H = CONFIG.LOW_H;
        const toScreen = (v) => { v.project(camera); return [(v.x * 0.5 + 0.5) * W, (0.5 - v.y * 0.5) * H]; };
        const [ax, ay] = toScreen(f.rig.j.head.getWorldPosition(_v3).add(_v1.set(0, 0.4, 0)));
        const [bx, by] = toScreen(_v3.set(Truck.frontX(), 1.25, 0));
        ctx.fillStyle = '#5affd8';
        for (let k = 0; k < 3; k++) {
          const arc = 20 + k * 22;
          for (let i = 0; i <= 40; i++) {
            const u = i / 40;
            if (((i + Math.floor(t * 120)) % 4) > 1) continue;     // marching dashes
            const x = lerp(ax, bx, u), y = lerp(ay, by, u) - Math.sin(u * Math.PI) * arc;
            ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
          }
        }
        const r = 8 + Math.sin(t * 60) * 1.5;                      // target reticle
        ctx.strokeStyle = '#5affd8';
        ctx.strokeRect(Math.round(bx - r), Math.round(by - r), Math.round(r * 2), Math.round(r * 2));
        ctx.fillRect(Math.round(bx) - 12, Math.round(by), 6, 1); ctx.fillRect(Math.round(bx) + 7, Math.round(by), 6, 1);
        HUD.plate(ctx, 120, 168, 240, 22, 'rgba(10,40,40,0.75)', '#5affd8');
        PixelFont.draw(ctx, `PROBABILITY OF BONK: ${f.sp.prob.toFixed(1)}%`, 240, 175, { align: 'center', color: '#5affd8', outline: 0 });
      },
    },

    /* JENSEN HWATT — "GPU Overclock": glowing fists, then a flurry of punches */
    hwatt: {
      dur: 1.6,
      start(f) {
        f.sp.n = 0;
        for (const s of ['L', 'R']) {
          const j = f.rig.j['glow' + s];
          j.visible = true;
          if (!glowSprites.has(j)) {
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x76ff4a, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
            spr.scale.setScalar(0.7);
            j.add(spr);
            glowSprites.set(j, spr);
          }
        }
      },
      update(f, t, dt) {
        const sp = f.sp;
        const pulse = 0.6 + Math.sin(t * 30) * 0.15 + Math.min(1, t * 3) * 0.3;
        for (const s of ['L', 'R']) {
          const j = f.rig.j['glow' + s];
          glowSprites.get(j).scale.setScalar(pulse);
          j.getWorldPosition(_v3);
          if (Math.random() < 0.5) FX.burst('gspark', _v3, 1);
        }
        if (t > 0.35 && t < 0.5) dash(f, 6, dt);
        // 8 rapid punches between 0.4s and 1.4s
        if (t >= 0.4 + sp.n * 0.125 && sp.n < 8) {
          sp.n++;
          f.side = sp.n % 2 ? 'R' : 'L';
          if (hit(f, DMG / 8, 0.8, 1.25)) { f.strikePoint(_v3); FX.burst('gspark', _v3, 6); }
        }
      },
      pose(rig, t, f) {
        if (t < 0.4) { rig.set('shL', -0.3, 0, 0.3); rig.set('elL', -2.2); rig.set('shR', -0.3, 0, -0.3); rig.set('elR', -2.2); rig.bodyPos[1] = -0.08; }
        else FighterKit.punch(rig, ((t - 0.4) % 0.125) / 0.125 * 0.6, f.side);
      },
      end(f) { f.rig.j.glowL.visible = f.rig.j.glowR.visible = false; },
    },

    /* SAM OLDMAN — "AGI Beam": a giant chat bubble types B-O-O-M, then fires a laser */
    oldman: {
      dur: 1.85,
      start(f) { f.sp.ticks = 0; chat.visible = true; chat.scale.setScalar(0.01); drawChat('', true); },
      update(f, t, dt) {
        const sp = f.sp;
        const pop = t < 0.18 ? ease(t / 0.18) * 1.1 : t > 1.6 ? Math.max(0.01, 1 - (t - 1.6) / 0.25) : 1;
        chat.scale.setScalar(pop);
        chat.position.set(f.x + 1.2, 2.9 + Math.sin(t * 6) * 0.05, 0.4);
        const word = 'B-O-O-M';
        const n = clamp(Math.floor((t - 0.2) / 0.1), 0, word.length);
        if (n !== sp.typed) { sp.typed = n; if (n > 0 && word[n - 1] !== '-') Sound.play('key'); }
        if (t > 0.95 && !sp.zap) { sp.zap = true; Sound.play('laser'); }
        drawChat(word.slice(0, n), t < 0.95 && Math.floor(t * 8) % 2 === 0);
        if (t > 0.95 && t < 1.5) {
          // the laser fires from the bubble's tail to the truck's nose
          beam.visible = true;
          const sx = chat.position.x - 0.7, sy = chat.position.y - 0.9;
          const ex = Truck.destroyed ? sx + 6 : Truck.frontX() + 0.1, ey = 1.2;
          beam.position.set(sx, sy, 0.45);
          beam.rotation.z = Math.atan2(ey - sy, ex - sx);
          const len = Math.hypot(ex - sx, ey - sy);
          beam.scale.set(len, 1 + Math.sin(t * 70) * 0.25, 1 + Math.sin(t * 70) * 0.25);
          _v3.set(ex, ey, 0.4);
          FX.burst('spark', _v3, 2);
          if (t >= 1.0 + sp.ticks * 0.15 && sp.ticks < 3) { sp.ticks++; hit(f, DMG / 3, 1.2, 99); }
        } else beam.visible = false;
      },
      pose(rig, t) {
        rig.set('shR', -2.5, 0, -0.3); rig.set('elR', -0.3);              // hand raised to the bubble
        rig.set('shL', -0.6, 0, 0.3); rig.set('elL', -1.2);
        rig.set('head', -0.25, 0.2, 0);
      },
      end() { chat.visible = false; beam.visible = false; },
    },
  };

  return {
    get: (id) => DEFS[id],
    /** Make every prop visible (or hide them) — used once at load to pre-compile shaders. */
    showAll(on) {
      stamp.visible = chat.visible = beam.visible = on;
      for (const d of decals) { if (on) scene.add(d); else d.removeFromParent(); d.visible = on; }
    },
    wireframe: (on) => setMetaverse(on),
    /** Put every prop away (new round, fighter disposed, state change). */
    reset() {
      stamp.visible = chat.visible = beam.visible = false;
      for (const d of decals) { d.removeFromParent(); d.visible = false; }
      decalNext = 0;
      if (metaverse) setMetaverse(false);
      Truck.extLift = 0;
      Game.timeScale = 1;
    },
  };
})();

/**
 * The player-controlled fighter: movement on the X plane, attack timelines with a single
 * active frame that asks Combat to resolve the hit, input buffering, and pose selection.
 */
class Fighter {
  constructor(index) {
    this.def = FIGHTERS[index];
    this.model = FighterKit.build(this.def.id);
    this.model.id = this.def.id;
    this.rig = this.model.rig;
    this.root = this.rig.root;
    this.root.rotation.y = 1.1;                 // face the truck, turned 3/4 toward the camera
    scene.add(this.root);
    this.shadow = Shadows.track(this.rig.j.hips, 0.95, 0.7);
    this.reset(CONFIG.FIGHTER_START_X);
  }
  reset(x) {
    this.x = x; this.vx = 0; this.t = 0;
    this.mode = 'idle'; this.modeT = 0; this.hitDone = false; this.queued = null; this.queuedT = 0;
    this.side = 'L'; this.walkPh = 0; this.walkAmt = 0; this.specialCD = 0;
    this.root.position.set(x, 0, 0);
  }
  get attacking() { return this.mode === 'punch' || this.mode === 'kick' || this.mode === 'special'; }
  setMode(mode) { this.mode = mode; this.modeT = 0; }
  startAttack(kind) {
    this.mode = kind; this.modeT = 0; this.hitDone = false;
    if (kind === 'punch') this.side = this.side === 'L' ? 'R' : 'L';
    this.model.extras.onAttack?.();
    if (kind !== 'special') Sound.play(kind === 'kick' ? 'whooshKick' : 'whoosh');
    if (kind === 'special') {
      this.special = Specials.get(this.def.id);
      this.sp = {};
      this.special.start(this);
      Sound.play('sp' + this.def.id[0].toUpperCase() + this.def.id.slice(1));
      HUD.banner(this.def.special, { dur: 1.1, scale: 3, y: 214, color: ['#ffffff', '#ffd23a', this.def.color] });
    }
  }
  /** 0..1 how charged the special meter is. */
  get specialCharge() { return this.mode === 'special' ? 0 : 1 - this.specialCD / CONFIG.SPECIAL_COOLDOWN; }
  /** World position of the striking limb (for particles). */
  strikePoint(out) {
    const j = this.rig.j;
    return (this.mode === 'kick' ? j.kneeR : this.side === 'L' && this.mode !== 'special' ? j.handL : j.handR).getWorldPosition(out);
  }
  /** One sim tick. `control` = player input is live. */
  update(dt, control) {
    this.t += dt;
    this.modeT += dt;
    this.specialCD = Math.max(0, this.specialCD - dt);
    const wantPunch = control && Input.wasPressed('punch');
    const wantKick = control && Input.wasPressed('kick');
    const wantSpecial = control && Input.wasPressed('special') && this.specialCD <= 0;
    if (wantPunch || wantKick || wantSpecial) { this.queued = wantSpecial ? 'special' : wantKick ? 'kick' : 'punch'; this.queuedT = 0.2; }
    this.queuedT -= dt;
    if (this.queuedT <= 0) this.queued = null;

    let move = 0;
    if (this.mode === 'special') {
      this.special.update(this, this.modeT, dt);
      if (this.modeT >= this.special.dur) this.endSpecial();
    } else if (this.attacking) {
      const A = this.mode === 'kick' ? CONFIG.KICK : CONFIG.PUNCH;
      if (!this.hitDone && this.modeT >= A.dur * A.hitAt) {
        this.hitDone = true;
        Combat.strike(this, this.mode, A);
      }
      if (this.modeT >= A.dur) this.mode = 'idle';
    } else if (this.mode === 'idle' && control) {
      if (this.queued) { this.startAttack(this.queued); this.queued = null; }
      else move = (Input.isDown('right') ? 1 : 0) - (Input.isDown('left') ? 1 : 0);
    }
    // movement on the fight plane; the truck's nose is a wall
    const target = move * CONFIG.WALK_SPEED;
    this.vx = damp(this.vx, target, 18, dt);
    this.x += this.vx * dt;
    const wall = Truck.destroyed ? Truck.backX() + 2 : Truck.frontX() - CONFIG.BODY_R;
    this.x = clamp(this.x, CONFIG.ARENA_MIN_X, wall);
    this.root.position.x = this.x;
    this.walkPh += this.vx * dt * 4.2;
    this.walkAmt = damp(this.walkAmt, Math.min(1, Math.abs(this.vx) / CONFIG.WALK_SPEED * 1.5), 12, dt);
    this.animate(dt);
  }
  endSpecial() {
    this.special?.end?.(this);
    this.mode = 'idle';
    this.specialCD = CONFIG.SPECIAL_COOLDOWN;   // the 3 s cooldown starts when the move finishes
    this.root.rotation.y = 1.1;
  }
  animate(dt) {
    const rig = this.rig, K = FighterKit;
    rig.reset();
    const f = { t: this.t, vx: this.vx, mode: this.mode, rig, attacking: this.attacking };
    if (this.mode === 'victory') K.victory(rig, this.modeT, this.def.id);
    else if (this.mode === 'defeat') K.defeat(rig, this.modeT, this.def.id);
    else if (this.mode === 'stand') K.stand(rig, this.t);
    else {
      K.guard(rig, this.t);
      if (this.walkAmt > 0.01) K.walk(rig, this.walkPh, this.walkAmt);
      if (this.mode === 'punch') K.punch(rig, this.modeT / CONFIG.PUNCH.dur, this.side);
      if (this.mode === 'kick') K.kick(rig, this.modeT / CONFIG.KICK.dur);
      if (this.mode === 'special') this.special.pose(rig, this.modeT, this);
    }
    K.finishPose(this.model, this.t, dt, f);
  }
  dispose() {
    if (this.mode === 'special') this.special?.end?.(this);
    Shadows.untrack(this.shadow);
    this.rig.dispose();
  }
}

/* =====================================================================================
 * 7. COMBAT — 1D hitbox/hurtbox ranges on the fight plane, damage, knockback, reactions,
 *    scoring, and the H debug overlay that draws the ranges.
 * ===================================================================================== */
const Combat = (() => {
  const stats = { hits: 0, score: 0, damage: 0, combo: 0, lastHitT: -9 };
  // Debug overlay: translucent strips on the fight plane (hidden unless H is pressed).
  const dbgMat = (c) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.35, depthTest: false, fog: false });
  const strip = (c) => { const m = new THREE.Mesh(box(1, 1, 0.06), dbgMat(c)); m.renderOrder = 50; m.visible = false; scene.add(m); return m; };
  const dbg = { on: false, hurt: strip(0x3a8aff), hit: strip(0xff3a3a), truck: strip(0x3aff6a) };
  const place = (m, x0, x1, y0, y1) => { m.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0.9); m.scale.set(Math.max(0.02, x1 - x0), y1 - y0, 1); };

  return {
    stats,
    reset() { stats.hits = stats.score = stats.damage = stats.combo = 0; stats.lastHitT = -9; },
    /** Is the truck's nose within `reach` of the fighter? (hitbox [x, x+reach] vs hurtbox [front, back]) */
    inRange(f, reach) { return !Truck.destroyed && f.x + reach >= Truck.frontX() - 0.05 && f.x <= Truck.backX(); },
    /** Resolve an attack's active frame. A = { dmg, power, reach, y }. Returns damage dealt. */
    strike(f, kind, A) {
      const p = f.strikePoint(_v2);
      if (!this.inRange(f, A.reach)) {
        FX.burst('puff', p, 2, { scale: 0.6 });         // whiff
        return 0;
      }
      const dealt = Truck.hit({ dmg: A.dmg, power: A.power, y: A.y ?? p.y });
      if (!dealt) return 0;
      stats.hits++;
      stats.damage += dealt;
      stats.score += Math.round(dealt * 10);
      stats.combo = Stage.time - stats.lastHitT < 0.9 ? stats.combo + 1 : 1;   // chain hits for the combo counter
      stats.lastHitT = Stage.time;
      // impact feedback: sound, debris, hit-stop, shake, punch-zoom, comic text
      const special = kind === 'special', heavy = A.power >= 1.5;
      if (A.power >= 0.75) Sound.play(kind === 'kick' || A.power >= 2.5 ? 'kick' : 'punch');
      Sound.play('metal', A.power);
      if (A.power >= 2.5) Sound.play('cheer', 0.7);
      _v3.set(Truck.frontX() + 0.05, clamp(p.y, 0.7, 1.6), 0.35);
      FX.burst('chip', _v3, 2 + Math.round(A.power * 2), { dir: _v1.set(-1.5, 1, 0.5) });
      FX.burst('spark', _v3, 4 + Math.round(A.power * 3));
      if (heavy) FX.burst('shard', _v3, Math.round(A.power * 2), { dir: _v1.set(-1, 1.5, 1) });
      Juice.hitstop(A.power >= 2.5 ? 0.13 : heavy ? 0.075 : A.power >= 1 ? 0.05 : 0.025);
      Juice.shake(A.power >= 2.5 ? 0.55 : heavy ? 0.33 : A.power >= 1 ? 0.2 : 0.1);
      if (heavy) Juice.zoom(A.power >= 2.5 ? 3.5 : 1.6);
      if (A.power >= 2.5) Juice.flash(0.22);
      const roll = Math.random();
      if (A.power >= 2.5) ComicText.pop('heavy', _v3, 1.4);
      else if (heavy ? roll < 0.6 : A.power >= 1 ? roll < 0.3 : roll < 0.12) ComicText.pop(heavy ? 'heavy' : 'light', _v3, heavy ? 1.1 : 0.85);
      f.vx -= 1.2 * A.power;                              // recoil
      // the audience
      if (A.power >= 1.5 && Math.random() < 0.5) Salesman.react('cover', 1.1);
      else Salesman.react('wince', 0.55);
      Stage.Crowd.excite(0.1 * A.power);
      return dealt;
    },
    toggleDebug() { dbg.on = !dbg.on; for (const k of ['hurt', 'hit', 'truck']) dbg[k].visible = dbg.on; },
    /** Update the hitbox overlay for the current fighter. */
    updateDebug(f) {
      if (!dbg.on || !f) return;
      place(dbg.hurt, f.x - CONFIG.BODY_R, f.x + CONFIG.BODY_R, 0, 1.7);
      const A = f.mode === 'kick' ? CONFIG.KICK : CONFIG.PUNCH;
      place(dbg.hit, f.x, f.x + A.reach, f.mode === 'kick' ? 0.3 : 0.8, f.mode === 'kick' ? 1.0 : 1.3);
      dbg.hit.material.opacity = f.attacking ? 0.6 : 0.18;
      if (Truck.destroyed) dbg.truck.visible = false;
      else { dbg.truck.visible = true; place(dbg.truck, Truck.frontX(), Truck.backX(), 0, 2.1); }
    },
    hideDebug() { for (const k of ['hurt', 'hit', 'truck']) dbg[k].visible = false; },
  };
})();

/* =====================================================================================
 * 8. FX / JUICE — instanced particle pools (debris, glow, smoke).
 *    Three InstancedMeshes cover every particle in the game: 3 draw calls total.
 * ===================================================================================== */
const FX = (() => {
  /** A fixed-size pool of particles rendered by one InstancedMesh. */
  class Pool {
    constructor(geo, mat, max) {
      this.max = max;
      this.mesh = new THREE.InstancedMesh(geo, mat, max);
      this.mesh.frustumCulled = false;
      this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      this.mesh.setColorAt(0, _col.setHex(0xffffff));
      scene.add(this.mesh);
      const f = (n = 1) => new Float32Array(max * n);
      this.p = f(3); this.v = f(3); this.r = f(3); this.w = f(3);
      this.life = f(); this.maxLife = f(); this.s0 = f(); this.s1 = f(); this.grav = f(); this.drag = f(); this.bounce = f();
      this.next = 0;
      for (let i = 0; i < max; i++) this.hide(i);
    }
    hide(i) { _dummy.position.set(0, -50, 0); _dummy.scale.setScalar(0); _dummy.updateMatrix(); this.mesh.setMatrixAt(i, _dummy.matrix); }
    /** Spawn one particle (round-robin; the oldest gets recycled when full). */
    spawn(px, py, pz, vx, vy, vz, o) {
      const i = this.next; this.next = (this.next + 1) % this.max;
      const i3 = i * 3;
      this.p[i3] = px; this.p[i3 + 1] = py; this.p[i3 + 2] = pz;
      this.v[i3] = vx; this.v[i3 + 1] = vy; this.v[i3 + 2] = vz;
      this.r[i3] = rand(0, 6); this.r[i3 + 1] = rand(0, 6); this.r[i3 + 2] = rand(0, 6);
      const sp = o.spin ?? 10;
      this.w[i3] = rand(-sp, sp); this.w[i3 + 1] = rand(-sp, sp); this.w[i3 + 2] = rand(-sp, sp);
      this.life[i] = this.maxLife[i] = o.life;
      this.s0[i] = o.s0; this.s1[i] = o.s1 ?? o.s0;
      this.grav[i] = o.grav ?? 18; this.drag[i] = o.drag ?? 0.5; this.bounce[i] = o.bounce ?? 0.3;
      this.mesh.setColorAt(i, _col.setHex(o.color));
      this.mesh.instanceColor.needsUpdate = true;
      this.idle = false;
    }
    update(dt) {
      if (this.idle) return;                 // nothing alive: no per-tick work, no GPU upload
      let alive = 0;
      const { p, v, r, w } = this;
      for (let i = 0; i < this.max; i++) {
        if (this.life[i] <= 0) continue;
        this.life[i] -= dt;
        if (this.life[i] <= 0) { this.hide(i); continue; }
        alive++;
        const i3 = i * 3;
        const dragK = Math.exp(-this.drag[i] * dt);
        v[i3] *= dragK; v[i3 + 2] *= dragK;
        v[i3 + 1] = v[i3 + 1] * dragK - this.grav[i] * dt;
        p[i3] += v[i3] * dt; p[i3 + 1] += v[i3 + 1] * dt; p[i3 + 2] += v[i3 + 2] * dt;
        const t = 1 - this.life[i] / this.maxLife[i];
        let s = lerp(this.s0[i], this.s1[i], t);
        if (this.life[i] < 0.25) s *= this.life[i] / 0.25;   // shrink out
        // bounce on the dock and slide to rest
        if (this.bounce[i] > 0 && p[i3 + 1] < s * 0.5) {
          p[i3 + 1] = s * 0.5;
          if (v[i3 + 1] < 0) v[i3 + 1] = -v[i3 + 1] * this.bounce[i];
          v[i3] *= 0.7; v[i3 + 2] *= 0.7; w[i3] *= 0.6; w[i3 + 1] *= 0.6; w[i3 + 2] *= 0.6;
        }
        r[i3] += w[i3] * dt; r[i3 + 1] += w[i3 + 1] * dt; r[i3 + 2] += w[i3 + 2] * dt;
        _dummy.position.set(p[i3], p[i3 + 1], p[i3 + 2]);
        _dummy.rotation.set(r[i3], r[i3 + 1], r[i3 + 2]);
        _dummy.scale.setScalar(Math.max(0.0001, s));
        _dummy.updateMatrix();
        this.mesh.setMatrixAt(i, _dummy.matrix);
      }
      this.mesh.instanceMatrix.needsUpdate = true;
      if (alive === 0) this.idle = true;
    }
    clear() { for (let i = 0; i < this.max; i++) { this.life[i] = 0; this.hide(i); } this.mesh.instanceMatrix.needsUpdate = true; this.idle = true; }
  }

  const debris = new Pool(box(1, 1, 1), Mat.toon(0xffffff, { rim: 0.5 }), 260);
  const glow = new Pool(new THREE.OctahedronGeometry(0.7, 0), Mat.basic(0xffffff, { fog: false }), 220);
  const smoke = new Pool(new THREE.IcosahedronGeometry(0.5, 0), Mat.toon(0xffffff, { rim: 0.15 }), 110);
  const shards = new Pool(box(1, 0.12, 0.62), Mat.toon(0xffffff, { rim: 0.6, side: THREE.DoubleSide }), 160); // flat panel & glass shards

  /** Named particle recipes. burst(kind, position, count, {scale, dir}). */
  const RECIPES = {
    bolt: (o) => [debris, { life: rand(1.2, 2.2), s0: rand(0.05, 0.1) * o.scale, color: pick([0x8d939e, 0x5d636e, 0xc8ced8, 0x2a2a30]), grav: 18, bounce: 0.4 }, 4, 5],
    chip: (o) => [debris, { life: rand(1.5, 2.6), s0: rand(0.1, 0.22) * o.scale, color: pick([0xc8ced8, 0xb0b6c0, 0xe0e4ea]), grav: 18, bounce: 0.3 }, 3.5, 4],
    glass: (o) => [shards, { life: rand(1.4, 2.4), s0: rand(0.08, 0.18) * o.scale, color: pick([0xbfe6ff, 0x8fc8ee, 0xffffff, 0x6aa0c8]), grav: 16, bounce: 0.35, spin: 16 }, 3, 4],
    shard: (o) => [shards, { life: rand(1.8, 3.0), s0: rand(0.15, 0.32) * o.scale, color: pick([0xa9b1bf, 0x8d95a3, 0xc0c8d4, 0x6a7280]), grav: 18, bounce: 0.3, spin: 12 }, 3.5, 4.5],
    spark: (o) => [glow, { life: rand(0.25, 0.6), s0: rand(0.06, 0.12) * o.scale, s1: 0.01, color: pick([0xfff27a, 0xffc040, 0xffffff]), grav: 9, drag: 1, bounce: 0.5, spin: 0 }, 6, 6],
    smoke: (o) => [smoke, { life: rand(1.4, 2.2), s0: rand(0.2, 0.32) * o.scale, s1: rand(0.75, 1.1) * o.scale, color: pick([0x5a5462, 0x6c6674, 0x7e7886]), grav: -1.8, drag: 1.2, bounce: 0, spin: 1.5 }, 0.5, 0.6],
    puff: (o) => [smoke, { life: rand(0.4, 0.7), s0: rand(0.2, 0.35) * o.scale, s1: rand(0.6, 0.9) * o.scale, color: pick([0xe8dcd0, 0xd8ccc0]), grav: -1, drag: 4, bounce: 0, spin: 2 }, 3, 2],
    gspark: (o) => [glow, { life: rand(0.25, 0.5), s0: rand(0.06, 0.11) * o.scale, s1: 0.01, color: pick([0x9aff6a, 0x5aff3a, 0xd8ffc0]), grav: 4, drag: 2, bounce: 0, spin: 0 }, 3, 3],
    flame: (o) => [glow, { life: rand(0.3, 0.55), s0: rand(0.18, 0.3) * o.scale, s1: rand(0.45, 0.7) * o.scale, color: pick([0xffe24a, 0xff9a2a, 0xff5a1a, 0xfff6b0]), grav: -3, drag: 2, bounce: 0, spin: 4 }, 1.5, 1.5],
  };

  return {
    debris, glow, smoke, shards,
    /**
     * Spawn `count` particles of a recipe at `pos`. opts.dir biases the velocity
     * (e.g. away from a punch), opts.scale scales the size.
     */
    burst(kind, pos, count = 1, opts = {}) {
      const o = { scale: opts.scale ?? 1 };
      for (let i = 0; i < count; i++) {
        const [pool, cfg, spread, up] = RECIPES[kind](o);
        const d = opts.dir;
        pool.spawn(
          pos.x + rand(-0.15, 0.15), pos.y + rand(-0.15, 0.15), pos.z + rand(-0.15, 0.15),
          rand(-spread, spread) * 0.6 + (d ? d.x : 0), rand(0.3, 1) * up + (d ? d.y : 0), rand(-spread, spread) * 0.6 + (d ? d.z : 0),
          cfg,
        );
      }
    },
    update(dt) { debris.update(dt); glow.update(dt); smoke.update(dt); shards.update(dt); },
    clear() { debris.clear(); glow.clear(); smoke.clear(); shards.clear(); },
  };
})();

/* ---------- Juice: screen shake, hit-stop, camera punch-zoom, flashes ---------- */
const Juice = (() => {
  let trauma = 0, fovKick = 0, t = 0;
  const offset = new THREE.Vector3();
  return {
    offset,
    roll: 0,
    stop: 0,              // seconds of hit-stop left (sim frozen, camera keeps shaking)
    get fovKick() { return fovKick; },
    /** Add screen-shake trauma (0..1); the shake scales with trauma². */
    shake(a) { trauma = Math.min(1, trauma + a); },
    /** Freeze the simulation for a few frames on impact. */
    hitstop(s) { this.stop = Math.max(this.stop, s); },
    /** Punch the camera in (narrow the FOV by `deg` degrees, eases back). */
    zoom(deg) { fovKick = Math.min(fovKick, -deg); },
    flash(a, color = 0xffffff) { Post.uniforms.uFlash.value = Math.max(Post.uniforms.uFlash.value, a); Post.uniforms.uFlashColor.value.setHex(color); },
    update(dt) {
      t += dt;
      this.stop = Math.max(0, this.stop - dt);
      trauma = Math.max(0, trauma - dt * 1.6);
      const s = trauma * trauma;
      // layered sines as cheap smooth noise
      offset.set(
        (Math.sin(t * 47) + Math.sin(t * 83) * 0.5) * 0.22 * s,
        (Math.sin(t * 53 + 1) + Math.sin(t * 97) * 0.5) * 0.16 * s,
        0,
      );
      this.roll = Math.sin(t * 61) * 0.035 * s;
      fovKick = damp(fovKick, 0, 7, dt);
      Post.uniforms.uFlash.value = Math.max(0, Post.uniforms.uFlash.value - dt * 3.2);
    },
    reset() { trauma = 0; fovKick = 0; this.stop = 0; offset.set(0, 0, 0); this.roll = 0; Post.uniforms.uFlash.value = 0; },
  };
})();

/* ---------- Comic hit text: 3D billboards (sprites) that scale in, wobble and fade ---------- */
const ComicText = (() => {
  const WORDS = { light: ['BONK!', 'WHAM!', 'POW!', 'KRAK!', 'DENT!', 'OOF!'], heavy: ['CRUNCH!', 'SPANG!', 'KA-BLAM!', 'VOID WARRANTY!'], recall: ['RECALL!'], wreck: ['NO REFUNDS!'] };
  const PALETTE = [['#ffe14a', '#ff3c3c'], ['#7dfff0', '#3a5aff'], ['#ffffff', '#ff7a2a'], ['#ff8ad8', '#8a2aff']];
  const texCache = new Map();
  /** Jagged comic "burst" behind outlined pixel lettering. */
  function wordTexture(word, pal) {
    const key = word + pal;
    if (texCache.has(key)) return texCache.get(key);
    const scale = 2, tw = PixelFont.measure(word, scale);
    const w = tw + 30, h = 40;
    const [c, x] = makeCanvas(w, h);
    const burst = (grow, col) => {
      x.beginPath();
      const n = 18;
      for (let i = 0; i <= n; i++) {
        const a = (i / n) * Math.PI * 2, r = i % 2 ? 0.78 : 1;
        const px = w / 2 + Math.cos(a) * (w / 2 - 2 + grow) * r, py = h / 2 + Math.sin(a) * (h / 2 - 2 + grow) * r;
        i ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.fillStyle = col; x.fill();
    };
    burst(0, '#000');
    burst(-2, PALETTE[pal][0]);
    burst(-7, PALETTE[pal][1]);
    PixelFont.draw(x, word, w / 2, h / 2 - 7, { scale, align: 'center', color: ['#ffffff', '#fff6c0'], outline: 1 });
    const tex = canvasTexture(c);
    tex.userData = { w, h };
    texCache.set(key, tex);
    return tex;
  }
  const pool = Array.from({ length: 6 }, () => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthTest: false, depthWrite: false }));
    s.renderOrder = 80; s.visible = false;
    scene.add(s);
    return { s, t: 0, life: 0, size: 1, tilt: 0, base: 1 };
  });
  let next = 0;
  return {
    /** Pop a word of `kind` ('light' | 'heavy' | 'recall' | 'wreck') at a world position. */
    pop(kind, pos, size = 1) {
      const p = pool[next++ % pool.length];
      const tex = wordTexture(pick(WORDS[kind]), (Math.random() * PALETTE.length) | 0);
      p.s.material.map = tex; p.s.material.needsUpdate = true;
      p.base = tex.userData.w / 36 * size;
      p.aspect = tex.userData.h / tex.userData.w;
      p.s.position.set(pos.x + rand(-0.3, 0.3), pos.y + rand(0.2, 0.6), pos.z + 1.2);
      p.t = 0; p.life = 0.95; p.tilt = rand(-0.25, 0.25);
      p.s.visible = true;
    },
    update(dt) {
      for (const p of pool) {
        if (!p.s.visible) continue;
        p.t += dt;
        if (p.t > p.life) { p.s.visible = false; continue; }
        const k = p.t / 0.13;
        const sIn = k < 1 ? 1 + 2.70158 * Math.pow(k - 1, 3) + 1.70158 * Math.pow(k - 1, 2) : 1;   // ease-out-back
        const sc = p.base * Math.max(0.01, sIn);
        p.s.scale.set(sc, sc * p.aspect, 1);
        p.s.material.rotation = p.tilt + Math.sin(p.t * 22) * 0.12 * Math.max(0, 1 - p.t * 2);
        p.s.position.y += dt * 0.5;
        p.s.material.opacity = clamp((p.life - p.t) / 0.25, 0, 1);
      }
    },
    clear() { for (const p of pool) p.s.visible = false; },
  };
})();

/* =====================================================================================
 * 9. HUD — everything drawn on the 480x270 overlay canvas: bouncy numbers, plates,
 *    announcement banners and speech bubbles anchored to 3D positions.
 * ===================================================================================== */
const HUD = (() => {
  const W = CONFIG.LOW_W, H = CONFIG.LOW_H;
  const pops = new Map();     // key -> { v, t } for the bounce-on-change effect
  const banners = [];
  const bubbles = new Map();
  const _p = new THREE.Vector3();

  /** Word-wrap a string to lines of at most `max` characters. */
  function wrap(text, max) {
    const lines = [];
    let line = '';
    for (const word of text.split(' ')) {
      if ((line + ' ' + word).trim().length > max) { if (line) lines.push(line); line = word; }
      else line = (line + ' ' + word).trim();
    }
    if (line) lines.push(line);
    return lines;
  }

  return {
    wrap,
    /** Returns a scale factor that pops whenever `value` changes for this key. */
    pop(key, value, amp = 0.55) {
      let b = pops.get(key);
      if (!b) { b = { v: value, t: 9 }; pops.set(key, b); }
      if (b.v !== value) { b.v = value; b.t = 0; }
      return 1 + amp * Math.max(0, 1 - b.t / 0.22) ** 2;
    },
    /** Dark translucent plate with a hard black border. */
    /** Bevelled panel: drop shadow, hard border, gradient fill, fine highlight / inner rim (2x canvas). */
    plate(ctx, x, y, w, h, fill = 'rgba(18,8,36,0.8)', edge = '#000', rim = 'rgba(150,120,255,0.45)') {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x + 1, y + 2, w + 1, h);
      ctx.fillStyle = edge; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
      ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, 'rgba(255,255,255,0.10)'); g.addColorStop(0.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,0.25)');
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = rim;                                              // inner rim, one hi-res pixel
      ctx.fillRect(x + 0.5, y + 0.5, w - 1, 0.5); ctx.fillRect(x + 0.5, y + h - 1, w - 1, 0.5);
      ctx.fillRect(x + 0.5, y + 0.5, 0.5, h - 1); ctx.fillRect(x + w - 1, y + 0.5, 0.5, h - 1);
    },
    /** A framed portrait (drawn from a 2x-resolution canvas so it stays crisp). */
    portrait(ctx, img, x, y, w, h, border = '#ffd23a') {
      ctx.fillStyle = '#000'; ctx.fillRect(x - 1.5, y - 1.5, w + 3, h + 3);
      ctx.fillStyle = border; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
      ctx.drawImage(img, x, y, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x, y, w, 0.5);
    },
    update(dt) {
      for (const b of pops.values()) b.t += dt;
      for (let i = banners.length - 1; i >= 0; i--) { banners[i].t += dt; if (banners[i].t > banners[i].dur) banners.splice(i, 1); }
      for (const [k, b] of bubbles) { b.t += dt; if (b.t > b.dur) bubbles.delete(k); }
    },
    clear() { banners.length = 0; bubbles.clear(); },
    /** Big centred announcement that slams in, wobbles, and fades. */
    banner(text, o = {}) {
      banners.push({ text, t: 0, dur: o.dur ?? 1.5, scale: o.scale ?? 6, color: o.color ?? ['#fffbe0', '#fff36b', '#ff9a3c', '#ff3c6e'], y: o.y ?? 100, sub: o.sub, subColor: o.subColor });
    },
    /** Speech bubble for `id` that follows anchor() (a world-space point), typed out letter by letter. */
    say(id, text, anchor, o = {}) {
      const lines = wrap(text, o.width ?? 22);
      bubbles.set(id, { text, anchor, t: 0, dur: o.dur ?? 2.5, cps: o.cps ?? 28, lines, w: Math.max(...lines.map((l) => l.length)) * 6 + 9, h: lines.length * 9 + 6 });
    },
    hush(id) { bubbles.delete(id); },
    drawBanners(ctx) {
      for (const b of banners) {
        const inK = Math.min(1, b.t / 0.16);
        const pop = b.t < 0.16 ? lerp(2.4, 1, inK) : 1 + Math.sin((b.t - 0.16) * 18) * Math.max(0, 0.1 - (b.t - 0.16) * 0.2);
        ctx.globalAlpha = clamp((b.dur - b.t) / 0.2, 0, 1);
        PixelFont.draw(ctx, b.text, W / 2, b.y, { scale: b.scale, align: 'center', color: b.color, outline: 2, pop });
        if (b.sub) PixelFont.draw(ctx, b.sub, W / 2, b.y + 7 * b.scale + 8, { scale: 2, align: 'center', color: b.subColor ?? '#fff' });
        ctx.globalAlpha = 1;
      }
    },
    drawBubbles(ctx) {
      for (const bb of bubbles.values()) {
        _p.copy(bb.anchor()).project(camera);
        if (_p.z > 1) continue;
        const ax = (_p.x * 0.5 + 0.5) * W, ay = (0.5 - _p.y * 0.5) * H;
        const { w, h } = bb;
        const x = Math.round(clamp(ax - w / 2, 3, W - w - 3)), y = Math.round(clamp(ay - h - 9, 3, H - h - 12));
        const tx = Math.round(clamp(ax, x + 5, x + w - 8));
        const fade = clamp((bb.dur - bb.t) / 0.15, 0, 1);
        ctx.globalAlpha = fade;
        // tail, then body (black border, white fill)
        ctx.fillStyle = '#000';
        for (let i = 0; i < 8; i++) ctx.fillRect(tx - 1 + Math.round(i * 0.4), y + h + i, Math.max(1, 6 - i) + 2, 1);
        ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
        ctx.fillStyle = '#fff';
        ctx.fillRect(x, y, w, h);
        for (let i = 0; i < 7; i++) ctx.fillRect(tx + Math.round(i * 0.4), y + h + i - 1, Math.max(0, 5 - i), 1);
        let left = Math.floor(bb.t * bb.cps);
        bb.lines.forEach((line, i) => {
          const part = line.slice(0, Math.max(0, left));
          left -= line.length + 1;
          if (part) PixelFont.draw(ctx, part, x + 5, y + 4 + i * 9, { color: '#1a1030', outline: 0 });
        });
        ctx.globalAlpha = 1;
      }
    },
  };
})();

/* ---------- Portraits: real 3D renders of the models, read back into 2D canvases ---------- */
const Portraits = (() => {
  const cache = new Map();
  const pScene = new THREE.Scene();
  pScene.add(new THREE.HemisphereLight(0xffe4cc, 0x40306a, 1.3));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 3, 4); pScene.add(key);
  const rim = new THREE.DirectionalLight(0xff5aa0, 2.4); rim.position.set(-3, 2, -3); pScene.add(rim);
  const pCam = new THREE.PerspectiveCamera(26, 1, 0.1, 100);

  // gradient backdrop card behind the bust
  const [bc, bx] = makeCanvas(4, 32);
  const bg = bx.createLinearGradient(0, 0, 0, 32);
  bg.addColorStop(0, '#3a1a6a'); bg.addColorStop(0.7, '#a0306a'); bg.addColorStop(1, '#ff7a5a');
  bx.fillStyle = bg; bx.fillRect(0, 0, 4, 32);
  const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), Mat.basic(0xffffff, { map: canvasTexture(bc), fog: false }));
  backdrop.position.set(0, 1.3, -2.5);
  pScene.add(backdrop);
  const _size = new THREE.Vector2();

  /**
   * Render `sc` from `cam` into the bottom-left w x h corner of the main canvas and copy it
   * into a 2D canvas in the same task (avoids a GPU-stalling readPixels). The frame that
   * follows overwrites the corner.
   */
  function snapshot(sc, cam, w, h) {
    const dpr = renderer.getPixelRatio();
    renderer.getSize(_size);
    renderer.setRenderTarget(null);
    renderer.setViewport(0, 0, w / dpr, h / dpr);
    renderer.setScissor(0, 0, w / dpr, h / dpr);
    renderer.setScissorTest(true);
    renderer.render(sc, cam);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, _size.x, _size.y);
    const [c, x] = makeCanvas(w, h);
    x.drawImage(glCanvas, 0, glCanvas.height - h, w, h, 0, 0, w, h);
    return c;
  }

  return {
    /** Bust portrait of fighter `index` (cached). */
    fighter(index, size = 40, mode = 'stand', yaw = 0.25) {
      const k = `${index}|${size}|${mode}|${yaw}`;
      if (cache.has(k)) return cache.get(k);
      const def = FIGHTERS[index];
      const m = FighterKit.build(def.id);
      m.id = def.id;
      m.rig.root.rotation.y = yaw;
      pScene.add(m.rig.root);
      for (let i = 0; i < 20; i++) FighterKit.animate(m, mode, 0.25, 1 / 30); // settle into the pose
      pCam.aspect = 1; pCam.fov = 26;
      pCam.position.set(0.3, 1.5, 2.35); pCam.lookAt(0, 1.3, 0); pCam.updateProjectionMatrix();
      const c = snapshot(pScene, pCam, size, size);
      m.rig.dispose();
      cache.set(k, c);
      return c;
    },
    /** 3/4 "glamour shot" of the pristine truck in the harbor (cached). */
    truck(w, h) {
      const k = `truck|${w}|${h}`;
      if (cache.has(k)) return cache.get(k);
      const tp = Truck.root.position;
      const cam = new THREE.PerspectiveCamera(30, w / h, 0.1, 700);
      cam.position.set(tp.x - 5.2, 1.7, 4.6); cam.lookAt(tp.x - 0.4, 1.0, 0);
      Stage.sky.position.copy(cam.position);
      const c = snapshot(scene, cam, w, h);
      cache.set(k, c);
      return c;
    },
  };
})();

/* =====================================================================================
 * 10. AUDIO — every sound is synthesised with the Web Audio API (oscillators, filtered
 *     noise, envelopes). The context starts on the first user input (autoplay rules).
 *     M toggles mute (remembered in localStorage when available).
 * ===================================================================================== */
const Sound = (() => {
  const VOLUME = 0.55;
  let ac = null, master = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('cybersmash.muted') === '1'; } catch { /* storage unavailable */ }

  /** Create / resume the AudioContext. Call from a user-input handler. */
  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 5;
      master = ac.createGain();
      master.gain.value = muted ? 0 : VOLUME;
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  const N = (n) => 440 * Math.pow(2, (n - 69) / 12);   // MIDI note → Hz

  /** One oscillator voice: pitch slide f0→f1, quick attack, exponential decay; opts: lp, vib, attack. */
  function tone(type, f0, f1, dur, vol = 0.3, delay = 0, o = {}) {
    const t = ac.currentTime + delay;
    const osc = ac.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    if (o.vib) {
      const lfo = ac.createOscillator(), depth = ac.createGain();
      lfo.frequency.value = o.vib; depth.gain.value = f0 * 0.025;
      lfo.connect(depth); depth.connect(osc.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.05);
    }
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (o.attack ?? 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); node = f; }
    node.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  /** Filtered white noise burst with a sweeping cutoff. */
  function hiss(dur, vol, type = 'bandpass', f0 = 1000, f1 = f0, q = 1, delay = 0) {
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = ac.createBiquadFilter();
    f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }
  const seq = (type, notes, vol, o = {}) => {        // [[midi, start, dur], ...]
    for (const [n, s, d] of notes) tone(type, N(n), null, d, vol, s, o);
  };

  const SFX = {
    // --- combat ---
    whoosh: () => hiss(0.14, 0.12, 'bandpass', 700, 2600, 1.5),
    whooshKick: () => hiss(0.24, 0.16, 'bandpass', 380, 1800, 1.2),
    punch: () => { tone('sine', 150, 50, 0.14, 0.75); hiss(0.06, 0.3, 'lowpass', 1600, 400); },
    kick: () => { tone('sine', 115, 38, 0.22, 0.85); hiss(0.1, 0.35, 'lowpass', 1200, 300); },
    metal: (p = 1) => {
      const b = rand(0.85, 1.2), v = Math.min(1.4, 0.6 + p * 0.25);
      for (const [f, a] of [[340, 0.13], [523, 0.1], [781, 0.08], [1180, 0.06]]) tone('square', f * b, f * b * 0.9, 0.16 + 0.08 * p, a * v, 0, { lp: 3500 });
      hiss(0.16 + 0.06 * p, 0.22 * v, 'highpass', 2600, 1200, 0.7);
    },
    glass: () => {
      hiss(0.5, 0.35, 'highpass', 5200, 2400, 0.5);
      for (let i = 0; i < 8; i++) tone('sine', rand(2400, 6200), null, rand(0.05, 0.2), 0.07, rand(0, 0.3));
    },
    clang: () => { for (const f of [196, 311, 467, 733]) tone('triangle', f, f * 0.97, 0.75, 0.12); hiss(0.3, 0.22, 'bandpass', 1800, 700, 2); },
    crash: () => {
      tone('sine', 72, 26, 1.2, 0.9);
      hiss(1.4, 0.55, 'lowpass', 4200, 140, 0.5);
      for (let i = 0; i < 6; i++) { const f = rand(180, 600); tone('square', f, f * 0.8, 0.25, 0.07, i * 0.09 + rand(0, 0.05), { lp: 2500 }); }
    },
    spark: () => { for (let i = 0; i < 4; i++) hiss(0.03, 0.1, 'highpass', 6000, 6000, 1, rand(0, 0.15)); },
    stamp: () => { tone('sine', 85, 28, 0.55, 1); hiss(0.3, 0.5, 'lowpass', 2600, 160); },
    // --- UI / announcer stingers (all original) ---
    blip: () => tone('square', 660, 990, 0.05, 0.12),
    confirm: () => [72, 76, 79, 84].forEach((n, i) => tone('square', N(n), null, 0.09, 0.13, i * 0.05)),
    slam: () => { tone('sine', 95, 32, 0.65, 0.9); hiss(0.45, 0.4, 'lowpass', 3200, 180); for (const n of [45, 52, 57]) tone('sawtooth', N(n), null, 0.7, 0.08, 0, { lp: 1300 }); },
    announce: () => { for (const n of [57, 64]) tone('sawtooth', N(n), null, 0.6, 0.12, 0, { lp: 1700, vib: 6 }); },
    haggle: () => { for (const n of [62, 69, 74]) tone('sawtooth', N(n), N(n) * 1.01, 0.8, 0.13, 0, { lp: 2500, vib: 7 }); hiss(0.3, 0.3, 'lowpass', 3200, 300); tone('sine', 125, 45, 0.45, 0.6); },
    beep: () => tone('square', 988, null, 0.09, 0.16),
    beepLast: () => tone('square', 1319, null, 0.45, 0.18),
    tick: () => tone('square', 1760, null, 0.03, 0.05),
    cheer: (k = 1) => {
      hiss(1.7, 0.16 * k, 'bandpass', 900, 1300, 0.6);
      for (let i = 0; i < 6; i++) { const f = rand(380, 640); tone('triangle', f, f * 1.6, rand(0.3, 0.6), 0.035 * k, rand(0, 0.7), { vib: 9 }); }
    },
    // PERFECT: a short original 8-bit fanfare (square lead over a triangle bass)
    jingle: () => {
      seq('square', [[72, 0, 0.1], [76, 0.1, 0.1], [79, 0.2, 0.1], [84, 0.3, 0.22], [83, 0.55, 0.1], [84, 0.65, 0.1], [88, 0.75, 0.6]], 0.11);
      seq('square', [[64, 0.3, 0.2], [67, 0.75, 0.6]], 0.06);
      seq('triangle', [[48, 0, 0.3], [55, 0.3, 0.4], [60, 0.75, 0.7]], 0.22);
    },
    // SALE CANCELLED: the sad trombone ("wah wah wah waaah")
    trombone: () => {
      [55, 54, 53, 52].forEach((n, i) => tone('sawtooth', N(n), i === 3 ? N(n) * 0.97 : N(n), i === 3 ? 1.2 : 0.42, 0.15, i * 0.46, { lp: 900, vib: i === 3 ? 5 : 0, attack: 0.05 }));
    },
    // --- salesman ---
    none: () => {},
    eep: () => tone('sine', 700, 1150, 0.12, 0.09),
    slide: () => tone('sine', 1400, 250, 0.95, 0.16),                       // fainting slide whistle
    laugh: () => { for (let i = 0; i < 4; i++) tone('sawtooth', 330 - i * 16, 290 - i * 16, 0.12, 0.1, i * 0.16, { lp: 1500 }); },
    // --- special-move stingers ---
    spTromp: () => [60, 67].forEach((n, i) => tone('sawtooth', N(n), null, 0.26, 0.14, i * 0.15, { lp: 2100 })),
    spMuskrat: () => { hiss(1.05, 0.34, 'lowpass', 450, 950, 0.8, 0.25); hiss(1.05, 0.13, 'bandpass', 2200, 1400, 2, 0.25); },
    oops: () => tone('sine', 520, 380, 0.25, 0.12),
    spZuck: () => { for (let i = 0; i < 10; i++) tone('square', 220 + Math.round(Math.random() * 8) * 110, null, 0.05, 0.07, i * 0.045); tone('sine', 880, 1760, 0.3, 0.09, 0.5); },
    spHassabyte: () => { tone('sine', 420, 70, 0.9, 0.3); for (let i = 0; i < 6; i++) tone('square', 1200 + i * 160, null, 0.04, 0.05, 0.25 + i * 0.12); },
    ding: () => { tone('sine', 1568, null, 0.6, 0.2); tone('sine', 2349, null, 0.5, 0.07); },
    spHwatt: () => { tone('sawtooth', 140, 1500, 0.45, 0.1, 0, { lp: 3200 }); hiss(0.4, 0.12, 'bandpass', 700, 4200, 2); },
    spOldman: () => { [76, 79, 83].forEach((n, i) => tone('sine', N(n), null, 0.3, 0.1, i * 0.07)); tone('triangle', N(52), N(64), 0.5, 0.12); },
    key: () => tone('square', rand(1500, 1900), null, 0.025, 0.07),
    laser: () => { tone('square', 1900, 280, 0.55, 0.11, 0, { lp: 4200 }); tone('sawtooth', 110, 104, 0.6, 0.12, 0, { lp: 650 }); },
  };

  return {
    unlock,
    get muted() { return muted; },
    get state() { return ac ? ac.state : 'none'; },
    names: () => Object.keys(SFX),
    toggle() {
      muted = !muted;
      if (master) master.gain.setTargetAtTime(muted ? 0 : VOLUME, ac.currentTime, 0.02);
      try { localStorage.setItem('cybersmash.muted', muted ? '1' : '0'); } catch { /* storage unavailable */ }
    },
    /** Peak output level right now (debug / tests): taps the master bus with an analyser. */
    level() {
      if (!ac) return 0;
      if (!this.analyser) { this.analyser = ac.createAnalyser(); this.analyser.fftSize = 2048; master.connect(this.analyser); }
      const buf = new Float32Array(this.analyser.fftSize);
      this.analyser.getFloatTimeDomainData(buf);
      return buf.reduce((m, v) => Math.max(m, Math.abs(v)), 0);
    },
    /** Fire a named sound effect (silently skipped until audio is unlocked, or when muted). */
    play(name, ...args) {
      if (!SFX[name]) { console.error(`Sound: unknown effect "${name}"`); return; }
      if (!ac || ac.state !== 'running' || muted) return;
      SFX[name](...args);
    },
  };
})();

/* =====================================================================================

const Game = {

      });

  /* ---------- The round: intro → announce → play → end ---------- */
  fight: {
    INTRO: 4.8,
    enter(prev) {
      Game.view = 'harbor';
      this.timer = CONFIG.FIGHT_TIME; this.win = false; this.bonus = 0; this.events = new Set();
      Game.fighter?.dispose();
      Specials.reset(); Truck.reset(); FX.clear(); Combat.reset(); Salesman.reset(); Stage.Crowd.calm(); HUD.clear();
      Juice.reset(); ComicText.clear();
      this.icon = Portraits.fighter(Game.fighterIndex, 60);
      this.truckIcon = Portraits.truck(80, 60);
      Game.fighter = new Fighter(Game.fighterIndex);
      CamRig.speed = 3;
      // retrying skips the cinematic intro
      if (prev === 'results' || Game.skipIntro) { Game.skipIntro = false; this.setPhase('announce'); }
      else {
        this.setPhase('intro');
        Game.fighter.setMode('stand');
        Salesman.react('pitch', 99);
        const pool = [...SALES_PITCH].sort(() => Math.random() - 0.5);
        this.pitch = [pool[0], pool[1], "CAN'T SELL IT... WRECK IT IN 40 SECONDS AND I'LL PAY YOU!"];
        // camera path: close on the salesman, dolly, swoop over the truck, settle on the side view
        this.path = new THREE.CatmullRomCurve3([
          new THREE.Vector3(9.8, 2.3, 5.2), new THREE.Vector3(8.6, 2.0, 7.4), new THREE.Vector3(3.5, 4.4, 11), new THREE.Vector3(-1.2, 2.05, 12.6),
        ]);
      }
    },
    exit() { Combat.hideDebug(); Specials.reset(); HUD.clear(); Juice.reset(); ComicText.clear(); },
    setPhase(p) { this.phase = p; this.phaseT = 0; this.events = new Set(); },
    /** Fire `fn` once when the phase clock passes `t`. */
    at(t, key, fn) { if (this.phaseT >= t && !this.events.has(key)) { this.events.add(key); fn(); } },
    update(dt) {
      const f = Game.fighter;
      this.phaseT += dt;
      if (Input.wasPressed('debug')) Combat.toggleDebug();
      if (this.phase === 'intro') {
        f.update(dt, false);
        const sAnchor = headAnchor(Salesman.rig, 1.0);
        this.pitch.forEach((line, i) => this.at(0.2 + i * 1.55, 'pitch' + i, () => HUD.say('salesman', line, sAnchor, { dur: i === 2 ? 2.0 : 1.45, cps: 40 })));
        if (this.phaseT > this.INTRO || Input.wasPressed('confirm')) this.setPhase('announce');
      } else if (this.phase === 'announce') {
        this.at(0, 'start', () => {
          HUD.hush('salesman');
          Salesman.react('idle', 0);
          f.setMode('idle');
          HUD.banner('SALE 1...', { dur: 1.15, scale: 6, y: 92 });
          Sound.play('announce');
        });
        this.at(1.25, 'haggle', () => { HUD.banner('HAGGLE!', { dur: 0.9, scale: 8, y: 86, color: ['#ffffff', '#ffd23a', '#ff6a2a', '#ff2a4a'] }); Sound.play('haggle'); });
        f.update(dt, false);
        if (this.phaseT > 2.05) this.setPhase('play');
      } else if (this.phase === 'play') {
        if (Game.bot) this.botInput(f);
        // super-move freeze: the clock stops while a special plays out
        if (f.mode !== 'special') this.timer = Math.max(0, this.timer - dt);
        const secs = Math.ceil(this.timer);
        if (secs !== this.lastSec) { if (secs <= 5 && secs > 0) Sound.play('beep'); this.lastSec = secs; }
        f.update(dt, true);
        if (Truck.destroyed) this.finisher();
        else if (this.timer <= 0) this.end(false);
      } else if (this.phase === 'finisher') {
        f.update(dt, false);
        if (this.phaseT > 0.42) { Game.timeScale = 1; this.end(true); }
      } else if (this.phase === 'end') {
        f.update(dt, false);
        this.endSequence();
      }
      Combat.updateDebug(f);
    },
    /** The killing blow: hit-stop, flash, then slow motion from a low dramatic angle. */
    finisher() {
      const f = Game.fighter;
      if (f.mode === 'special') f.endSpecial();
      this.setPhase('finisher');
      this.finX = Truck.root.position.x;
      Game.timeScale = 0.2;
      Juice.hitstop(0.22); Juice.shake(1); Juice.flash(0.85); Juice.zoom(6);

    /** The round is decided: truck wrecked (win) or time up (lose). */
    end(win) {

    },
    endSequence() {
      const def = FIGHTERS[Game.fighterIndex];
      const fAnchor = headAnchor(Game.fighter.rig, 0.95);
      if (this.win) {
        this.at(1.3, 'line', () => HUD.say('fighter', def.win, fAnchor, { dur: 3.4 }));
        for (let i = 0; i < 12; i++) this.at(0.8 + i * 0.1, 'tick' + i, () => Sound.play('tick'));
      } else {
        this.at(1.0, 'cancel', () => {

    },
    finish() {
      const score = Combat.stats.score;
      Game.lastResult = { win: this.win, timeLeft: this.timer, hits: Combat.stats.hits, score, bonus: this.bonus, total: score + this.bonus };
      setState('results');

    /** Debug autoplay: walk into range, alternate punches and kicks. */
    botInput(f) {
      const inRange = Combat.inRange(f, CONFIG.PUNCH.reach - 0.15);
      if (inRange) Input.virtual.delete('right'); else Input.virtual.add('right');
      if (inRange && f.mode === 'idle') Input.press(f.specialCD <= 0 ? 'special' : Math.random() < 0.5 ? 'punch' : 'kick');
    },
    frame() {
      const f = Game.fighter;
      const fx = f ? f.x : 0;
      const tx = Truck.destroyed ? Truck.root.position.x : Truck.frontX();
      const cx = clamp((fx + tx) / 2 + 0.4, -4.5, 3);
      if (this.phase === 'intro') {
        // cinematic swoop along the spline, look-at blending from the salesman to the fight
        const u = ease(clamp(this.phaseT / this.INTRO, 0, 1));
        const p = this.path.getPoint(u);
        const lk = _v2.set(7.2, 1.5, -1.1).lerp(_v3.set(cx, 1.42, 0), ease(clamp((u - 0.35) / 0.65, 0, 1)));
        CamRig.to(p.x, p.y, p.z, lk.x, lk.y, lk.z, true);
      } else if (this.phase === 'finisher') {
        // low, wide, slowly drifting angle on the wreck

      } else if (this.phase === 'end') {

        const k = ease(clamp(this.phaseT / 1.2, 0, 1));
        const ex = this.win ? fx + 2.4 : (fx + Salesman.rig.root.position.x) / 2;
        CamRig.to(lerp(cx, ex, k), lerp(2.05, 2.0, k), lerp(12.6, this.win ? 9.5 : 15.5, k), lerp(cx, ex, k), lerp(1.42, 1.25, k), 0);
      } else {
        CamRig.to(cx, 2.05, 12.6, cx, 1.42, 0);
      }
    },
    hud(ctx) {
      const def = FIGHTERS[Game.fighterIndex];

        HUD.portrait(ctx, this.icon, 10, 9, 30, 30, def.color);
        PixelFont.draw(ctx, '1P', 46, 8, { color: '#ffd23a' });
        PixelFont.draw(ctx, def.name, 62, 8, { color: def.color });
        const sc = Combat.stats.score + (this.phase === 'end' && this.win ? Math.round(this.bonus * clamp((this.phaseT - 0.8) / 1.2, 0, 1)) : 0);
        PixelFont.draw(ctx, String(sc).padStart(7, '0'), 46, 19, { scale: 2, pop: HUD.pop('score', Combat.stats.score, 0.12) });
        const f = Game.fighter, charge = f ? clamp(f.specialCharge, 0, 1) : 0;

        PixelFont.draw(ctx, 'SP', 10, 42, { color: '#ffd23a' });

        if (ready && this.phase === 'play') PixelFont.draw(ctx, 'READY! L', 168, 41, { align: 'right', color: ['#ffffff', '#ffd23a'], pop: HUD.pop('spready', ready, 0.3) });

        HUD.plate(ctx, 214, 3, 52, 38, 'rgba(18,8,36,0.85)', '#000', 'rgba(255,210,58,0.6)');
        const shake = secs <= 5 && this.phase === 'play' ? Math.round(Math.sin(Stage.time * 50)) : 0;
        PixelFont.draw(ctx, String(secs).padStart(2, '0'), 240 + shake, 9, {

        PixelFont.draw(ctx, 'TIME', 240, 44, { align: 'center', color: '#c8b8ff' });

        PixelFont.draw(ctx, 'CYBERCHUNK', 424, 8, { align: 'right', color: '#fff36b' });
        drawBar(ctx, 278, 19, 146, 11, Truck.hp / Truck.maxHP, Truck.hpLag / Truck.maxHP, true);
        PixelFont.draw(ctx, CONDITION[Truck.stage], 470, 42, { align: 'right', color: CONDITION_COL[Truck.stage], outline: 1, pop: HUD.pop('cond', Truck.stage, 0.3) });
        // --- combo counter ---
        const sinceHit = Stage.time - Combat.stats.lastHitT;
        if (Combat.stats.combo >= 2 && sinceHit < 1.1) {
          ctx.globalAlpha = clamp((1.1 - sinceHit) / 0.3, 0, 1);
          PixelFont.draw(ctx, `${Combat.stats.combo} HITS!`, 12, 62, { scale: 2, color: ['#ffffff', '#ffd23a', '#ff6a2a'], pop: HUD.pop('combo', Combat.stats.combo, 0.2) });
          ctx.globalAlpha = 1;
        }
        // --- bottom ---
        PixelFont.draw(ctx, `BEST ${String(Game.best).padStart(7, '0')}`, 474, 260, { align: 'right', color: '#c8b8ff' });
        if (this.phase === 'play' && this.phaseT < 6) PixelFont.draw(ctx, 'J PUNCH   K KICK   L SPECIAL', 240, 258, { align: 'center', color: '#ffffff' });
        // --- time bonus tally ---
        if (this.phase === 'end' && this.win && this.phaseT > 0.6) {
          const k = clamp((this.phaseT - 0.8) / 1.2, 0, 1);
          PixelFont.draw(ctx, `TIME BONUS  ${Math.ceil(this.timer)} X 1000`, 240, 124, { scale: 2, align: 'center', color: '#ffffff' });
          PixelFont.draw(ctx, String(Math.round(this.bonus * k)), 240, 144, { scale: 3, align: 'center', color: ['#ffffff', '#ffd23a'], pop: HUD.pop('bonus', Math.round(k * 10)) });
        }
      } else {
        PixelFont.draw(ctx, 'ENTER TO SKIP', 474, 260, { align: 'right', color: '#c8b8ff' });
      }
      HUD.drawBubbles(ctx);
      HUD.drawBanners(ctx);
    },
  },

  /* ---------- Results: fighter on a rotating pedestal, stats, best score, retry ---------- */
  results: {
    enter() {
      Game.view = 'showroom';
      const r = Game.lastResult || { win: false, score: 0, hits: 0, timeLeft: 0, bonus: 0, total: 0 };
      this.r = r;
      this.newBest = r.total > Game.best;
      Game.best = Math.max(Game.best, r.total);
      this.choice = 0;
      const def = FIGHTERS[Game.fighterIndex];
      this.ped = Showroom.pedestal(1.35, 0, def.color);
      this.model = FighterKit.build(def.id);
      this.model.id = def.id;
      this.model.rig.root.position.set(1.35, Showroom.TOP, 0);
      Showroom.scene.add(this.model.rig.root);
      HUD.clear();
      HUD.say('line', r.win ? def.win : def.lose, () => _v3.set(2.75, 1.78, 0), { dur: 1e9, width: 18 });
    },
    exit() {
      this.model.rig.dispose();
      this.ped.removeFromParent();
      HUD.clear();
    },
    update(dt) {
      // the pedestal turns slowly, showing off the pose
      this.ped.rotation.y = this.model.rig.root.rotation.y = Game.stateTime * 0.6 - 0.4;
      FighterKit.animate(this.model, this.r.win ? 'victory' : 'defeat', Game.stateTime, dt);
      if (Input.wasPressed('up') || Input.wasPressed('down') || Input.wasPressed('left') || Input.wasPressed('right')) { this.choice ^= 1; Sound.play('blip'); }
      if (Game.stateTime > 0.6 && Input.wasPressed('confirm')) { Sound.play('confirm'); setState(this.choice === 0 ? 'fight' : 'select'); }
      if (Input.wasPressed('back')) setState('select');
    },
    frame() { CamRig.to(0.3, 1.75, 7.6, 0.75, 1.15, 0, true); },
    hud(ctx) {
      const r = this.r, t = Game.stateTime;
      const def = FIGHTERS[Game.fighterIndex];
      PixelFont.draw(ctx, r.win ? 'PERFECT!' : 'SALE CANCELLED', 240, 10, {
        scale: r.win ? 6 : 4, align: 'center', outline: 2,
        color: r.win ? ['#fffbe0', '#fff36b', '#ff9a3c', '#ff3c6e'] : ['#ffd0e0', '#ff6a8a', '#c02a5a', '#7a1a4a'],
      });
      HUD.plate(ctx, 10, 58, 222, 168);
      PixelFont.draw(ctx, def.name, 121, 64, { align: 'center', color: def.color });
      const k = (d) => clamp((t - d) / 0.8, 0, 1);
      const row = (label, value, y, d, big) => {
        PixelFont.draw(ctx, label, 18, y, { color: '#c8b8ff' });
        PixelFont.draw(ctx, value(k(d)), 224, y - (big ? 4 : 0), { align: 'right', scale: big ? 2 : 1, color: big ? ['#ffffff', '#ffd23a'] : '#ffffff' });
      };
      row('SCORE', (q) => String(Math.round(r.score * q)), 84, 0.2);
      row('TIME REMAINING', (q) => `${(r.timeLeft * q).toFixed(1)}S`, 98, 0.4);
      row('HITS LANDED', (q) => String(Math.round(r.hits * q)), 112, 0.6);
      row('TIME BONUS', (q) => (r.win ? String(Math.round(r.bonus * q)) : 'NONE'), 126, 0.8);
      ctx.fillStyle = '#5a4a8a'; ctx.fillRect(18, 140, 206, 1);
      row('TOTAL', (q) => String(Math.round(r.total * q)), 150, 1.0, true);
      PixelFont.draw(ctx, 'SESSION BEST', 18, 170, { color: '#c8b8ff' });
      PixelFont.draw(ctx, String(Game.best), 224, 170, { align: 'right', color: '#ffffff' });
      if (this.newBest && t > 1.8 && Math.floor(t * 3) % 2 === 0) PixelFont.draw(ctx, 'NEW RECORD!', 121, 182, { align: 'center', color: ['#ffffff', '#7dff9a'] });
      const opt = (label, i, y) => {
        const on = this.choice === i;
        PixelFont.draw(ctx, (on ? '> ' : '  ') + label, 30, y, { scale: 2, color: on ? ['#ffffff', '#ffd23a'] : '#8a7ab8', pop: on ? 1 + Math.sin(t * 8) * 0.03 : 1 });
      };
      opt('RETRY', 0, 196);
      opt('CHANGE FIGHTER', 1, 211);
      HUD.drawBubbles(ctx);
    },
  },
};

/** Small speaker status in the bottom-left: always when muted, briefly after toggling. */
function drawSoundStatus(ctx, dt) {
  Game.soundToast = Math.max(0, (Game.soundToast || 0) - dt);
  if (!Sound.muted && Game.soundToast <= 0) return;
  const x = 6, y = 258;
  ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y - 1, 10, 9);
  ctx.fillStyle = Sound.muted ? '#ff5a6a' : '#7dff9a';
  ctx.fillRect(x, y + 2, 3, 3); ctx.fillRect(x + 3, y + 1, 1, 5); ctx.fillRect(x + 4, y, 1, 7);   // speaker
  if (Sound.muted) { ctx.fillRect(x + 6, y + 1, 1, 1); ctx.fillRect(x + 7, y + 2, 1, 1); ctx.fillRect(x + 6, y + 3, 1, 1); ctx.fillRect(x + 7, y + 4, 1, 1); ctx.fillRect(x + 6, y + 5, 1, 1); }
  else { ctx.fillRect(x + 6, y + 2, 1, 3); ctx.fillRect(x + 8, y + 1, 1, 5); }
  PixelFont.draw(ctx, Sound.muted ? 'SOUND OFF (M)' : 'SOUND ON (M)', x + 13, y, { color: Sound.muted ? '#ff8a9a' : '#b8ffc8' });
}

function setState(name) {
  const prev = Game.stateName;
  Game.state?.exit?.(name);
  Game.state = States[name];
  Game.stateName = name;
  Game.stateTime = 0;
  Game.state.enter?.(prev);
}

/* ---------- Fixed-timestep loop: simulate at 60 Hz, render once per animation frame ---------- */
const SIM_DT = 1 / CONFIG.SIM_HZ;
let accumulator = 0;
let lastTime = performance.now();
const perf = { fps: 60, frames: 0, acc: 0, cpu: 0 };

function simulate(dt) {
  Game.stateTime += dt;
  if (Input.wasPressed('mute')) { Sound.toggle(); Game.soundToast = 1.5; }
  Stage.update(dt);
  Showroom.update(dt);
  for (const m of Game.lineup || []) FighterKit.animate(m, Game.lineupMode, Stage.time, dt);
  Truck.update(dt);
  FX.update(dt);
  Game.state.update?.(dt);
  Input.endTick(); // edge presses are consumed by exactly one sim tick
}

function frame(now) {
  requestAnimationFrame(frame);
  const cpu0 = performance.now();
  const realDt = Math.min(CONFIG.MAX_FRAME_DT, (now - lastTime) / 1000);
  lastTime = now;
  accumulator += realDt;
  if (!Game.paused) { Juice.update(realDt); ComicText.update(realDt); }
  // hit-stop freezes the simulation for a few frames; the debug pause freezes it entirely
  if (Game.paused || Juice.stop > 0) accumulator = 0;
  while (accumulator >= SIM_DT) {
    simulate(SIM_DT * Game.timeScale);
    accumulator -= SIM_DT;
  }
  if (!Game.paused) HUD.update(realDt);
  Game.state.frame?.(realDt);
  if (Game.camOverride) CamRig.to(...Game.camOverride, true);
  CamRig.update(realDt);
  Stage.frame();
  Shadows.update();

  renderer.info.reset();
  Post.uniforms.uHazeAmt.value = Game.view === 'showroom' || scene.overrideMaterial ? 0 : 0.5;   // no haze in the showroom / metaverse
  renderPipeline(Game.view === 'showroom' ? Showroom.scene : scene, camera);

  hud.setTransform(1, 0, 0, 1, 0, 0);
  hud.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
  hud.setTransform(CONFIG.HUD_SCALE, 0, 0, CONFIG.HUD_SCALE, 0, 0);   // layout stays in 480x270 units
  Game.state.hud?.(hud);
  drawSoundStatus(hud, realDt);

  perf.cpu = lerp(perf.cpu, performance.now() - cpu0, 0.05);   // smoothed CPU ms per frame
  perf.frames++; perf.acc += realDt;
  if (perf.acc >= 0.5) { perf.fps = perf.frames / perf.acc; perf.frames = 0; perf.acc = 0; }
}

/* ---------- Test / debug hook (read-only peeks plus a few levers for the smoke test) ---------- */
window.CS = {
  ready: false,
  get state() { return Game.stateName; },
  info: () => ({
    state: Game.stateName, fps: Math.round(perf.fps), cpuMs: +perf.cpu.toFixed(2), calls: renderer.info.render.calls, tris: renderer.info.render.triangles,
    truckHP: Math.round(Truck.hp), truckStage: Truck.stage,
    fighterX: Game.fighter ? +Game.fighter.x.toFixed(2) : null, fighterMode: Game.fighter?.mode, phase: States.fight.phase,
    modeT: Game.fighter ? +Game.fighter.modeT.toFixed(3) : 0, phaseT: +(States.fight.phaseT ?? 0).toFixed(3),
    timer: +(States.fight.timer ?? 0).toFixed(2), audio: Sound.state, muted: Sound.muted, hits: Combat.stats.hits, score: Combat.stats.score, best: Game.best, fighterIndex: Game.fighterIndex,
    result: Game.lastResult,
  }),
  debug: {
    endFight: () => Game.stateName === 'fight' && States.fight.finish(),
    hitTruck: (dmg = 30, power = 1) => Truck.hit({ dmg, power, y: 1.1 }),
    /** Let the in-page bot play (walks in, alternates punches and kicks). */
    bot: (on = true) => { Game.bot = on; if (!on) Input.virtual.clear(); },
    sfxNames: () => Sound.names(),
    /** Play a sound effect by name and report the peak level shortly after (tests). */
    sfx: (name) => {
      Sound.level(); Sound.play(name);
      let peak = 0, n = 0;
      return new Promise((r) => { const id = setInterval(() => { peak = Math.max(peak, Sound.level()); if (++n >= 20) { clearInterval(id); r(peak); } }, 10); });
    },
    /** While paused, advance the simulation by n fixed ticks (deterministic captures). */
    step: (n = 1) => {
      for (let i = 0; i < n; i++) { simulate(SIM_DT * Game.timeScale); HUD.update(SIM_DT); Juice.update(SIM_DT); ComicText.update(SIM_DT); }
    },
    clearComicText: () => ComicText.clear(),
    /** Freeze / resume the simulation (rendering keeps going). */
    pause: (on = true) => { Game.paused = on; },
    /** Jump straight into a round with fighter i (no intro). */
    quickFight: (i) => { Game.fighterIndex = i; Game.skipIntro = true; setState('fight'); },
    /** Teleport the fighter on the fight plane. */
    placeFighter: (x) => { if (Game.fighter) Game.fighter.x = x; },
    /** Set the clock (e.g. to test the time-out path quickly). */
    setTimer: (t) => { States.fight.timer = t; },
    /** Show every fighter side by side in a pose (for eyeballing the models). */
    lineup(mode = 'stand') {
      for (const m of Game.lineup || []) m.rig.dispose();
      Game.lineup = FIGHTERS.map((d, i) => {
        const m = FighterKit.build(d.id); m.id = d.id;
        m.rig.root.position.set(-5 + i * 1.5, 0, 3); scene.add(m.rig.root);
        return m;
      });
      Game.lineupMode = mode;
    },
    /** Pin the camera: cam(px, py, pz, lx, ly, lz) — call with no args to release. */
    cam: (...a) => { Game.camOverride = a.length ? a : null; },
  },
};

/**
 * Compile every shader variant before play: all six fighters (incl. the glossy jacket),
 * the special-move props, the showroom, and the wireframe "metaverse" override.
 */
function prewarm() {
  const models = FIGHTERS.map((d) => { const m = FighterKit.build(d.id); m.rig.root.position.set(0, -60, 0); scene.add(m.rig.root); return m; });
  Specials.showAll(true);
  renderer.compile(scene, camera);
  renderer.compile(Showroom.scene, camera);
  const tiny = new THREE.WebGLRenderTarget(4, 4);
  renderer.setRenderTarget(tiny);
  renderer.render(scene, camera);
  Specials.wireframe(true); renderer.render(scene, camera); Specials.wireframe(false);
  renderer.setRenderTarget(null);
  tiny.dispose();
  Specials.showAll(false);
  for (const m of models) m.rig.dispose();
}
prewarm();
setState('title');
requestAnimationFrame(frame);
window.CS.ready = true;
</script>
</body>

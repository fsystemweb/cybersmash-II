<meta name="description" content="CYBER SMASH - wreck the Cyberchunk in under 40 seconds. A 3D arcade bonus-stage parody built with three.js.">
<style>
  /* Page: black letterbox around a 16:9 stage. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* HUD is drawn at the low internal resolution and upscaled with hard pixels. */
  #hud { image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
  /* On-screen touch controls (only shown on touch devices). */
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #touch[hidden] { display: none; }
  #touch button {
    position: absolute; pointer-events: auto; touch-action: none;
    width: 11%; aspect-ratio: 1; border: 3px solid #000; border-radius: 18%;
    background: rgba(40, 20, 70, 0.55); color: #fff; font: bold 3.2vmin monospace;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.45); opacity: 0.8;
  }
  #touch button.on { background: rgba(255, 210, 60, 0.75); color: #000; }
  #touch [data-a=left] { left: 2%; bottom: 6%; }
  #touch [data-a=right] { left: 14%; bottom: 6%; }
  #touch [data-a=punch] { right: 26%; bottom: 6%; }
  #touch [data-a=kick] { right: 14%; bottom: 14%; }
  #touch [data-a=special] { right: 2%; bottom: 22%; background: rgba(255, 60, 110, 0.6); }
  #touch [data-a=confirm] { left: 44.5%; bottom: 3%; width: 11%; aspect-ratio: 2.2; font-size: 2.4vmin; }
  #touch [data-a=mute] { right: 2%; top: 30%; width: 7%; font-size: 2vmin; }
</style>

<script type="module">
import * as THREE from 'three';

/* =====================================================================================
 * 1. CONFIG — every tunable lives here.
 * ===================================================================================== */
const CONFIG = {
  ASPECT: 16 / 9,
  LOW_W: 480,              // HUD layout space (the HUD canvas is drawn at 2x this)
  LOW_H: 270,
  RENDER_W: 640,           // internal 3D render resolution (upscaled with hard pixels)
  RENDER_H: 360,
  HUD_SCALE: 2,
  MAX_DPR: 2,
  SIM_HZ: 60,              // fixed simulation rate
  MAX_FRAME_DT: 0.1,       // clamp huge frame gaps (tab switch)
  FIGHT_TIME: 40,          // seconds on the clock
  CAMERA_FOV: 28,
  TRUCK_HP: 800,
  DENT_FROM: 0.85,         // health fraction below which hits dent the body
  // combat (damage in HP; the special is 3x a punch)
  PUNCH: { dmg: 10, power: 1, reach: 0.95, dur: 0.32, hitAt: 0.32 },
  KICK: { dmg: 15, power: 1.5, reach: 1.3, dur: 0.5, hitAt: 0.42 },
  SPECIAL_DMG: 30,
  SPECIAL_COOLDOWN: 3,
  WALK_SPEED: 3.4,
  BODY_R: 0.42,            // fighter half-width on the fight plane
  ARENA_MIN_X: -9,
  FIGHTER_START_X: -4.2,
};

/**
 * The roster: affectionate parody caricatures. `special` names the L move (PR 7),
 * `win` / `lose` are the results-screen lines, `color` tints their UI.
 */
const FIGHTERS = [

  { id: 'zuck', tag: 'HUMAN. DEFINITELY HUMAN. BEEP.', name: 'MARK ZUCKERBOT', color: '#5ad0ff', special: 'METAVERSE TAKEDOWN',
    win: 'ENGAGEMENT: MAXIMIZED.', lose: 'PIVOTING TO... SOMETHING ELSE.' },
  { id: 'hassabyte', tag: 'FOLDED PROTEINS. NOW: TRUCKS.', name: 'DEMIS HASSABYTE', color: '#7ab8ff', special: 'ALPHASTRIKE',
    win: 'AS PREDICTED. FORTY SECONDS AGO.', lose: 'FASCINATING. MORE TRAINING DATA NEEDED.' },
  { id: 'hwatt', tag: 'LEATHER JACKET. ALWAYS. EVEN NOW.', name: 'JENSEN HWATT', color: '#76d43a', special: 'GPU OVERCLOCK',
    win: 'THE MORE YOU SMASH, THE MORE YOU SAVE!', lose: 'SHIPPING NEXT QUARTER. PROBABLY.' },
  { id: 'oldman', tag: 'ASKS NICELY FIRST. THEN BONKS.', name: 'SAM OLDMAN', color: '#ffb84a', special: 'AGI BEAM',
    win: 'FEELS LIKE AGI TO ME.', lose: "WE'RE GONNA NEED MORE COMPUTE." },
];

/* =====================================================================================
 * 2. UTILS — math helpers, input, and the pixel font used by every bit of lettering.
 * ===================================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt)); // frame-rate independent smoothing
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];

/* ---------- Input: held keys + edge-triggered presses consumed once per sim tick ---------- */
const KEYMAP = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
  punch: ['KeyJ'], kick: ['KeyK'], special: ['KeyL'],
  confirm: ['Enter', 'Space', 'NumpadEnter'], back: ['Escape', 'Backspace'],
  mute: ['KeyM'], debug: ['KeyH'],
};
const Input = {
  held: new Set(),      // physical key codes currently down
  pressed: new Set(),   // actions pressed since the last sim tick
  virtual: new Set(),   // actions held by touch buttons
  isDown(action) { return KEYMAP[action].some((k) => this.held.has(k)) || this.virtual.has(action); },
  wasPressed(action) { return this.pressed.has(action); },
  press(action) { this.pressed.add(action); },
  endTick() { this.pressed.clear(); },
};
const CODE_TO_ACTION = {};
for (const [action, codes] of Object.entries(KEYMAP)) for (const c of codes) (CODE_TO_ACTION[c] ||= []).push(action);
addEventListener('keydown', (e) => {
  const actions = CODE_TO_ACTION[e.code];
  if (actions) e.preventDefault();
  Sound.unlock();               // the AudioContext starts on the first user input
  if (e.repeat) return;
  Input.held.add(e.code);
  if (actions) for (const a of actions) Input.press(a);
});
addEventListener('keyup', (e) => Input.held.delete(e.code));

/* ---------- Touch buttons: held actions go in Input.virtual, every tap is also an edge press ---------- */
(() => {
  const pad = document.getElementById('touch');
  const show = () => { pad.hidden = false; };
  if (matchMedia('(pointer: coarse)').matches) show();
  addEventListener('touchstart', show, { once: true, passive: true });
  for (const b of pad.querySelectorAll('button')) {
    const a = b.dataset.a;
    const down = (e) => { e.preventDefault(); Sound.unlock(); Input.virtual.add(a); Input.press(a); b.classList.add('on'); b.setPointerCapture?.(e.pointerId); };
    const up = () => { Input.virtual.delete(a); b.classList.remove('on'); };
    b.addEventListener('pointerdown', down);
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, up);
  }
})();
addEventListener('blur', () => { Input.held.clear(); Input.virtual.clear(); });

/* ---------- Pixel font: original 5x7 glyphs, '#' = ink. Lowercase maps to uppercase. ---------- */
const FONT_SRC = `
A .###. #...# #...# ##### #...# #...# #...#
B ####. #...# #...# ####. #...# #...# ####.

const GLYPHS = {};
for (const line of FONT_SRC.trim().split('\n')) {
  const [ch, ...rows] = line.split(' ');
  GLYPHS[ch] = rows.map((r) => [...r].map((c) => c === '#'));
}
GLYPHS[' '] = Array.from({ length: 7 }, () => Array(5).fill(false));

const PixelFont = {
  cache: new Map(),
  /** Width in pixels of `str` drawn at `scale` (1 px gap between glyphs). */
  measure(str, scale = 1) { return str.length ? str.length * 6 * scale - scale : 0; },
  /**
   * A cached canvas with one glyph. `colors` is an array distributed over the 7 rows
   * (gives the classic two/three-tone arcade lettering). `outline` is a border in pixels.
   */
  glyph(ch, scale, colors, outline, outlineColor) {
    const key = `${ch}|${scale}|${colors.join(',')}|${outline}|${outlineColor}`;
    let c = this.cache.get(key);
    if (c) return c;
    const g = GLYPHS[ch] || GLYPHS[ch.toUpperCase()] || GLYPHS['?'];
    c = document.createElement('canvas');
    c.width = 5 * scale + outline * 2;
    c.height = 7 * scale + outline * 2;
    const x = c.getContext('2d');
    if (outline > 0) {
      x.fillStyle = outlineColor;
      for (let r = 0; r < 7; r++) for (let q = 0; q < 5; q++) if (g[r][q]) x.fillRect(q * scale, r * scale, scale + outline * 2, scale + outline * 2);
    }
    for (let r = 0; r < 7; r++) {
      x.fillStyle = colors[Math.min(colors.length - 1, Math.floor((r * colors.length) / 7))];
      for (let q = 0; q < 5; q++) if (g[r][q]) x.fillRect(outline + q * scale, outline + r * scale, scale, scale);
    }
    this.cache.set(key, c);
    return c;
  },
  /**
   * Draw text. opts: scale, color (string or array of row colours), align ('left'|'center'|'right'),
   * outline (px), outlineColor, pop (extra scale factor for bouncy numbers, drawn around the text centre).
   */
  draw(ctx, str, x, y, opts = {}) {
    str = String(str);
    const scale = opts.scale || 1;
    const colors = Array.isArray(opts.color) ? opts.color : [opts.color || '#fff'];
    const outline = opts.outline ?? Math.max(1, scale >> 1);
    const outlineColor = opts.outlineColor || '#000';
    const w = this.measure(str, scale);
    let x0 = opts.align === 'center' ? x - w / 2 : opts.align === 'right' ? x - w : x;
    const pop = opts.pop || 1;
    ctx.save();
    if (pop !== 1) {
      const cx = x0 + w / 2, cy = y + (7 * scale) / 2;
      ctx.translate(cx, cy); ctx.scale(pop, pop); ctx.translate(-cx, -cy);
    }
    for (const ch of str) {
      if (ch !== ' ') ctx.drawImage(this.glyph(ch.toUpperCase(), scale, colors, outline, outlineColor), Math.round(x0 - outline), Math.round(y - outline));
      x0 += 6 * scale;
    }
    ctx.restore();
    return w;
  },
};

/**
 * Chunky arcade health bar: black frame, red "recent damage" lag, yellow fill, tick marks.
 * `reverse` drains toward the right edge (for a bar on the right side of the screen).
 */
function drawBar(ctx, x, y, w, h, frac, lag, reverse = false, colors = ['#fff47a', '#ffc81e', '#e07a10']) {
  // (the HUD canvas is drawn at 2x, so half-units are crisp single hi-res pixels)
  frac = clamp(frac, 0, 1); lag = clamp(lag, frac, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(x - 1, y + 1, w + 4, h + 3);       // drop shadow
  ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = '#c8b8ff'; ctx.fillRect(x - 1.5, y - 1.5, w + 3, 0.5);               // metal frame bevel
  ctx.fillStyle = '#2a1a3a'; ctx.fillRect(x - 1.5, y + h + 1, w + 3, 0.5);
  const well = ctx.createLinearGradient(0, y, 0, y + h);
  well.addColorStop(0, '#1a0820'); well.addColorStop(1, '#3a1230');
  ctx.fillStyle = well; ctx.fillRect(x, y, w, h);
  const seg = (f0, f1, fill) => {
    const a = w * f0, b = w * f1;
    ctx.fillStyle = fill;
    if (reverse) ctx.fillRect(x + w - b, y, b - a, h); else ctx.fillRect(x + a, y, b - a, h);
  };
  const lagG = ctx.createLinearGradient(0, y, 0, y + h);
  lagG.addColorStop(0, '#ff8a9a'); lagG.addColorStop(0.5, '#ff2a4a'); lagG.addColorStop(1, '#a01030');
  seg(frac, lag, lagG);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, colors[0]); g.addColorStop(0.45, colors[1]); g.addColorStop(1, colors[2]);
  seg(0, frac, g);
  const fw = w * frac;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillRect(reverse ? x + w - fw : x, y + 1, fw, 1);                                // glossy highlight
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(reverse ? x + w - fw : x, y + h - 1, fw, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  for (let i = 1; i < 10; i++) ctx.fillRect(x + (w * i) / 10, y, 0.5, h);             // fine ticks
}

/* ---------- Canvas textures (every texture in the game is drawn at runtime) ---------- */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return [c, ctx];
}
/** Wrap a canvas as a crisp, nearest-filtered sRGB texture. */
function canvasTexture(canvas, repeat = false) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* ---------- Geometry batching: merge many primitives into one vertex-coloured mesh ---------- */
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _col = new THREE.Color();

/**
 * Collects primitives (each with a colour and a transform) and merges them into one
 * non-indexed BufferGeometry with position/normal/uv/color. One draw call for a whole prop.
 * `color` may be a hex number or a function (x, y, z) => hex evaluated per vertex.
 * The batch takes ownership of the geometries passed to add() and disposes them.
 */
class GeoBatch {
  constructor() { this.parts = []; }
  add(geo, color, { p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1] } = {}) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    geo.dispose();
    _m4.compose(_v1.set(p[0], p[1], p[2]), _q.setFromEuler(_e.set(r[0], r[1], r[2])), _v2.set(s[0], s[1], s[2]));
    g.applyMatrix4(_m4);
    const pos = g.attributes.position, n = pos.count;
    const col = new Float32Array(n * 3);
    const fn = typeof color === 'function' ? color : null;
    if (!fn) _col.setHex(color);
    for (let i = 0; i < n; i++) {
      if (fn) _col.setHex(fn(pos.getX(i), pos.getY(i), pos.getZ(i)));
      col[i * 3] = _col.r; col[i * 3 + 1] = _col.g; col[i * 3 + 2] = _col.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    this.parts.push(g);
    return this;
  }
  get empty() { return this.parts.length === 0; }
  build() {
    let total = 0;
    for (const g of this.parts) total += g.attributes.position.count;
    const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), uv = new Float32Array(total * 2), col = new Float32Array(total * 3);
    let o = 0;
    for (const g of this.parts) {
      const n = g.attributes.position.count;
      pos.set(g.attributes.position.array, o * 3);
      nor.set(g.attributes.normal.array, o * 3);
      if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
      col.set(g.attributes.color.array, o * 3);
      o += n;
      g.dispose();
    }
    this.parts = [];
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    out.computeBoundingSphere();
    return out;
  }
}

/* ---------- Materials: 3-band toon shading with a hard stepped rim light, cached for reuse ---------- */
const Mat = (() => {
  const gradient = new THREE.DataTexture(new Uint8Array([52, 140, 255]), 3, 1, THREE.RedFormat);
  gradient.minFilter = gradient.magFilter = THREE.NearestFilter;
  gradient.needsUpdate = true;
  // Shared by every toon material, so the whole scene's rim colour can be changed at once.
  const rimColor = { value: new THREE.Color(0xffc29a) };
  const cache = new Map();

  /** Inject a hard (stepped) fresnel rim into a toon material. */
  function addRim(m, amount) {
    const rimAmt = { value: amount };
    m.userData.rimAmt = rimAmt;
    m.onBeforeCompile = (sh) => {
      sh.uniforms.uRimColor = rimColor;
      sh.uniforms.uRimAmt = rimAmt;
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform vec3 uRimColor;\nuniform float uRimAmt;')
        .replace('#include <opaque_fragment>', `
          { float rim = 1.0 - clamp(dot(normal, normalize(vViewPosition)), 0.0, 1.0);
            outgoingLight += uRimColor * uRimAmt * step(0.68, rim); }
          #include <opaque_fragment>`);
    };
    m.customProgramCacheKey = () => 'rim-toon';
    return m;
  }

  /**
   * Toon material. opts: vertexColors, map, emissive, side, transparent, opacity, rim (0..1),
   * unique (skip the cache — for materials that get animated individually).
   */
  function toon(color = 0xffffff, opts = {}) {
    const key = !opts.unique && `toon|${color}|${opts.vertexColors ? 1 : 0}|${opts.map ? opts.map.uuid : ''}|${opts.emissive ?? ''}|${opts.side ?? ''}|${opts.transparent ? opts.opacity : ''}|${opts.rim ?? ''}`;
    if (key && cache.has(key)) return cache.get(key);
    const m = new THREE.MeshToonMaterial({
      color, gradientMap: gradient, vertexColors: !!opts.vertexColors, map: opts.map || null,
      emissive: opts.emissive ?? 0x000000, side: opts.side ?? THREE.FrontSide,
      transparent: !!opts.transparent, opacity: opts.opacity ?? 1,
    });
    addRim(m, opts.rim ?? 0.35);
    if (key) cache.set(key, m);
    return m;
  }
  /** Unlit material (sky props, glows, UI-ish 3D). */
  function basic(color = 0xffffff, opts = {}) {
    const key = !opts.unique && `basic|${color}|${opts.vertexColors ? 1 : 0}|${opts.map ? opts.map.uuid : ''}|${opts.transparent ? opts.opacity : ''}|${opts.fog ?? 1}|${opts.blending ?? ''}|${opts.side ?? ''}`;
    if (key && cache.has(key)) return cache.get(key);
    const m = new THREE.MeshBasicMaterial({
      color, vertexColors: !!opts.vertexColors, map: opts.map || null, fog: opts.fog ?? true,
      transparent: !!opts.transparent, opacity: opts.opacity ?? 1, side: opts.side ?? THREE.FrontSide,
      blending: opts.blending ?? THREE.NormalBlending, depthWrite: opts.depthWrite ?? !opts.transparent,
    });
    if (key) cache.set(key, m);
    return m;
  }
  return { toon, basic, gradient, rimColor };
})();

/* ---------- Character rig: a chibi skeleton of pivot groups shared by every humanoid ---------- */
// Pose joints (rotations, radians). Geometry hangs "down" (-Y) from each limb pivot.
const POSE_JOINTS = ['body', 'hips', 'torso', 'head', 'shL', 'elL', 'shR', 'elR', 'hipL', 'kneeL', 'hipR', 'kneeR'];
const RIG_DIMS = { hipY: 0.6, torsoH: 0.46, shX: 0.29, shY: 0.4, upperArm: 0.22, foreArm: 0.2, hipX: 0.12, thigh: 0.27, shin: 0.27 };

/**
 * Build an empty rig. The character faces local +Z, its left is local +X.
 * Use rig.add(joint, geo, color, transform, kind) to attach primitives, then rig.finish(materials)
 * to merge each joint's primitives into one mesh per material kind (few draw calls per character).
 */
function createRig(dims = RIG_DIMS) {
  const G = () => new THREE.Group();
  const j = {};
  const root = G();
  j.body = G(); root.add(j.body);
  j.hips = G(); j.hips.position.y = dims.hipY; j.body.add(j.hips);
  j.torso = G(); j.hips.add(j.torso);
  j.head = G(); j.head.position.y = dims.torsoH; j.torso.add(j.head);
  for (const side of ['L', 'R']) {
    const sx = side === 'L' ? 1 : -1;
    j['sh' + side] = G(); j['sh' + side].position.set(sx * dims.shX, dims.shY, 0); j.torso.add(j['sh' + side]);
    j['el' + side] = G(); j['el' + side].position.y = -dims.upperArm; j['sh' + side].add(j['el' + side]);
    j['hand' + side] = G(); j['hand' + side].position.y = -dims.foreArm; j['el' + side].add(j['hand' + side]);
    j['hip' + side] = G(); j['hip' + side].position.x = sx * dims.hipX; j.hips.add(j['hip' + side]);
    j['knee' + side] = G(); j['knee' + side].position.y = -dims.thigh; j['hip' + side].add(j['knee' + side]);
  }
  const batches = new Map(); // `${joint}|${kind}` -> GeoBatch
  const rig = {
    root, j, dims, meshes: [],
    target: Object.fromEntries(POSE_JOINTS.map((k) => [k, [0, 0, 0]])),
    bodyPos: [0, 0, 0],
    /** Attach a primitive to a joint (merged later). kind selects the material. */
    add(joint, geo, color, tf, kind = 'toon') {
      const key = joint + '|' + kind;
      if (!batches.has(key)) batches.set(key, new GeoBatch());
      batches.get(key).add(geo, color, tf);
      return rig;
    },
    /** Create a free-standing sub-pivot (for separately animated bits: eyes, tie, hair...). */
    pivot(name, parent, p = [0, 0, 0]) {
      const g = G(); g.position.set(p[0], p[1], p[2]);
      j[parent].add(g); j[name] = g;
      return g;
    },
    finish(materials) {
      for (const [key, batch] of batches) {
        const [joint, kind] = key.split('|');
        const mesh = new THREE.Mesh(batch.build(), materials[kind] || materials.toon);
        mesh.userData.kind = kind;
        j[joint].add(mesh);
        rig.meshes.push(mesh);
      }
      batches.clear();
      return rig;
    },
    /** Zero the pose target (call at the start of each animation update). */
    reset() {
      for (const k of POSE_JOINTS) { const t = rig.target[k]; t[0] = t[1] = t[2] = 0; }
      rig.bodyPos[0] = rig.bodyPos[1] = rig.bodyPos[2] = 0;
    },
    set(joint, x = 0, y = 0, z = 0) { const t = rig.target[joint]; t[0] = x; t[1] = y; t[2] = z; },
    /** Ease every joint toward the target pose. */
    apply(dt, speed = 14) {
      for (const k of POSE_JOINTS) {
        const r = j[k].rotation, t = rig.target[k];
        r.x = damp(r.x, t[0], speed, dt); r.y = damp(r.y, t[1], speed, dt); r.z = damp(r.z, t[2], speed, dt);
      }
      const p = j.body.position;
      p.x = damp(p.x, rig.bodyPos[0], speed, dt); p.y = damp(p.y, rig.bodyPos[1], speed, dt); p.z = damp(p.z, rig.bodyPos[2], speed, dt);
    },
    dispose() {
      for (const m of rig.meshes) m.geometry.dispose();
      root.removeFromParent();
    },
  };
  return rig;
}

/* =====================================================================================
 * 3. RENDERER — low-res render target, nearest-neighbour upscale pass, camera, lights, resize.
 * ===================================================================================== */
const stageEl = document.getElementById('stage');
const glCanvas = document.getElementById('gl');
const hudCanvas = document.getElementById('hud');
const hud = hudCanvas.getContext('2d');
hud.imageSmoothingEnabled = false;

const scene = new THREE.Scene();               // the harbor
scene.fog = new THREE.Fog(0xe07a86, 70, 420);
const camera = new THREE.PerspectiveCamera(CONFIG.CAMERA_FOV, CONFIG.ASPECT, 0.1, 700);

// Lights: warm sunset key from the front-left, purple sky fill, and a hot back light for rims.
const hemi = new THREE.HemisphereLight(0xffb98a, 0x4a2f6a, 1.0);
const sun = new THREE.DirectionalLight(0xffe0b0, 2.5);

backLight.position.set(3, 5, -12);

/* ---------- Retro pipeline: render at 640x360, ink outlines, upscale with nearest-neighbour ---------- */
// The colour target is sRGB so the 8-bit buffer keeps shadows smooth. A depth texture feeds an
// outline pass: the Laplacian of 1/z is zero on any plane and spikes at silhouettes, so edges are
// found without the floor or walls lighting up. Only the nearer side of an edge is inked (1 px
// lines), and the ink fades with distance so characters and props pop against a softer backdrop.
const lowRT = new THREE.WebGLRenderTarget(CONFIG.RENDER_W, CONFIG.RENDER_H, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, generateMipmaps: false, depthBuffer: true,
});
lowRT.texture.colorSpace = THREE.SRGBColorSpace;
lowRT.depthTexture = new THREE.DepthTexture(CONFIG.RENDER_W, CONFIG.RENDER_H, THREE.UnsignedIntType);

const Post = {
  uniforms: {
    tDiffuse: { value: lowRT.texture },
    tDepth: { value: lowRT.depthTexture },
    uLowRes: { value: new THREE.Vector2(CONFIG.RENDER_W, CONFIG.RENDER_H) },
    uNear: { value: 0.1 }, uFar: { value: 700 },
    uOutline: { value: 0.92 },                    // ink strength (0 disables)
    uHaze: { value: new THREE.Color(0xc86e8c) },  // sunset haze toward the background
    uHazeAmt: { value: 0.5 },
    uHazeNear: { value: 17 }, uHazeFar: { value: 110 },
    uInk: { value: new THREE.Color(0x1a0a26) },
    uLevels: { value: 40 },                       // colour steps per channel
    uFlash: { value: 0 },                         // 0..1 full-screen flash
    uFlashColor: { value: new THREE.Color(1, 1, 1) },
    uVignette: { value: 0.5 },
    uTint: { value: new THREE.Color(1, 1, 1) },   // multiplied in (used for darkening / mood)
  },
};
const blitScene = new THREE.Scene();
const blitCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: Post.uniforms,
  depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    #include <packing>
    uniform sampler2D tDiffuse; uniform sampler2D tDepth; uniform vec2 uLowRes; uniform float uLevels;
    uniform float uNear, uFar, uOutline; uniform vec3 uInk;
    uniform vec3 uHaze; uniform float uHazeAmt, uHazeNear, uHazeFar;
    uniform float uFlash; uniform vec3 uFlashColor; uniform float uVignette; uniform vec3 uTint;
    varying vec2 vUv;
    float bayer2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
    float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    // 1 / view distance: an affine function of screen position on any plane
    float invZ(vec2 uv){ return -1.0 / perspectiveDepthToViewZ(texture2D(tDepth, uv).x, uNear, uFar); }
    void main(){
      vec2 px = floor(vUv * uLowRes);
      vec2 uv = (px + 0.5) / uLowRes;                         // snap to the low-res pixel centre
      vec4 c = linearToOutputTexel(texture2D(tDiffuse, uv));  // to sRGB for the retro maths
      // --- ink outlines ---
      vec2 o = 1.0 / uLowRes;
      float zc = invZ(uv);
      float zl = invZ(uv - vec2(o.x, 0.0)), zr = invZ(uv + vec2(o.x, 0.0));
      float zd = invZ(uv - vec2(0.0, o.y)), zu = invZ(uv + vec2(0.0, o.y));
      float lap = (abs(zl + zr - 2.0 * zc) + abs(zu + zd - 2.0 * zc)) / zc;
      float nearer = step(0.25 * (zl + zr + zu + zd), zc);   // ink only the closer side of an edge
      float edge = smoothstep(0.012, 0.04, lap) * nearer * (1.0 - smoothstep(24.0, 55.0, 1.0 / zc));
      c.rgb = mix(c.rgb, uInk, edge * uOutline);
      // --- aerial perspective: the backdrop melts into the sunset haze (sky is left alone) ---
      float dist = 1.0 / zc;
      float hz = smoothstep(uHazeNear, uHazeFar, dist) * step(dist, 500.0) * uHazeAmt;
      float lum = dot(c.rgb, vec3(0.299, 0.587, 0.114));
      c.rgb = mix(c.rgb, mix(vec3(lum), uHaze, 0.6), hz);
      c.rgb *= uTint;
      c.rgb = mix(c.rgb, uFlashColor, uFlash);
      vec2 d = vUv - 0.5;
      c.rgb *= 1.0 - uVignette * dot(d, d) * 1.6;
      float dith = bayer4(px) - 0.5;
      c.rgb = floor(c.rgb * uLevels + 0.5 + dith * 0.55) / uLevels;
      float row = fract(vUv.y * uLowRes.y);
      c.rgb *= 1.0 - 0.045 * step(0.72, row);                  // faint scanline per low-res row
      gl_FragColor = vec4(c.rgb, 1.0);
    }`,
})));

/** Draw a scene through the low-res pipeline. */
function renderPipeline(sceneToDraw, cam) {
  renderer.setRenderTarget(lowRT);
  renderer.render(sceneToDraw, cam);
  renderer.setRenderTarget(null);
  renderer.render(blitScene, blitCam);
}

/* ---------- Camera rig: eased position / look-at / FOV with shake offsets ---------- */
const CamRig = {
  pos: new THREE.Vector3(0, 3, 17), look: new THREE.Vector3(0, 1.3, 0), fov: CONFIG.CAMERA_FOV,
  tPos: new THREE.Vector3(0, 3, 17), tLook: new THREE.Vector3(0, 1.3, 0), tFov: CONFIG.CAMERA_FOV,
  speed: 4,
  /** Set the target; snap=true jumps there immediately. */
  to(px, py, pz, lx, ly, lz, snap = false, fov = CONFIG.CAMERA_FOV) {
    this.tPos.set(px, py, pz); this.tLook.set(lx, ly, lz); this.tFov = fov;
    if (snap) { this.pos.copy(this.tPos); this.look.copy(this.tLook); this.fov = fov; }
  },
  update(dt) {
    const k = 1 - Math.exp(-this.speed * dt);
    this.pos.lerp(this.tPos, k); this.look.lerp(this.tLook, k);
    this.fov = lerp(this.fov, this.tFov, k);
    // juice: shake offset, a little roll, and the punch-zoom FOV kick
    camera.position.copy(this.pos).add(Juice.offset);
    camera.lookAt(_v1.copy(this.look).addScaledVector(Juice.offset, 0.5));
    camera.rotateZ(Juice.roll);
    const fov = this.fov + Juice.fovKick;
    if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  },
};

/** Fit the stage into the window at 16:9, letterboxing the rest with black. */
function resize() {
  const ww = innerWidth, wh = innerHeight;
  let w = ww, h = Math.round(ww / CONFIG.ASPECT);
  if (h > wh) { h = wh; w = Math.round(wh * CONFIG.ASPECT); }
  stageEl.style.width = w + 'px';
  stageEl.style.height = h + 'px';
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, CONFIG.MAX_DPR));
  renderer.setSize(w, h, false);
}
addEventListener('resize', resize);
resize();

/* =====================================================================================
 * 4. STAGE — the harbor at sunset: sky, sun, water, dock, containers, crane, ships,
 *    crowd, seagulls, blob shadows and the nervous salesman.
 *    Static scenery is merged into a handful of vertex-coloured meshes; anything
 *    repeated (containers, crowd, gulls, sweat, shadows) is an InstancedMesh.
 * ===================================================================================== */
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, seg = 8) => new THREE.CylinderGeometry(rt, rb, h, seg);
const sph = (r, ws = 10, hs = 8) => new THREE.SphereGeometry(r, ws, hs);
const torus = (r, t, rs, ts) => new THREE.TorusGeometry(r, t, rs, ts);
const _dummy = new THREE.Object3D();

/* ---------- Blob shadows: one instanced quad per tracked object (1 draw call total) ---------- */
const Shadows = (() => {
  const [c, x] = makeCanvas(32, 32);
  const g = x.createRadialGradient(16, 16, 2, 16, 16, 16);
  g.addColorStop(0, 'rgba(20,8,30,0.85)'); g.addColorStop(0.6, 'rgba(20,8,30,0.55)'); g.addColorStop(1, 'rgba(20,8,30,0)');
  x.fillStyle = g; x.fillRect(0, 0, 32, 32);
  const mat = Mat.basic(0xffffff, { map: canvasTexture(c), transparent: true, opacity: 0.75 });
  mat.polygonOffset = true; mat.polygonOffsetFactor = -2;
  const MAX = 24;
  const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), mat, MAX);
  mesh.frustumCulled = false;
  mesh.renderOrder = 1;
  mesh.count = 0;
  scene.add(mesh);
  const list = [];
  return {
    /** Follow `obj` with a w x d ellipse. Returns a handle; handle.scale shrinks it (e.g. when airborne). */
    track(obj, w, d) { const h = { obj, w, d, scale: 1, visible: true }; list.push(h); return h; },
    untrack(h) { const i = list.indexOf(h); if (i >= 0) list.splice(i, 1); },
    update() {
      let n = 0;
      for (const h of list) {
        if (!h.visible || !h.obj.parent || n >= MAX) continue;
        h.obj.getWorldPosition(_v1);
        const s = h.scale * clamp(1 - _v1.y * 0.25, 0.35, 1);
        _dummy.position.set(_v1.x, 0.03, _v1.z);
        _dummy.rotation.set(0, h.yaw ? h.yaw() : 0, 0);
        _dummy.scale.set(h.w * s, 1, h.d * s);
        _dummy.updateMatrix();
        mesh.setMatrixAt(n++, _dummy.matrix);
      }
      mesh.count = n;
      mesh.instanceMatrix.needsUpdate = true;
    },
  };
})();

const Stage = (() => {
  const root = new THREE.Group();
  scene.add(root);
  const STAGE_RIM = 0.12; // big flat scenery gets only a whisper of rim light

  /* ---------- Sky dome (follows the camera) ---------- */
  const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 24, 12), new THREE.ShaderMaterial({
    uniforms: {
      cTop: { value: new THREE.Color(0x170c38) }, cMid: { value: new THREE.Color(0x5a2585) },
      cLow: { value: new THREE.Color(0xe94f7c) }, cHor: { value: new THREE.Color(0xffb062) },
    },
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform vec3 cTop, cMid, cLow, cHor; varying vec3 vDir;
      void main(){
        float h = normalize(vDir).y;
        vec3 c = mix(cHor, cLow, smoothstep(0.0, 0.07, h));
        c = mix(c, cMid, smoothstep(0.07, 0.22, h));
        c = mix(c, cTop, smoothstep(0.22, 0.6, h));
        gl_FragColor = vec4(c, 1.0);

    side: THREE.BackSide, depthWrite: false,
  }));

  root.add(sky);

  /* ---------- Retro striped sun sinking into the sea (water occludes its lower half) ---------- */
  const sunUniforms = { uTime: { value: 0 }, cA: { value: new THREE.Color(0xfff27a) }, cB: { value: new THREE.Color(0xff3f86) } };
  const sunDisk = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShaderMaterial({
    uniforms: sunUniforms,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uTime; uniform vec3 cA, cB; varying vec2 vUv;
      void main(){
        vec2 d = vUv - 0.5;
        if (length(d) > 0.5) discard;
        if (vUv.y < 0.55) { float band = fract(vUv.y * 13.0 - uTime * 0.12); if (band < (0.55 - vUv.y) * 1.5) discard; }
        gl_FragColor = vec4(mix(cB, cA, smoothstep(0.15, 0.85, vUv.y)), 1.0);
      }`,
  }));
  sunDisk.position.set(-10, 12, -280);
  root.add(sunDisk);
  const [gc, gx] = makeCanvas(64, 64);

  gx.fillStyle = glowGrad; gx.fillRect(0, 0, 64, 64);
  const sunGlow = new THREE.Mesh(new THREE.PlaneGeometry(200, 200),
    Mat.basic(0xffffff, { map: canvasTexture(gc), transparent: true, fog: false, blending: THREE.AdditiveBlending }));
  sunGlow.position.set(-10, 10, -290);
  root.add(sunGlow);

  /* ---------- Clouds: flat low-poly streaks, unlit ---------- */
  const clouds = new GeoBatch();
  const cloudCols = [0xb04a8c, 0x8a3a8e, 0xe0708e, 0x6c2f7e];
  for (let i = 0; i < 14; i++) {
    const w = rand(30, 90);
    clouds.add(box(w, rand(1.5, 4), 2), cloudCols[i % 4], { p: [rand(-200, 200), rand(16, 70), rand(-275, -240)], r: [0, 0, rand(-0.03, 0.03)] });
  }
  // a few dark streaks crossing the sun

  const cloudMesh = new THREE.Mesh(clouds.build(), Mat.basic(0xffffff, { vertexColors: true, fog: false }));
  root.add(cloudMesh);

  /* ---------- Water: a non-uniform grid animated on the CPU, flat-shaded facets ---------- */
  const W_COLS = 44, W_ROWS = 30;

  const wCol = new Float32Array(wPos.length);

  for (let r = 0, i = 0; r <= W_ROWS; r++) {

    for (let c = 0; c <= W_COLS; c++, i++) {

      wPos[i * 3] = x; wPos[i * 3 + 1] = 0; wPos[i * 3 + 2] = z;
      wBase.push(x, z);
      _col.copy(shallow).lerp(deep, r / W_ROWS);
      const sunCol = Math.exp(-Math.pow((x + 10) / (6 + Math.abs(z) * 0.09), 2)) * (0.45 + 0.55 * Math.random());
      _col.lerp(glint, sunCol * 0.85);
      wCol[i * 3] = _col.r; wCol[i * 3 + 1] = _col.g; wCol[i * 3 + 2] = _col.b;
    }
  }
  const wIdx = [];

    const a = r * (W_COLS + 1) + c, b = a + 1, d = a + W_COLS + 1, e = d + 1;

  water.position.y = -0.7;

  root.add(water);

  /* ---------- Dock floor: concrete slabs drawn on a canvas ---------- */
  const [fc, fx] = makeCanvas(64, 64);
  fx.fillStyle = '#9d8b84'; fx.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 260; i++) { fx.fillStyle = Math.random() < 0.5 ? '#8f7d78' : '#ab9a90'; fx.fillRect((Math.random() * 64) | 0, (Math.random() * 64) | 0, 1, 1); }
  fx.fillStyle = '#6e5c5c'; fx.fillRect(0, 0, 64, 1); fx.fillRect(0, 0, 1, 64); fx.fillRect(0, 32, 64, 1);
  fx.fillStyle = 'rgba(60,40,50,0.25)'; fx.beginPath(); fx.ellipse(44, 46, 9, 5, 0.3, 0, Math.PI * 2); fx.fill();
  const floorTex = canvasTexture(fc, true);
  floorTex.repeat.set(24, 3.5);
  const floor = new THREE.Mesh(box(96, 1.4, 13), Mat.toon(0xffffff, { map: floorTex, rim: 0 }));
  floor.position.set(0, -0.7, 1.5);
  root.add(floor);

  /* ---------- Static props merged into one mesh ---------- */
  const props = new GeoBatch();
  // dock edge timber, painted safety lines
  props.add(box(96, 0.22, 0.35), 0x4a2f2a, { p: [0, 0.08, -4.85] });
  props.add(box(96, 0.02, 0.14), 0xf2c230, { p: [0, 0.01, -4.25] });
  props.add(box(96, 0.02, 0.14), 0xf2c230, { p: [0, 0.01, 6.4] });
  // bollards

    props.add(cyl(0.3, 0.3, 0.1, 8), 0x2d2a38, { p: [x, 0.52, -4.55] });
  }
  // yellow/black jersey barriers in front of the crowd

  const billboard = new THREE.Mesh(new THREE.PlaneGeometry(5.9, 2.33), Mat.basic(0xffffff, { map: canvasTexture(bc) }));

  const board = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.8), Mat.toon(0xffffff, { map: canvasTexture(sc), rim: 0 }));
  board.position.set(9.0, 0.62, -0.7);

  /* ---------- Shipping containers: one InstancedMesh with a corrugated canvas texture ---------- */
  const [cc, cxx] = makeCanvas(64, 32);
  for (let x = 0; x < 64; x++) { cxx.fillStyle = x % 4 < 2 ? '#f2f2f2' : '#b4b4b4'; cxx.fillRect(x, 0, 1, 32); }
  cxx.fillStyle = '#7a7a7a'; cxx.fillRect(0, 0, 64, 2); cxx.fillRect(0, 30, 64, 2); cxx.fillRect(0, 0, 2, 32); cxx.fillRect(62, 0, 2, 32);
  const containerTex = canvasTexture(cc);
  const CONTAINERS = [
    [-11.9, 0, -3.5, 0.04, 0], [-11.6, 1, -3.45, -0.03, 1], [-12.1, 2, -3.55, 0.07, 2],
    [-18.4, 0, -3.2, 0, 3], [-18.2, 1, -3.3, 0.03, 4], [-24, 0, -3.4, 0, 5],
    [-11.2, 0, 1.6, Math.PI / 2 + 0.08, 6],
    [17.5, 0, -3.3, 0, 2], [17.6, 1, -3.3, 0.04, 0], [23.5, 0, -3.1, 0, 4], [16.2, 0, 1.4, Math.PI / 2 - 0.06, 1],
  ];
  const CONTAINER_COLS = [0xd2462f, 0x2f6fd0, 0x2fa05a, 0xe0902b, 0x8a45c0, 0xe8c640, 0x38b0a8];
  const containers = new THREE.InstancedMesh(box(6, 2.6, 2.45), Mat.toon(0xffffff, { map: containerTex, rim: STAGE_RIM }), CONTAINERS.length);
  CONTAINERS.forEach(([x, lvl, z, ry, ci], i) => {

  /* ---------- Cargo ships: hull + bridge + stacked containers, one mesh each ---------- */
  function buildShip(len, hullCol, seed) {
    const b = new GeoBatch();
    const hull = (y0, y1, x0, x1, col) => {
      const s = new THREE.Shape();
      s.moveTo(x0, y0); s.lineTo(len + (y0 - 0) * 1.0, y0); s.lineTo(len + y1 * 1.0, y1); s.lineTo(x1, y1); s.closePath();
      b.add(new THREE.ExtrudeGeometry(s, { depth: 8, bevelEnabled: false }), col, { p: [-len / 2, 0, -4] });
    };
    hull(0, 1.8, 0, -0.4, 0xa3302a);
    hull(1.8, 4.4, -0.4, -1.4, hullCol);
    b.add(box(len + 2, 0.15, 8.1), 0xe8e2dc, { p: [1.5, 4.4, 0] });
    // bridge at the stern
    b.add(box(5, 6.5, 7), 0xf0ece6, { p: [-len / 2 + 2.5, 7.6, 0] });
    b.add(box(5.1, 0.7, 7.1), 0x22263a, { p: [-len / 2 + 2.5, 10, 0] });
    b.add(cyl(0.9, 1.1, 3.2, 8), 0xe0902b, { p: [-len / 2 + 2, 12.4, 0] });
    b.add(cyl(0.95, 0.95, 0.8, 8), 0x22222c, { p: [-len / 2 + 2, 13.8, 0] });
    // deck containers
    let r = seed;
    const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
    for (let x = -len / 2 + 6.5; x < len / 2 - 3; x += 3.2) {
      for (const z of [-2.5, 0, 2.5]) {
        const h = 1 + ((rnd() * 3) | 0);
        for (let k = 0; k < h; k++) b.add(box(3.0, 1.25, 2.35), CONTAINER_COLS[(rnd() * CONTAINER_COLS.length) | 0], { p: [x, 5.1 + k * 1.27, z] });
      }
    }
    const m = new THREE.Mesh(b.build(), Mat.toon(0xffffff, { vertexColors: true, rim: STAGE_RIM }));
    root.add(m);
    return m;
  }
  const shipA = buildShip(46, 0x23335e, 7);
  shipA.position.set(-34, -1.2, -62); shipA.rotation.y = 0.12;
  const shipB = buildShip(38, 0x2f5a3e, 13);
  shipB.position.set(30, -1.2, -120); shipB.rotation.y = -0.05;

  /* ---------- Crowd of dock workers: 4 instanced meshes, bobbing and cheering ---------- */
  const Crowd = (() => {
    const N = 15;
    const workers = [];
    for (let i = 0; i < N; i++) {
      const back = i % 2;
      workers.push({
        x: -8.6 + i * 0.98 + rand(-0.15, 0.15), z: back ? -3.75 : -3.2, ry: rand(-0.25, 0.25),
        ph: rand(0, 6), sp: rand(5, 8), scale: rand(0.9, 1.08), lazy: Math.random() < 0.3,
      });
    }
    const bodyB = new GeoBatch();
    bodyB.add(cyl(0.19, 0.23, 0.55, 7), 0xffffff, { p: [0, 0.83, 0] });
    bodyB.add(box(0.34, 0.56, 0.22), 0x5a5a72, { p: [0, 0.28, 0] });
    bodyB.add(box(0.36, 0.06, 0.24), 0xd8d8d8, { p: [0, 0.75, 0] }); // reflective stripe
    const hatB = new GeoBatch();
    hatB.add(new THREE.SphereGeometry(0.19, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2), 0xffffff, { p: [0, 0.03, 0] });
    hatB.add(cyl(0.24, 0.24, 0.03, 8), 0xffffff, { p: [0, 0.03, 0.02] });
    const armGeo = box(0.08, 0.38, 0.08).translate(0, -0.19, 0);
    const mk = (geo, mat, count) => { const m = new THREE.InstancedMesh(geo, mat, count); m.frustumCulled = false; root.add(m); return m; };
    const vmat = Mat.toon(0xffffff, { vertexColors: true });
    const bodies = mk(bodyB.build(), vmat, N);
    const heads = mk(sph(0.17, 8, 6), Mat.toon(0xffffff), N);
    const hats = mk(hatB.build(), vmat, N);
    const arms = mk(armGeo, Mat.toon(0xffffff), N * 2);
    const VESTS = [0xb8723a, 0xb09a48, 0xa8683a, 0x7a9050, 0xa89040];
    const SKINS = [0xb89078, 0xa07860, 0x7a5644, 0x5a3e30, 0xc0a090];
    const HATS = [0xc0a040, 0xc8c0c0, 0xc07038, 0x4a68a0];
    workers.forEach((w, i) => {
      bodies.setColorAt(i, _col.setHex(VESTS[i % VESTS.length]));
      heads.setColorAt(i, _col.setHex(SKINS[(i * 3) % SKINS.length]));
      hats.setColorAt(i, _col.setHex(HATS[(i * 7) % HATS.length]));
      arms.setColorAt(i * 2, _col.setHex(VESTS[i % VESTS.length]));
      arms.setColorAt(i * 2 + 1, _col.setHex(VESTS[i % VESTS.length]));
    });
    let excitement = 0;
    const put = (mesh, i, x, y, z, rx, ry, rz, s) => {
      _dummy.position.set(x, y, z); _dummy.rotation.set(rx, ry, rz); _dummy.scale.setScalar(s);
      _dummy.updateMatrix(); mesh.setMatrixAt(i, _dummy.matrix);
    };
    return {
      /** Raise the crowd's excitement (0..1); it decays over time. */
      excite(a) { excitement = clamp(excitement + a, 0, 1); },
      calm() { excitement = 0; },
      update(t, dt) {
        excitement = Math.max(0, excitement - dt * 0.35);
        workers.forEach((w, i) => {
          const e = w.lazy ? excitement * 0.5 : excitement;
          const hop = Math.abs(Math.sin(t * w.sp + w.ph)) * (0.03 + e * 0.28);
          const sway = Math.sin(t * 1.3 + w.ph) * 0.06;
          const s = w.scale, y = hop;
          put(bodies, i, w.x, y, w.z, 0, w.ry, sway, s);
          put(heads, i, w.x + sway * -0.6, y + 1.28 * s, w.z, 0, 0, 0, s);
          put(hats, i, w.x + sway * -0.6, y + 1.36 * s, w.z, 0, w.ry, sway, s);
          const raise = e > 0.25 ? lerp(0.4, 2.9, Math.min(1, (e - 0.25) * 3)) + Math.sin(t * 12 + w.ph) * 0.25 : 0.15 + Math.sin(t * 2 + w.ph) * 0.05;
          put(arms, i * 2, w.x + 0.24 * s, y + 1.05 * s, w.z, 0, w.ry, raise, s);
          put(arms, i * 2 + 1, w.x - 0.24 * s, y + 1.05 * s, w.z, 0, w.ry, -raise, s);
        });
        for (const m of [bodies, heads, hats, arms]) m.instanceMatrix.needsUpdate = true;
      },
    };
  })();

  const Gulls = (() => {

        });
        body.instanceMatrix.needsUpdate = wingL.instanceMatrix.needsUpdate = wingR.instanceMatrix.needsUpdate = true;
      },
    };
  })();

  let time = 0;
  return {
    root, sky, Crowd, salesman: null,
    /** Hide the backdrop (sky, sun, clouds, sea) for the wireframe "metaverse" look. */
    setVoid(on) {
      for (const o of [sky, sunDisk, sunGlow, cloudMesh, water]) o.visible = !on;
      scene.background = on ? new THREE.Color(0x0a0426) : null;
    },
    get time() { return time; },
    /** Animate everything ambient. dt is game time (slows with slow-mo). */
    update(dt) {
      time += dt;
      // waves

      for (let i = 0, k = 0; k < wBase.length; i += 3, k += 2) {
        const x = wBase[k], z = wBase[k + 1];

      }
      waterGeo.attributes.position.needsUpdate = true;
      // ships bob and drift
      shipA.position.y = -1.2 + Math.sin(time * 0.6) * 0.15; shipA.rotation.z = Math.sin(time * 0.5) * 0.01;
      shipB.position.x += dt * 0.6; if (shipB.position.x > 150) shipB.position.x = -150;
      shipB.position.y = -1.2 + Math.sin(time * 0.5 + 1) * 0.15;
      sunUniforms.uTime.value = time;
      Crowd.update(time, dt);
      Gulls.update(time);
      Stage.salesman?.update(dt);
    },
    /** Keep the sky dome centred on the camera. */
    frame() { sky.position.copy(camera.position); },
  };
})();

/* =====================================================================================
 * 5. TRUCK — the CYBERCHUNK. Angular body made of subdivided quad panels so hits can
 *    dent them; four damage stages: cracked glass → dents → panels fly off → collapse
 *    into a pile with a smoking battery. Rocks on its suspension and slides on hits.

const Truck = (() => {
  // Profile (truck-local, nose at -X): a flat nose rising in one straight line to the apex,
  // then one straight line down to the tail. Belt line at 1.45, side glass above it.
  const L = 2.7, H = 1.1, BOT = 0.62, NOSE_Y = 1.05, APEX = 2.05, TAIL_Y = 1.45, BELT = 1.45, INSET = 0.22;
  const START_X = 2.1, MAX_X = 3.9, YAW = 0.22;
  const MAX_HP = CONFIG.TRUCK_HP;

  const sideZ = (y) => H - INSET * clamp((y - BELT) / (APEX - BELT), 0, 1);

  /* ---------- runtime textures for the "armored" glass ---------- */
  function glassTexture(cracked) {
    const [c, x] = makeCanvas(64, 48);
    const g = x.createLinearGradient(0, 0, 0, 48);
    g.addColorStop(0, '#3a4a6c'); g.addColorStop(1, '#0c1020');
    x.fillStyle = g; x.fillRect(0, 0, 64, 48);
    x.fillStyle = 'rgba(255,255,255,0.18)';
    for (let i = 0; i < 48; i++) { x.fillRect(10 + i * 0.6, 47 - i, 5, 1); x.fillRect(30 + i * 0.6, 47 - i, 2, 1); }
    if (cracked) {
      // two spiderweb impacts drawn pixel by pixel (no anti-aliasing)
      const plot = (px, py, col) => { x.fillStyle = col; x.fillRect(px | 0, py | 0, 1, 1); };
      for (const [cx, cy] of [[20, 22], [46, 30]]) {
        const spokes = 9;
        for (let s = 0; s < spokes; s++) {
          let a = (s / spokes) * Math.PI * 2 + rand(-0.2, 0.2), px = cx, py = cy;
          for (let k = 0; k < 40; k++) { a += rand(-0.25, 0.25); px += Math.cos(a); py += Math.sin(a); plot(px, py, k < 6 ? '#ffffff' : '#cfe8ff'); }
        }
        for (const r of [5, 10, 16]) for (let a = 0; a < Math.PI * 2; a += 0.08) if (Math.random() < 0.7) plot(cx + Math.cos(a) * r * rand(0.9, 1.1), cy + Math.sin(a) * r * rand(0.9, 1.1), '#bcd8f0');
        x.fillStyle = '#ffffff'; x.fillRect(cx - 2, cy - 2, 4, 4);
      }
    }
    return canvasTexture(c);
  }
  const glassClean = glassTexture(false), glassCracked = glassTexture(true);

  /* ---------- materials (unique: they flash and swap maps) ---------- */
  const steel = Mat.toon(0x9ea7b6, { vertexColors: true, unique: true, rim: 0.3, side: THREE.DoubleSide });
  const glass = Mat.toon(0xffffff, { vertexColors: true, unique: true, rim: 0.7, side: THREE.DoubleSide, map: glassClean });
  const darkMat = Mat.toon(0xffffff, { vertexColors: true, unique: true, rim: 0.3 });
  const lightsMat = Mat.basic(0xffffff, { vertexColors: true, unique: true });

  function quadGeo(c00, c10, c11, c01, su, sv) {

      const u = i / su, v = j / sv;
      _v1.copy(c00).lerp(c10, u); _v2.copy(c01).lerp(c11, u); _v1.lerp(_v2, v);
      pos.push(_v1.x, _v1.y, _v1.z); uv.push(u, v);

  /** Build a complete (posable) model for a fighter id. */
  function build(id) {
    const rig = createRig();
    const extras = BUILDERS[id](rig);
    rig.finish(mats);
    for (const k of ['gun', 'glowL', 'glowR']) if (rig.j[k]) rig.j[k].visible = false;
    return { rig, extras };
  }

  /* ---------- procedural poses (write into rig.target; the rig eases toward them) ---------- */
  const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
  const ease = (x) => x * x * (3 - 2 * x);
  const blend = (rig, joint, x, y, z, k) => { const t = rig.target[joint]; t[0] = lerp(t[0], x, k); t[1] = lerp(t[1], y, k); t[2] = lerp(t[2], z, k); };

  /** Bouncy fighting stance (orthodox: left side forward, fists up). */
  function guard(rig, t) {
    const b = Math.sin(t * 5.5);
    rig.bodyPos[1] = -0.05 + b * 0.018;
    rig.set('torso', 0.05, -0.25, 0);
    rig.set('head', 0, 0.22, 0);
    rig.set('hipL', -0.35, 0, 0.05); rig.set('kneeL', 0.45 + b * 0.04);
    rig.set('hipR', 0.25, 0, -0.05); rig.set('kneeR', 0.4 + b * 0.04);
    rig.set('shL', -0.95, 0, -0.15); rig.set('elL', -1.85);
    rig.set('shR', -0.7, 0, 0.2); rig.set('elR', -2.05);
  }
  /** Relaxed standing pose (select screen, intro). */
  function stand(rig, t) {
    const b = Math.sin(t * 2);
    rig.bodyPos[1] = b * 0.01;
    rig.set('shL', 0.05, 0, 0.12 + b * 0.02); rig.set('elL', -0.2);
    rig.set('shR', 0.05, 0, -0.12 - b * 0.02); rig.set('elR', -0.2);
    rig.set('head', b * 0.03, 0, 0);
    rig.set('kneeL', 0.05); rig.set('kneeR', 0.05);
  }
  /** Leg cycle layered over the current pose. amt 0..1. */
  function walk(rig, ph, amt) {
    const s = Math.sin(ph), c = Math.cos(ph);
    blend(rig, 'hipL', s * 0.6 - 0.1, 0, 0.03, amt); blend(rig, 'kneeL', Math.max(0, -s) * 0.9 + 0.15, 0, 0, amt);
    blend(rig, 'hipR', -s * 0.6 - 0.1, 0, -0.03, amt); blend(rig, 'kneeR', Math.max(0, s) * 0.9 + 0.15, 0, 0, amt);
    rig.bodyPos[1] += Math.abs(c) * 0.05 * amt;
    rig.target.torso[2] += s * 0.05 * amt;
  }
  /** Straight punch. p = progress 0..1, side 'R' (near arm, cross) or 'L' (lead jab). */
  function punch(rig, p, side) {
    const ext = ease(seg(p, 0.1, 0.3)) * (1 - ease(seg(p, 0.55, 1)));
    const wind = seg(p, 0, 0.1) * (1 - seg(p, 0.1, 0.3));
    if (side === 'R') {
      blend(rig, 'shR', -1.62, 0, -0.12, ext); blend(rig, 'elR', -0.05, 0, 0, ext);
      rig.target.shR[0] += wind * 0.4;
      rig.target.torso[1] = lerp(-0.25, 0.45, ext);
    } else {
      blend(rig, 'shL', -1.62, 0, 0.12, ext); blend(rig, 'elL', -0.05, 0, 0, ext);
      rig.target.shL[0] += wind * 0.4;
      rig.target.torso[1] = lerp(-0.25, -0.7, ext);
    }
    rig.target.body[0] = 0.12 * ext;
    rig.bodyPos[2] = 0.14 * ext;
  }
  /** Chambered front kick with the near (right) leg. */
  function kick(rig, p) {
    const ch = ease(seg(p, 0, 0.28)) * (1 - ease(seg(p, 0.7, 1)));
    const ext = ease(seg(p, 0.26, 0.42)) * (1 - ease(seg(p, 0.6, 0.85)));
    blend(rig, 'hipR', -1.2, 0, 0, ch); blend(rig, 'kneeR', 1.8, 0, 0, ch);
    blend(rig, 'hipR', -1.65, 0, 0, ext); blend(rig, 'kneeR', 0.05, 0, 0, ext);
    blend(rig, 'hipL', 0.1, 0, 0.05, ch); blend(rig, 'kneeL', 0.3, 0, 0, ch);
    blend(rig, 'torso', -0.25, -0.55, 0, ch);
    blend(rig, 'shL', -0.6, 0, 0.9, ch); blend(rig, 'shR', -0.4, 0, -0.9, ch);
    rig.bodyPos[1] += 0.06 * ch;
    rig.bodyPos[2] = 0.1 * ext;
  }
  /** Per-character victory poses. */
  function victory(rig, t, id) {
    const b = Math.sin(t * 4);
    switch (id) {
      case 'tromp': // double thumbs-up, smug sway
        rig.set('shL', -1.35, 0, 0.35); rig.set('elL', -0.7); rig.set('shR', -1.35, 0, -0.35); rig.set('elR', -0.7);
        rig.set('body', 0, 0, Math.sin(t * 2) * 0.06); rig.set('head', -0.15, 0, Math.sin(t * 2) * 0.1);
        break;
      case 'muskrat': // awkward little dance
        rig.bodyPos[1] = Math.abs(b) * 0.08;
        rig.set('shL', -0.4, 0, 0.6 + b * 0.5); rig.set('elL', -1.4); rig.set('shR', -0.4, 0, -0.6 + b * 0.5); rig.set('elR', -1.4);
        rig.set('hips', 0, b * 0.3, 0); rig.set('head', 0, -b * 0.25, b * 0.1);
        rig.set('kneeL', 0.3 + Math.max(0, b) * 0.4); rig.set('kneeR', 0.3 + Math.max(0, -b) * 0.4);
        break;
      case 'zuck': { // stiff robotic wave
        const w = Math.round(Math.sin(t * 6)) * 0.4;
        rig.set('shR', 0, 0, -2.6); rig.set('elR', 0, 0, w); rig.set('shL', 0, 0, 0.1);
        rig.set('head', 0, Math.round(Math.sin(t * 1.5)) * 0.2, 0);
        break;
      }
      case 'hassabyte': // calm "eureka" finger
        rig.set('shR', -2.4, 0, 0.1); rig.set('elR', -0.6); rig.set('shL', -0.5, 0, -0.5); rig.set('elL', -1.7);
        rig.set('head', -0.1, 0, 0.1 + b * 0.03);
        break;
      case 'hwatt': // holds the chip over his head
        rig.bodyPos[1] = Math.abs(b) * 0.05;
        rig.set('shR', -2.9, 0, 0.15); rig.set('elR', -0.3); rig.set('shL', -2.9, 0, -0.15); rig.set('elL', -0.3);
        rig.set('head', -0.3, 0, 0);
        break;
      default: // oldman: small humble wave
        rig.set('shR', -0.3, 0, -2.3); rig.set('elR', 0, 0, b * 0.5); rig.set('shL', -0.8, 0, -0.4); rig.set('elL', -1.2);
        rig.set('head', 0, 0, b * 0.05);
    }
  }
  /** Per-character defeat poses. */
  function defeat(rig, t, id) {
    const b = Math.sin(t * 3);
    switch (id) {
      case 'tromp': // arms crossed, pouting, head turned away
        rig.set('shL', -0.55, 0, -0.55); rig.set('elL', -2.0); rig.set('shR', -0.6, 0, 0.55); rig.set('elR', -2.0);
        rig.set('head', -0.15, 0.6, 0); rig.set('body', -0.05, 0, 0);
        break;
      case 'muskrat': // facepalm
        rig.set('shR', -2.0, 0, 0.55); rig.set('elR', -2.3); rig.set('head', 0.35, 0, 0);
        rig.set('shL', 0.1, 0, 0.2); rig.set('body', 0.1, 0, 0);
        break;
      case 'zuck': // buffering: sits down, stiff
        rig.bodyPos[1] = -0.36; rig.set('hipL', -1.5); rig.set('kneeL', 1.5); rig.set('hipR', -1.5); rig.set('kneeR', 1.5);
        rig.set('shL', -1.5); rig.set('shR', -1.5); rig.set('head', Math.round(b) * 0.15, 0, 0);
        break;
      case 'hassabyte': // chin-stroking contemplation
        rig.set('shR', -1.1, 0, 0.45); rig.set('elR', -2.4); rig.set('shL', -0.7, 0, -0.5); rig.set('elL', -1.6);
        rig.set('head', 0.1, 0, 0.15 + b * 0.05);
        break;
      case 'hwatt': // shrug
        rig.set('shL', -0.3, 0, 0.9); rig.set('elL', -1.6); rig.set('shR', -0.3, 0, -0.9); rig.set('elR', -1.6);
        rig.set('head', 0, 0, 0.2); rig.bodyPos[1] = Math.abs(b) * 0.02;
        break;
      default: // oldman: hands on head
        rig.set('shL', -0.8, 0, 2.0); rig.set('elL', -2.2); rig.set('shR', -0.8, 0, -2.0); rig.set('elR', -2.2);
        rig.set('head', 0.2, 0, b * 0.05);
    }
  }

  /**
   * Animate a model for a non-gameplay mode ('stand' | 'victory' | 'defeat' | 'guard').
   * Shared by the select screen, VS, intro and results.
   */
  function animate(model, mode, t, dt, f = { t, vx: 0, mode, rig: model.rig }) {
    const rig = model.rig;
    rig.reset();
    if (mode === 'victory') victory(rig, t, model.id);
    else if (mode === 'defeat') defeat(rig, t, model.id);
    else if (mode === 'guard') guard(rig, t);
    else stand(rig, t);
    finishPose(model, t, dt, f);
  }
  /** Apply the pose plus face (blink, expression) and secondary motion. */
  function finishPose(model, t, dt, f) {
    const { rig, extras } = model;
    rig.apply(dt, 16);
    model.blinkT = (model.blinkT ?? rand(1, 3)) - dt;
    if (model.blinkT < -0.1) model.blinkT = rand(1.5, 4);
    f.blinkOverride = null;
    extras.update?.(dt, f);
    let eye = model.blinkT < 0 ? 0.1 : extras.eyeOpen ?? 1;
    if (f.blinkOverride != null) eye = f.blinkOverride;
    if (f.mode === 'defeat') eye = Math.min(eye, 0.45);
    rig.j.eyes.scale.y = eye;
    const happy = f.mode === 'victory';
    rig.j.mouth.scale.set(happy ? 1.4 : f.mode === 'defeat' ? 0.8 : 1, happy ? 1.8 : f.mode === 'defeat' ? 1.4 : 1, 1);
    rig.j.mouth.rotation.z = extras.mouthTilt ?? 0;
    rig.j.brows.position.y = 0.48 + (f.mode === 'defeat' ? 0.03 : f.attacking ? -0.025 : 0);
  }

  return { build, animate, finishPose, guard, walk, punch, kick, victory, defeat, stand, mats };
})();

/* ---------- Special moves (L): one timeline per character, 3x punch damage ---------- */
const Specials = (() => {
  const DMG = CONFIG.SPECIAL_DMG;
  const glowTex = (() => {
    const [c, x] = makeCanvas(32, 32);

  /* --- Tromp: the giant rubber stamp + the FIRED decals it leaves --- */
  const stamp = new THREE.Group();

    sb.add(sph(0.42, 10, 8), 0x5a2a1a, { p: [0, 2.1, 0], s: [1, 0.75, 1] });     // knob
    sb.add(box(1.0, 0.25, 0.7), 0xc8a060, { p: [0, 0.48, 0] });                  // collar
    sb.add(box(2.4, 0.35, 1.5), 0x8a5a3a, { p: [0, 0.22, 0] });                  // wooden block
    sb.add(box(2.3, 0.08, 1.4), 0xd8202a, { p: [0, 0.0, 0] });                   // red rubber
    stamp.add(new THREE.Mesh(sb.build(), Mat.toon(0xffffff, { vertexColors: true, rim: 0.5 })));
    const label = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 0.33), Mat.basic(0xffffff, { map: stampText(96, 14, "YOU'RE FIRED", 1, '#ffe8c0', '#8a5a3a') }));
    label.position.set(0, 0.22, 0.752);

    stamp.visible = false;

  const decalTex = (() => {

    PixelFont.draw(x, 'FIRED!', 36, 8, { scale: 2, align: 'center', color: '#d8202a', outline: 0 });
    // ink speckle: knock random holes out for a rubber-stamp look
    x.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 90; i++) x.fillRect((Math.random() * 72) | 0, (Math.random() * 30) | 0, 1, 1);
    return canvasTexture(c);
  })();
  const decalMat = Mat.basic(0xffffff, { map: decalTex, transparent: true, opacity: 0.92, depthWrite: false });
  decalMat.polygonOffset = true; decalMat.polygonOffsetFactor = -4;
  const decals = Array.from({ length: 4 }, () => new THREE.Mesh(new THREE.PlaneGeometry(1.25, 0.52), decalMat));
  let decalNext = 0;

  /* --- Oldman: a giant 3D chat bubble that types, then a laser --- */
  const chat = new THREE.Group();
  const chatCanvas = makeCanvas(128, 48);
  const chatTex = canvasTexture(chatCanvas[0]);
  {
    const sh = new THREE.Shape();
    const w = 2.4, h = 1.0, r = 0.28;
    sh.moveTo(-w / 2 + r, -h / 2); sh.lineTo(-0.3, -h / 2); sh.lineTo(-0.75, -h / 2 - 0.45); sh.lineTo(-0.6, -h / 2);
    sh.lineTo(w / 2 - r, -h / 2); sh.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
    sh.lineTo(w / 2, h / 2 - r); sh.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
    sh.lineTo(-w / 2 + r, h / 2); sh.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
    sh.lineTo(-w / 2, -h / 2 + r); sh.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
    const g = new THREE.ExtrudeGeometry(sh, { depth: 0.22, bevelEnabled: true, bevelSize: 0.04, bevelThickness: 0.04, bevelSegments: 1, curveSegments: 4 });
    chat.add(new THREE.Mesh(g, Mat.toon(0xf4f8ff, { rim: 0.6 })));
    const face = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.82), Mat.basic(0xffffff, { map: chatTex }));
    face.position.z = 0.27;
    chat.add(face);
    chat.visible = false;
    scene.add(chat);
  }
  let chatText = null;
  const drawChat = (text, cursor) => {
    if (chatText === text + cursor) return;
    chatText = text + cursor;
    const [c, x] = chatCanvas;
    x.fillStyle = '#f4f8ff'; x.fillRect(0, 0, c.width, c.height);
    PixelFont.draw(x, text + (cursor ? '_' : ' '), 64, 13, { scale: 3, align: 'center', color: ['#3a2a8a', '#1a1040'], outline: 0 });
    chatTex.needsUpdate = true;
  };
  const beam = new THREE.Group();
  beam.add(new THREE.Mesh(cyl(0.09, 0.09, 1, 8).rotateZ(Math.PI / 2).translate(0.5, 0, 0), Mat.basic(0xffffff, { fog: false })));
  beam.add(new THREE.Mesh(cyl(0.24, 0.24, 1, 8).rotateZ(Math.PI / 2).translate(0.5, 0, 0),
    Mat.basic(0x5ad8ff, { transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, fog: false })));
  beam.visible = false;
  scene.add(beam);

  /* --- Zuckerbot: the metaverse look (whole-scene material override) --- */
  const wire = new THREE.MeshBasicMaterial({ color: 0x58e8ff, wireframe: true, fog: false });
  let metaverse = false;
  const setMetaverse = (on) => {
    metaverse = on;
    scene.overrideMaterial = on ? wire : null;
    Stage.setVoid(on);
    Post.uniforms.uTint.value.set(on ? 0.75 : 1, on ? 0.85 : 1, on ? 1.2 : 1);
  };

  /* --- helpers --- */
  /** Dash the fighter toward the truck (stopping at its nose). */
  const dash = (f, speed, dt) => { f.x += speed * dt; f.vx = 0; };
  const hit = (f, dmg, power, reach) => Combat.strike(f, 'special', { dmg, power, reach, y: 1.2 });
  const say = (f, text, dur = 1.2) => HUD.say('fighter', text, () => f.rig.j.head.getWorldPosition(_v3).add(_v1.set(0, 0.95, 0)), { dur, cps: 50 });
  const glowSprites = new WeakMap();

  const DEFS = {
    /* DONALD TROMP — "YOU'RE FIRED!": a giant rubber stamp drops on the truck */
    tromp: {
      dur: 1.6,
      start(f) {
        say(f, "YOU'RE FIRED!");
        const sp = f.sp;
        sp.x = Truck.frontX() + 1.6; sp.y = 7; sp.vy = 0; sp.slammed = false;
        stamp.visible = true; stamp.rotation.set(0, 0.15, 0);
        stamp.position.set(sp.x, sp.y, 0.35);
      },
      update(f, t, dt) {
        const sp = f.sp;
        if (!sp.slammed) {
          if (t > 0.3) { sp.vy -= 45 * dt; sp.y += sp.vy * dt; }
          const top = 1.95;
          if (sp.y <= top) {
            sp.y = top; sp.slammed = true;
            Sound.play('stamp');
            hit(f, DMG, 3, 99);
            this.decal();
            _v3.set(sp.x, 0.3, 0.6);
            FX.burst('puff', _v3, 10, { scale: 1.5 });
          }
        } else if (t > 0.95) { sp.y += (t - 0.95) * 30 * dt; }
        stamp.position.set(sp.x, sp.y, 0.35);
        if (t > 1.5) stamp.visible = false;
      },
      decal() {
        // stamp the nearest still-attached big panel on the camera side
        const cand = Truck.panels.filter((p) => !p.loose && p.side > 0 && /door|bed|fender/.test(p.name));
        if (!cand.length) return;
        const p = cand.find((q) => q.name.startsWith('doorF')) || cand[0];
        const d = decals[decalNext++ % decals.length];
        p.mesh.add(d);
        d.position.set(rand(-0.15, 0.15), rand(-0.08, 0.08), 0.03);
        d.rotation.set(0, 0, rand(-0.3, 0.3));
        d.visible = true;
      },
      pose(rig, t) {
        // points at the truck with his other hand on the hip
        rig.set('shR', -1.55, 0, -0.1); rig.set('elR', -0.1); rig.set('torso', 0, 0.35, 0);
        rig.set('shL', -0.2, 0, 0.5); rig.set('elL', -1.2);
        rig.set('head', -0.1, -0.2, Math.sin(t * 12) * 0.05);
      },
      end() { stamp.visible = false; },
    },

    /* ELON MUSKRAT — "Not-A-Flamethrower": scorches his own product, then apologises */
    muskrat: {
      dur: 2.0,
      start(f) { f.sp.tick = 0; f.sp.dealt = 0; f.rig.j.gun.visible = true; },
      update(f, t, dt) {
        const sp = f.sp;
        if (t > 0.25 && t < 1.25) {
          f.rig.j.gun.localToWorld(_v3.set(0, 0, 0.62));
          for (let i = 0; i < 3; i++) FX.burst('flame', _v3, 1, { dir: _v1.set(rand(5, 7.5), rand(-0.6, 0.8), rand(-0.6, 0.6)) });
          if (t >= 0.3 + sp.tick * 0.16 && sp.tick < 6) {
            sp.tick++;
            if (Combat.inRange(f, 3.6)) {
              Truck.scorch(0.22);
              sp.dealt += hit(f, DMG / 6, 0.6, 3.6);

              FX.burst('smoke', _v3, 1, { scale: 0.7 });
            }
          }
        }
        if (t >= 1.25 && !sp.sorry) {

          f.rig.j.gun.visible = false;

          say(f, pick(['OOPS. SORRY, INVESTORS!', 'WAIT... THAT WAS MY TRUCK.', 'NOT A FLAMETHROWER! LEGALLY.', 'SORRY! RECALL INCOMING!']), 1.4);
        }
      },
      pose(rig, t, f) {
        if (t < 1.25) {
          rig.set('shL', -1.25, 0, -0.35); rig.set('elL', -0.4); rig.set('shR', -1.0, 0, 0.2); rig.set('elR', -0.6);
          rig.set('torso', 0, 0.1, 0); rig.set('body', -0.08 + Math.sin(t * 40) * 0.02, 0, 0);
        } else {
          // turn to the camera, sheepish hand behind the head
          f.root.rotation.y = damp(f.root.rotation.y, 0.25, 10, 1 / 60);

        }

      end(f) { f.rig.j.gun.visible = false; f.sp.sorry = false; },
    },

    /* MARK ZUCKERBOT — "Metaverse Takedown": jiu-jitsu slam while the world goes wireframe */
    zuck: {
      dur: 1.35,
      start(f) { f.sp.grab = false; f.sp.slam = false; setMetaverse(true); },
      update(f, t, dt) {
        const sp = f.sp;
        if (t < 0.3) dash(f, 11, dt);
        if (t >= 0.3 && !sp.grab) sp.grab = Combat.inRange(f, 1.3);
        if (sp.grab && !sp.slam) Truck.extLift = ease(clamp((t - 0.3) / 0.42, 0, 1));

          if (sp.grab) { Sound.play('stamp'); Truck.bounceV -= 6; hit(f, DMG, 3, 1.3); _v3.set(Truck.frontX() + 1, 0.2, 0.8); FX.burst('puff', _v3, 14, { scale: 1.6 }); }
        }

      },
      pose(rig, t) {

        else if (t < 0.74) { rig.set('shL', -2.7, 0, -0.2); rig.set('shR', -2.7, 0, 0.2); rig.set('elL', -0.4); rig.set('elR', -0.4); rig.set('body', -0.25, 0, 0); rig.bodyPos[1] = 0.08; }
        else { rig.set('shL', -0.8); rig.set('shR', -0.8); rig.set('body', 0.5, 0, 0); rig.set('hipL', -1.0); rig.set('kneeL', 1.2); rig.bodyPos[1] = -0.2; }
      },

    /* DEMIS HASSABYTE — "AlphaStrike": time slows, he computes, then one perfect hit */
    hassabyte: {

      update(f, t, dt) {

          sp.struck = true;
          Sound.play('ding');

        }
      },
      pose(rig, t) {
        if (t < 0.42) {
          rig.set('shR', -1.1, 0, 0.45); rig.set('elR', -2.4);          // hand on chin, computing
          rig.set('shL', -1.3, 0, -0.1); rig.set('elL', -0.2);          // pointing at the target
